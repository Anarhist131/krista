<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a0b2e">
<title>Криста.Net — Технические работы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; width: 100%; overflow: hidden;
    font-family: 'Inter', sans-serif;
    color: #fff;
    background: linear-gradient(180deg, #1a0b2e 0%, #4a1a30 40%, #ff3b30 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  /* Синтвейв-сетка на фоне */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(0deg, transparent 24%, rgba(255,255,255,0.06) 25%, transparent 27%),
      linear-gradient(90deg, transparent 24%, rgba(255,255,255,0.06) 25%, transparent 27%);
    background-size: 40px 40px;
    transform: perspective(500px) rotateX(60deg) scale(3);
    transform-origin: bottom center;
    animation: moveGrid 12s linear infinite;
    opacity: 0.5;
    pointer-events: none;
  }
  @keyframes moveGrid {
    from { background-position: 0 0; }
    to { background-position: 0 40px; }
  }
  .card {
    position: relative; z-index: 2;
    max-width: 360px; width: 100%;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 28px;
    padding: 40px 24px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    animation: appear 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes appear {
    from { opacity: 0; transform: scale(0.85) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .icon {
    font-size: 64px;
    line-height: 1;
    margin-bottom: 20px;
    display: inline-block;
    animation: spin 4s linear infinite;
  }
  @keyframes spin {
    0% { transform: rotate(0); }
    100% { transform: rotate(360deg); }
  }
  h1 {
    font-family: 'Comfortaa', sans-serif;
    font-size: 22px;
    font-weight: 800;
    color: #ff3b30;
    text-shadow: 0 0 20px rgba(255, 59, 48, 0.6);
    margin-bottom: 12px;
    line-height: 1.3;
  }
  p {
    font-size: 14px;
    color: rgba(255,255,255,0.75);
    line-height: 1.5;
    margin-bottom: 6px;
  }
  .dots {
    margin-top: 24px;
    display: inline-flex;
    gap: 8px;
  }
  .dots span {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #ff3b30;
    box-shadow: 0 0 10px #ff3b30;
    animation: bounce 1.4s infinite ease-in-out both;
  }
  .dots span:nth-child(1) { animation-delay: -0.32s; }
  .dots span:nth-child(2) { animation-delay: -0.16s; }
  .dots span:nth-child(3) { animation-delay: 0s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
    40% { transform: scale(1); opacity: 1; }
  }
  .timer {
    margin-top: 20px;
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    font-style: italic;
  }
</style>
</head>
<body>

<div class="card">
  <div class="icon">⚙️</div>
  <h1>Ведутся технические работы</h1>
  <p>Мы обновляем серверы и чиним баги.</p>
  <p>Скоро вернёмся! 🚀</p>
  <div class="dots"><span></span><span></span><span></span></div>
  <div class="timer" id="timer">Страница обновится через 30 сек.</div>
</div>

<script>
  // Разворачиваем на весь экран, если открыто в Telegram
  if (window.Telegram?.WebApp) {
    try {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
      if (window.Telegram.WebApp.setHeaderColor) window.Telegram.WebApp.setHeaderColor('#1a0b2e');
    } catch (e) {}
  }

  // Авто-перезагрузка раз в 30 секунд
  let seconds = 30;
  const timerEl = document.getElementById('timer');
  const interval = setInterval(() => {
    seconds--;
    if (seconds <= 0) {
      clearInterval(interval);
      timerEl.textContent = 'Обновляем...';
      location.reload();
    } else {
      timerEl.textContent = `Страница обновится через ${seconds} сек.`;
    }
  }, 1000);
</script>
</body>
</html>
