<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a1020">
<title>Криста.ФриРунет v4.0</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
:root{
  --bg-1:#1a1020;--bg-2:#2a1a30;--bg-3:#201828;
  --glass:rgba(255,255,255,.05);--glass-2:rgba(255,255,255,.09);--glass-3:rgba(255,255,255,.14);
  --glass-border:rgba(255,255,255,.14);
  --text:#f5e8f0;--text-2:rgba(245,232,240,.72);--text-3:rgba(245,232,240,.42);
  --accent:#f0a0c8;--accent-2:#d67aa8;--accent-soft:rgba(240,160,200,.18);
  --accent-glow:rgba(240,160,200,.35);--on-accent:#2a1020;
  --danger:#ff8aa0;--success:#8ee0a8;
  --font-head:'Comfortaa',sans-serif;--font-body:'Inter',sans-serif;
  --blur:18px;--rad:14px;--rad-sm:10px;
  --safe-top:env(safe-area-inset-top,0);--safe-bottom:env(safe-area-inset-bottom,0);
  --sidebar-w:60px;
  --msg-in-opacity:1;--msg-out-opacity:1;
}
html,body{height:100%;overflow:hidden;position:fixed;inset:0;width:100%;font-family:var(--font-body);font-size:14px;color:var(--text);background:linear-gradient(135deg,var(--bg-1),var(--bg-2),var(--bg-3));background-attachment:fixed;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 20% 20%,rgba(240,160,200,.12),transparent 45%),radial-gradient(circle at 80% 80%,rgba(200,150,255,.10),transparent 45%);pointer-events:none;z-index:0}
#app{width:100%;max-width:640px;height:100%;margin:0 auto;display:flex;position:relative;overflow:hidden;z-index:1}

/* SIDEBAR */
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:rgba(255,255,255,.04);backdrop-filter:blur(var(--blur)) saturate(1.3);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.3);border-right:1px solid var(--glass-border);display:flex;flex-direction:column;align-items:center;padding-top:calc(12px + var(--safe-top));padding-bottom:calc(12px + var(--safe-bottom));gap:6px;z-index:10}
.sb-btn{width:42px;height:42px;flex-shrink:0;background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;color:var(--text-2);font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:all .18s;position:relative}
.sb-btn:active{transform:scale(.94)}
.sb-btn.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:var(--on-accent);box-shadow:0 6px 22px var(--accent-glow);font-weight:700}
.sb-btn .sb-badge{position:absolute;top:-4px;right:-4px;background:var(--accent);color:var(--on-accent);font-size:9px;font-weight:700;min-width:16px;height:16px;border-radius:8px;padding:0 4px;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg-1);line-height:1}
.sidebar-spacer{flex:1;min-height:8px}
.sidebar-brand{writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:center;gap:8px;flex-shrink:0;padding:10px 4px;font-family:var(--font-head);font-weight:700;font-size:12px;letter-spacing:4px;text-transform:uppercase;white-space:nowrap;color:var(--accent);text-shadow:0 0 12px rgba(240,160,200,.4)}
.sidebar-brand .brand-emoji{font-size:16px;letter-spacing:0;filter:drop-shadow(0 0 4px rgba(240,160,200,.5))}
.sidebar-brand .brand-sep{color:var(--text-3);margin:0 2px;opacity:.6}
.sidebar-brand .brand-ver{color:var(--text-3);font-size:10px;letter-spacing:3px;font-weight:400;margin-left:6px;opacity:.7}

/* MAIN */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;overflow:hidden}

/* PROFILE PREVIEW */
.profile-preview{flex-shrink:0;margin:10px 10px 0;padding:10px 12px;padding-top:calc(10px + var(--safe-top));background:var(--glass);backdrop-filter:blur(var(--blur)) saturate(1.3);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.3);border:1px solid var(--glass-border);border-radius:var(--rad);display:flex;align-items:center;gap:10px;cursor:pointer;position:relative;box-shadow:0 4px 20px rgba(0,0,0,.2);transition:all .15s}
.profile-preview:active{transform:scale(.99);background:var(--glass-2)}
.pp-avatar{width:42px;height:42px;flex-shrink:0;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;font-family:var(--font-head);text-shadow:0 1px 2px rgba(0,0,0,.3);position:relative;box-shadow:0 4px 12px rgba(240,160,200,.3);overflow:hidden}
.pp-avatar img{width:100%;height:100%;object-fit:cover}
.pp-avatar.online::after{content:'';position:absolute;bottom:-2px;right:-2px;width:12px;height:12px;border-radius:50%;background:var(--success);border:2px solid var(--bg-1);box-sizing:content-box;box-shadow:0 0 8px rgba(142,224,168,.6)}
.pp-info{flex:1;min-width:0}
.pp-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:baseline;gap:6px;line-height:1.2;font-family:var(--font-head)}
.pp-login{font-size:10px;color:var(--text-3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:italic}
.pp-label{position:absolute;top:8px;right:10px;font-size:8px;color:var(--accent);letter-spacing:1.5px;text-transform:uppercase;font-weight:700;font-family:var(--font-head);opacity:.7}
.pp-edit{width:32px;height:32px;flex-shrink:0;border:1px solid var(--glass-border);background:var(--glass-2);color:var(--accent);font-size:13px;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;border-radius:10px}
.pp-edit:active{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);border-color:transparent}

/* FOLDERS */
.folders-area{flex:1;overflow-y:auto;min-height:0;padding:12px 10px 80px}
.folders-area::-webkit-scrollbar{width:5px}
.folders-area::-webkit-scrollbar-thumb{background:var(--glass-border);border-radius:3px}
.folder{background:var(--glass);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--glass-border);border-radius:var(--rad);margin-bottom:8px;overflow:hidden;transition:all .15s}
.folder.open{background:var(--glass-2);box-shadow:0 4px 20px rgba(0,0,0,.15)}
.folder-header{display:flex;align-items:center;padding:11px 14px;cursor:pointer;gap:10px;position:relative}
.folder-header:active{background:var(--glass-3)}
.folder-chevron{width:14px;flex-shrink:0;font-size:11px;color:var(--accent);text-align:center;transition:transform .2s;font-weight:700}
.folder.open .folder-chevron{transform:rotate(90deg)}
.folder-icon{width:18px;flex-shrink:0;font-size:14px;text-align:center}
.folder-name{flex:1;min-width:0;font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--font-head)}
.folder-name .pin-mark{color:var(--accent);font-size:10px;margin-left:4px;filter:drop-shadow(0 0 4px rgba(240,160,200,.6))}
.folder-count{font-size:11px;color:var(--accent);flex-shrink:0;font-weight:700;font-family:var(--font-head);padding:2px 8px;background:var(--accent-soft);border-radius:10px;border:1px solid rgba(240,160,200,.25)}
.folder-menu-btn{width:28px;height:28px;flex-shrink:0;background:transparent;border:1px solid transparent;color:var(--text-3);font-size:14px;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;border-radius:8px;transition:all .15s}
.folder-menu-btn:active{background:var(--glass-3);color:var(--accent);border-color:var(--glass-border)}
.folder-body{display:none;padding:2px 6px 6px}
.folder.open .folder-body{display:block}
.folder-empty{padding:12px 20px;font-size:11px;color:var(--text-3);font-style:italic;text-align:center}

/* CHAT ROW */
.chat-row{display:flex;align-items:center;gap:10px;padding:9px 10px 9px 26px;cursor:pointer;border-radius:var(--rad-sm);margin-top:4px;background:rgba(255,255,255,.02);transition:all .15s;border:1px solid transparent}
.chat-row:active{background:var(--glass-3);border-color:var(--glass-border);transform:scale(.99)}
.chat-avatar{width:36px;height:36px;flex-shrink:0;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;font-family:var(--font-head);text-shadow:0 1px 2px rgba(0,0,0,.3);position:relative;box-shadow:0 3px 10px rgba(240,160,200,.25);overflow:hidden}
.chat-avatar img{width:100%;height:100%;object-fit:cover}
.chat-avatar.online::after{content:'';position:absolute;bottom:-2px;right:-2px;width:10px;height:10px;border-radius:50%;background:var(--success);border:2px solid var(--bg-1);box-sizing:content-box;box-shadow:0 0 6px rgba(142,224,168,.7)}
.chat-info{flex:1;min-width:0}
.chat-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;display:flex;align-items:baseline;gap:5px;font-family:var(--font-head)}
.chat-name .chat-emoji{font-size:12px}
.chat-preview{font-size:10.5px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:italic}
.chat-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.chat-time{font-size:10px;color:var(--text-3);font-weight:500}
.chat-badge{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);font-size:9px;font-weight:700;padding:1px 6px;min-width:18px;text-align:center;border-radius:9px;font-family:var(--font-head);box-shadow:0 2px 8px rgba(240,160,200,.4)}

/* NEW FOLDER BUTTON */
.new-folder-btn{position:absolute;bottom:calc(14px + var(--safe-bottom));left:12px;right:12px;padding:12px;border:1px dashed rgba(240,160,200,.4);background:var(--glass);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));color:var(--accent);font-family:var(--font-head);font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;border-radius:var(--rad);z-index:5;transition:all .15s;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.new-folder-btn:active{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);border-style:solid;border-color:transparent;transform:scale(.98)}

/* CONTEXT MENU */
.ctx-menu{position:fixed;background:rgba(40,25,45,.95);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border:1px solid var(--glass-border);border-radius:var(--rad);box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:200;min-width:180px;display:none;padding:6px;animation:scaleIn .15s ease}
@keyframes scaleIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.ctx-menu.open{display:block}
.ctx-item{padding:10px 12px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--text);border-radius:10px;font-family:var(--font-head)}
.ctx-item:active{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent)}
.ctx-item.danger{color:var(--danger)}
.ctx-item.danger:active{background:var(--danger);color:#fff}
.ctx-sep{height:1px;background:var(--glass-border);margin:4px 8px}

/* MODALS */
.modal-overlay{position:fixed;inset:0;background:rgba(10,5,15,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:300;display:none;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-overlay.open{display:flex}
.modal-box{width:100%;max-width:340px;background:rgba(255,255,255,.1);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);border:1px solid var(--glass-border);border-radius:20px;display:flex;flex-direction:column;max-height:85vh;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:scaleIn .25s ease;overflow:hidden}
.modal-header{padding:16px 18px;border-bottom:1px solid var(--glass-border);display:flex;align-items:center;justify-content:space-between}
.modal-header h3{font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;font-family:var(--font-head);color:var(--accent)}
.modal-close{width:30px;height:30px;border:1px solid var(--glass-border);background:var(--glass-2);color:var(--text-2);font-size:14px;font-weight:700;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;border-radius:10px;font-family:inherit}
.modal-close:active{background:var(--glass-3);color:var(--accent)}
.modal-body{padding:16px 18px;overflow-y:auto}
.modal-body label{display:block;font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-3);margin-bottom:6px;font-family:var(--font-head)}
.modal-body input,.modal-body textarea,.modal-body select{width:100%;border:1px solid var(--glass-border);background:var(--glass-2);color:var(--text);font-family:var(--font-body);font-size:14px;padding:11px 14px;outline:none;margin-bottom:14px;border-radius:12px;caret-color:var(--accent)}
.modal-body input:focus,.modal-body textarea:focus{border-color:var(--accent);background:var(--glass-3)}
.modal-body input::placeholder{color:var(--text-3)}
.modal-actions{display:flex;gap:8px;padding:14px 18px;border-top:1px solid var(--glass-border)}
.modal-actions button{flex:1;border:1px solid var(--glass-border);background:var(--glass-2);color:var(--text-2);font-family:var(--font-head);font-size:11px;font-weight:700;padding:11px;cursor:pointer;letter-spacing:.8px;text-transform:uppercase;border-radius:12px}
.modal-actions button:active{background:var(--glass-3)}
.modal-actions button.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);border-color:transparent;box-shadow:0 4px 16px var(--accent-glow)}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--glass-border);gap:12px}
.setting-row:last-child{border-bottom:none}
.setting-row span{font-size:13px;font-family:var(--font-head);font-weight:600}
.toggle-btn{background:var(--glass-2);border:1px solid var(--glass-border);color:var(--text-2);font-family:var(--font-head);font-weight:700;font-size:11px;padding:7px 14px;border-radius:10px;cursor:pointer;letter-spacing:.5px;min-width:64px;text-align:center}
.toggle-btn.on{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);border-color:transparent;box-shadow:0 3px 12px var(--accent-glow)}

/* CHAT SCREEN */
.chat-screen{position:absolute;inset:0;background:linear-gradient(135deg,var(--bg-1),var(--bg-2));z-index:50;display:none;flex-direction:column}
.chat-screen.open{display:flex;animation:slideIn .25s cubic-bezier(.32,.72,0,1)}
@keyframes slideIn{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}
.chat-header{flex-shrink:0;padding:10px 12px;padding-top:calc(10px + var(--safe-top));background:var(--glass);backdrop-filter:blur(var(--blur)) saturate(1.3);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.3);border-bottom:1px solid var(--glass-border);display:flex;align-items:center;gap:10px;box-shadow:0 2px 20px rgba(0,0,0,.2)}
.back-btn{width:38px;height:38px;flex-shrink:0;background:var(--glass-2);border:1px solid var(--glass-border);color:var(--accent);font-size:17px;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;border-radius:12px;font-family:var(--font-head);font-weight:700}
.back-btn:active{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);border-color:transparent}
.ch-avatar{width:38px;height:38px;flex-shrink:0;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;font-family:var(--font-head);text-shadow:0 1px 2px rgba(0,0,0,.3);position:relative;box-shadow:0 3px 10px rgba(240,160,200,.3);overflow:hidden}
.ch-avatar img{width:100%;height:100%;object-fit:cover}
.ch-avatar.online::after{content:'';position:absolute;bottom:-2px;right:-2px;width:10px;height:10px;border-radius:50%;background:var(--success);border:2px solid var(--bg-1);box-sizing:content-box;box-shadow:0 0 6px rgba(142,224,168,.7)}
.ch-info{flex:1;min-width:0}
.ch-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;font-family:var(--font-head)}
.ch-sub{font-size:10px;color:var(--accent);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:italic;opacity:.8}

.messages{flex:1;overflow-y:auto;min-height:0;padding:14px 12px;position:relative}
.messages::-webkit-scrollbar{width:5px}
.messages::-webkit-scrollbar-thumb{background:var(--glass-border);border-radius:3px}
.msg{margin-bottom:10px;display:flex;flex-direction:column;max-width:100%}
.msg.in{align-items:flex-start}
.msg.out{align-items:flex-end}
.msg-sender{font-size:10px;font-weight:700;letter-spacing:.5px;margin-bottom:3px;padding:0 6px;font-family:var(--font-head);color:var(--accent)}
.msg.out .msg-sender{color:var(--text-3)}
.msg-bubble{background:rgba(255,255,255,.18);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--glass-border);padding:9px 13px;max-width:85%;line-height:1.45;font-size:13.5px;word-wrap:break-word;border-radius:16px 16px 16px 4px;color:var(--text);box-shadow:0 4px 14px rgba(0,0,0,.15);opacity:var(--msg-in-opacity,1)}
.msg.out .msg-bubble{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);border-color:transparent;border-radius:16px 16px 4px 16px;box-shadow:0 6px 20px var(--accent-glow);font-weight:500;opacity:var(--msg-out-opacity,1)}
.msg-bubble img{max-width:100%;max-height:280px;border-radius:10px;display:block;cursor:pointer}
.msg-bubble audio,.msg-bubble video{max-width:100%;border-radius:10px;margin-top:4px}
.msg-bubble .file-doc{display:flex;align-items:center;gap:10px;padding:4px 0;cursor:pointer}
.msg-bubble .file-icon{font-size:26px;flex-shrink:0}
.msg-bubble .file-info{flex:1;min-width:0}
.msg-bubble .file-name{font-size:13px;font-weight:600;word-break:break-all;line-height:1.3}
.msg-bubble .file-size{font-size:11px;opacity:.7;margin-top:2px}
.msg-bubble .link{color:var(--accent);text-decoration:underline;cursor:pointer}
.msg.out .msg-bubble .link{color:var(--on-accent)}
.msg-time{font-size:9px;color:var(--text-3);margin-top:4px;padding:0 6px;letter-spacing:.3px}
.msg.out .msg-time{text-align:right}
.msg.pending .msg-bubble{opacity:.7}
.msg.failed .msg-bubble{border-color:var(--danger)}
.msg-fwd{font-size:10px;font-style:italic;margin-bottom:4px;opacity:.75;font-family:var(--font-head)}
.msg-reply{background:rgba(0,0,0,.2);border-left:2px solid var(--accent);padding:4px 8px;margin-bottom:5px;border-radius:8px;font-size:11px;opacity:.85}

.chat-input-bar{flex-shrink:0;padding:10px 12px;padding-bottom:calc(10px + var(--safe-bottom));background:var(--glass);backdrop-filter:blur(var(--blur)) saturate(1.3);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.3);border-top:1px solid var(--glass-border);display:flex;gap:8px;align-items:stretch}
.chat-input-bar .icn-btn{width:44px;height:44px;flex-shrink:0;background:var(--glass-2);border:1px solid var(--glass-border);color:var(--text-2);font-size:17px;cursor:pointer;padding:0;border-radius:14px;display:flex;align-items:center;justify-content:center}
.chat-input-bar .icn-btn:active{background:var(--glass-3);color:var(--accent)}
.chat-input-bar input{flex:1;min-width:0;background:var(--glass-2);border:1px solid var(--glass-border);color:var(--text);font-family:var(--font-body);font-size:14px;padding:11px 14px;outline:none;min-height:44px;border-radius:14px;caret-color:var(--accent)}
.chat-input-bar input::placeholder{color:var(--text-3);font-style:italic}
.chat-input-bar input:focus{border-color:var(--accent);background:var(--glass-3)}
.chat-input-bar .send-btn{flex-shrink:0;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);font-family:var(--font-head);font-size:11px;font-weight:700;padding:0 16px;cursor:pointer;letter-spacing:.5px;text-transform:uppercase;min-height:44px;border:none;border-radius:14px;box-shadow:0 4px 16px var(--accent-glow)}

<script>
// ============================================================
//  КРИСТА.ФРИРУНЕТ v4.0
// ============================================================
const WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;
const MAX_FILE_SIZE = 20 * 1024 * 1024;
const DEFAULT_EMOJIS = ['👍','👎','❤️','🔥','😂','😢','😡','😀','😁','🥺','🙂','😉','😊','🥰','😍','😘','😋','😎','🤔','🤗','🤩','😴','😷','🥳','😭','😱','😡','🤬','💩','👻','💀','🤖','👽','🐱','🐶','🦊','🌸','🌺','🌈','⭐','✨','💫','☀️','🌙','⚡','💧','🍕','🍔','🍰','☕','🎵','🎶','🎧','🎤','📎','📁','📸','💻','📱','✅','❌','⚠️','🔔','💬','🎉'];
const REACTIONS = ['❤️','🔥','👍','😂','😢','😡'];

let token = localStorage.getItem('krista_token') || null;
let currentUser = JSON.parse(localStorage.getItem('krista_user') || 'null');
let ws = null, wsState = 'offline', lastPongAt = 0, pingInt = null, wdInt = null;
let chats = [], currentChatId = null, currentChatMeta = null;
let messages = {}, onlineStatus = {};
let folders = [], editingFolderId = null;
let sendQueue = [], reconnectTimer = null;
let ui = JSON.parse(localStorage.getItem('krista_ui') || '{}');
ui.accent = ui.accent || '#f0a0c8';
ui.blur = ui.blur !== undefined ? ui.blur : 18;
ui.msgInOpacity = ui.msgInOpacity !== undefined ? ui.msgInOpacity : 1;
ui.msgOutOpacity = ui.msgOutOpacity !== undefined ? ui.msgOutOpacity : 1;
let profile = { emoji:'🌸', name:'ЛесГем', login:'', status:'так видят тебя другие' };
let authMode = 'login';

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
const fmtSize = b => !b ? '' : b < 1024 ? b + ' Б' : b < 1048576 ? (b/1024).toFixed(1) + ' КБ' : (b/1048576).toFixed(2) + ' МБ';
const fTime = iso => { try { return new Date(iso).toTimeString().slice(0,5); } catch { return ''; } };
const shade = (hex, pct) => { try { const n = parseInt(hex.replace('#',''),16), r = Math.max(0,Math.min(255,(n>>16)+pct)), g = Math.max(0,Math.min(255,((n>>8)&0xff)+pct)), b = Math.max(0,Math.min(255,(n&0xff)+pct)); return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0'); } catch { return hex; } };
const getAvatarUrl = id => id ? `/api/file/${id}?token=${encodeURIComponent(token || '')}` : '';
const avatarInner = u => { if (!u) return '<span>?</span>'; if (u.avatarFileId) return `<img src="${getAvatarUrl(u.avatarFileId)}" alt="">`; return esc(((u.nickname || u.login || '?')[0] || '?').toUpperCase()); };

async function api(url, opts = {}) {
  const h = { 'Content-Type':'application/json', ...(opts.headers||{}) };
  if (token) h.Authorization = 'Bearer ' + token;
  const r = await fetch(url, { ...opts, headers: h });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.error || 'Ошибка'); e.status = r.status; throw e; }
  return d;
}

function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 2200); }
window.toast = toast;

function closeModal(id) { $(id).classList.remove('open'); }
window.closeModal = closeModal;
document.querySelectorAll('.modal-overlay').forEach(m => m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); }));

// UI APPLY
function applyUI() {
  document.body.style.setProperty('--accent', ui.accent);
  document.body.style.setProperty('--accent-2', shade(ui.accent, -25));
  document.body.style.setProperty('--accent-soft', `rgba(${hexRgb(ui.accent)},.18)`);
  document.body.style.setProperty('--accent-glow', `rgba(${hexRgb(ui.accent)},.35)`);
  document.body.style.setProperty('--blur', ui.blur + 'px');
  document.body.style.setProperty('--msg-in-opacity', String(ui.msgInOpacity));
  document.body.style.setProperty('--msg-out-opacity', String(ui.msgOutOpacity));
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', ui.accent);
  localStorage.setItem('krista_ui', JSON.stringify(ui));
}
function hexRgb(hex) { try { const n = parseInt(hex.replace('#',''),16); return [(n>>16)&255,(n>>8)&255,n&255].join(','); } catch { return '240,160,200'; } }

// WS
function connectWS() {
  if (!token) return;
  if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;
  try { if (ws) ws.close(); } catch {}
  wsState = 'connecting';
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    ws.send(JSON.stringify({ type:'auth', payload:{ token } }));
    lastPongAt = Date.now();
    wsState = 'online';
    startHeartbeat();
    flushQueue();
    if (currentChatId) sendWS({ type:'activeChat', payload:{ chatId: currentChatId } });
  };
  ws.onmessage = e => {
    try { const d = JSON.parse(e.data); if (d.type === 'pong') { lastPongAt = Date.now(); return; } if (d.type === 'ping') { try { ws.send(JSON.stringify({ type:'pong' })); } catch {} return; } handleWS(d); } catch {}
  };
  ws.onclose = () => {
    ws = null; stopHeartbeat(); wsState = 'offline';
    if (token) { if (reconnectTimer) clearTimeout(reconnectTimer); reconnectTimer = setTimeout(connectWS, 2000); }
  };
}
function startHeartbeat() {
  stopHeartbeat();
  pingInt = setInterval(() => { if (ws?.readyState === 1) try { ws.send(JSON.stringify({ type:'ping' })); } catch {} }, 5000);
  wdInt = setInterval(() => { if (ws?.readyState === 1 && Date.now() - lastPongAt > 35000) { try { ws.close(); } catch {} } }, 6000);
}
function stopHeartbeat() { if (pingInt) clearInterval(pingInt), pingInt = null; if (wdInt) clearInterval(wdInt), wdInt = null; }
function flushQueue() { if (!sendQueue.length || !ws || ws.readyState !== 1) return; const q = [...sendQueue]; sendQueue = []; q.forEach(p => { try { ws.send(JSON.stringify({ type:'newMessage', payload:p })); } catch { sendQueue.push(p); } }); }
function sendWS(o) { if (ws && ws.readyState === 1) try { ws.send(JSON.stringify(o)); return true; } catch {} return false; }

async function handleWS(data) {
  const { type, payload } = data;
  if (type === 'newMessage') {
    if (!messages[payload.chatId]) messages[payload.chatId] = [];
    if (messages[payload.chatId].some(m => m.id === payload.id || (payload.clientId && m.clientId === payload.clientId))) {
      const i = messages[payload.chatId].findIndex(m => m.clientId && m.clientId === payload.clientId);
      if (i !== -1) messages[payload.chatId][i] = payload;
      if (currentChatId === payload.chatId) renderMessages();
      return;
    }
    messages[payload.chatId].push(payload);
    if (currentChatId === payload.chatId) { renderMessages(); sendWS({ type:'delivered', payload:{ messageId: payload.id } }); }
    loadChats();
  } else if (type === 'messageAck') {
    if (payload.clientId && messages[currentChatId]) {
      const i = messages[currentChatId].findIndex(m => m.clientId === payload.clientId);
      if (i !== -1) { messages[currentChatId][i].pending = false; messages[currentChatId][i].id = payload.id; renderMessages(); }
    }
  } else if (type === 'status') {
    onlineStatus[payload.login] = payload.status === 'online';
    renderFolders();
  } else if (type === 'userUpdated') {
    if (currentChatMeta?.otherLogin === payload.login) { currentChatMeta.otherUser = payload; updateChatHeader(currentChatMeta); }
    renderFolders();
  } else if (type === 'typing') {
    if (payload.chatId === currentChatId) toast(payload.nickname + ' печатает...');
  } else if (['chatCreated','chatRenamed','memberAdded','memberRemoved','adminChanged','chatDeleted','chatCleared'].includes(type)) {
    loadChats();
  }
}

// LOAD CHATS
async function loadChats() {
  if (!token) return;
  try {
    const fresh = await api('/api/chats');
    chats = fresh;
    renderFolders();
    updateChatsBadge();
  } catch (e) { if (e.status === 401) logout(); }
}

async function loadFolders() {
  if (!token) return;
  try {
    folders = await api('/api/folders');
    renderFolders();
  } catch (e) { console.error(e); }
}

function updateChatsBadge() {
  const total = chats.reduce((s, c) => s + (c.unreadCount || 0), 0);
  const b = $('sbChatsBadge');
  if (total > 0) { b.textContent = total > 99 ? '99+' : total; b.style.display = 'flex'; }
  else b.style.display = 'none';
}

// FOLDERS RENDER
function getChatsForFolder(f) {
  if (f.system) {
    switch (f.filter) {
      case 'unread': return chats.filter(c => c.unreadCount > 0);
      case 'online': return chats.filter(c => !c.isGroup && (c.otherUser?.online || onlineStatus[c.otherLogin]));
      case 'offline': return chats.filter(c => !c.isGroup && !(c.otherUser?.online || onlineStatus[c.otherLogin]));
      case 'all': return chats;
    }
    return [];
  }
  return (f.chatIds || []).map(id => chats.find(c => c.id === id)).filter(Boolean);
}

function folderCount(f) {
  if (f.system && f.filter === 'unread') return getChatsForFolder(f).reduce((s, c) => s + (c.unreadCount || 0), 0);
  return getChatsForFolder(f).length;
}

function renderFolders() {
  const area = $('foldersArea');
  if (!folders.length) {
    area.innerHTML = `<div class="empty"><div class="big">🌸 Криста<small>ФриРунет</small></div>Пока нет папок.<br>Нажми «＋ Новая папка» снизу.</div>`;
    return;
  }
  const sorted = [...folders.filter(f => f.pinned), ...folders.filter(f => !f.pinned)];
  area.innerHTML = sorted.map(f => {
    const cnt = folderCount(f);
    const list = getChatsForFolder(f);
    return `<div class="folder ${f.open?'open':''}">
      <div class="folder-header" onclick="toggleFolder('${f.id}')" oncontextmenu="event.preventDefault();openFolderCtx(event,'${f.id}')">
        <div class="folder-chevron">▶</div>
        <div class="folder-icon">${esc(f.icon)}</div>
        <div class="folder-name">${esc(f.name)}${f.pinned?'<span class="pin-mark">📌</span>':''}</div>
        <div class="folder-count">${cnt}</div>
        <button class="folder-menu-btn" onclick="event.stopPropagation();openFolderCtx(event,'${f.id}')">⋮</button>
      </div>
      <div class="folder-body">
        ${list.length ? list.map(renderChatRow).join('') : '<div class="folder-empty">— пусто —</div>'}
      </div>
    </div>`;
  }).join('');
}

function renderChatRow(c) {
  const isOn = c.isGroup ? false : (c.otherUser?.online || onlineStatus[c.otherLogin]);
  const u = c.isGroup ? null : c.otherUser;
  const av = c.isGroup
    ? (c.avatarFileId ? `<img src="${getAvatarUrl(c.avatarFileId)}" alt="">` : '<span style="color:#fff">#</span>')
    : avatarInner(u);
  const emoji = u?.nicknameEmoji ? `<span class="chat-emoji">${esc(u.nicknameEmoji)}</span>` : '';
  const name = c.isGroup ? c.name : (u?.nickname || c.otherLogin || '?');
  const preview = c.lastMessage ? ((c.lastMessage.text || '').slice(0, 40) || '📎 файл') : 'нет сообщений';
  return `<div class="chat-row" onclick="openChat('${c.id}')">
    <div class="chat-avatar ${isOn?'online':''}">${av}</div>
    <div class="chat-info">
      <div class="chat-name">${emoji}<span>${esc(name)}</span></div>
      <div class="chat-preview">${esc(preview)}</div>
    </div>
    <div class="chat-right">
      <div class="chat-time">${c.lastMessage ? fTime(c.lastMessage.timestamp) : ''}</div>
      ${c.unreadCount > 0 ? `<div class="chat-badge">${c.unreadCount}</div>` : ''}
    </div>
  </div>`;
}

function toggleFolder(id) { const f = folders.find(x => x.id === id); if (!f) return; f.open = !f.open; renderFolders(); api('/api/folders/' + id, { method:'PUT', body:JSON.stringify({ open: f.open }) }).catch(()=>{}); }
window.toggleFolder = toggleFolder;

let ctxFolderId = null;
function openFolderCtx(event, id) {
  event.stopPropagation(); ctxFolderId = id;
  const f = folders.find(x => x.id === id); if (!f) return;
  const menu = $('ctxMenu');
  let items = '';
  if (!f.system) items += `<div class="ctx-item" onclick="editFolder('${id}')">✎ Переименовать</div>`;
  items += `<div class="ctx-item" onclick="togglePin('${id}')">${f.pinned?'📌 Открепить':'📌 Закрепить сверху'}</div>`;
  if (!f.system) items += `<div class="ctx-sep"></div><div class="ctx-item danger" onclick="deleteFolder('${id}')">✕ Удалить папку</div>`;
  menu.innerHTML = items;
  menu.classList.add('open');
  const x = event.clientX || 100, y = event.clientY || 100;
  const w = menu.offsetWidth || 180, h = menu.offsetHeight || 150;
  menu.style.left = Math.min(x, window.innerWidth - w - 8) + 'px';
  menu.style.top = Math.min(y, window.innerHeight - h - 8) + 'px';
}
window.openFolderCtx = openFolderCtx;
document.addEventListener('click', e => { if (!e.target.closest('#ctxMenu')) $('ctxMenu').classList.remove('open'); });

async function togglePin(id) {
  const f = folders.find(x => x.id === id); if (!f) return;
  f.pinned = !f.pinned;
  await api('/api/folders/' + id, { method:'PUT', body:JSON.stringify({ pinned: f.pinned }) }).catch(()=>{});
  renderFolders();
  toast(f.pinned ? '📌 Закреплено' : 'Откреплено');
}
window.togglePin = togglePin;

async function deleteFolder(id) {
  if (!confirm('Удалить папку?')) return;
  try { await api('/api/folders/' + id, { method:'DELETE' }); folders = folders.filter(f => f.id !== id); renderFolders(); toast('Удалено'); } catch (e) { toast(e.message); }
}
window.deleteFolder = deleteFolder;

function createFolder() {
  editingFolderId = null;
  $('folderModalTitle').textContent = 'Новая папка';
  $('folderNameInput').value = ''; $('folderIconInput').value = '📁';
  $('folderModalSave').textContent = 'Создать';
  $('folderModal').classList.add('open');
  setTimeout(() => $('folderNameInput').focus(), 150);
}
window.createFolder = createFolder;

function editFolder(id) {
  const f = folders.find(x => x.id === id); if (!f) return;
  editingFolderId = id;
  $('folderModalTitle').textContent = 'Переименовать';
  $('folderNameInput').value = f.name;
  $('folderIconInput').value = f.icon;
  $('folderModalSave').textContent = 'Сохранить';
  $('folderModal').classList.add('open');
}
window.editFolder = editFolder;

async function saveFolder() {
  const name = $('folderNameInput').value.trim();
  const icon = $('folderIconInput').value.trim() || '📁';
  if (!name) return toast('Введите название');
  try {
    if (editingFolderId) {
      await api('/api/folders/' + editingFolderId, { method:'PUT', body:JSON.stringify({ name, icon }) });
    } else {
      await api('/api/folders', { method:'POST', body:JSON.stringify({ name, icon }) });
    }
    closeModal('folderModal');
    await loadFolders();
    toast(editingFolderId ? 'Сохранено' : 'Папка создана');
  } catch (e) { toast(e.message); }
}
window.saveFolder = saveFolder;

// PROFILE
function openProfileEdit() {
  $('profileEmoji').value = profile.emoji;
  $('profileName').value = profile.name;
  $('profileStatus').value = profile.status;
  $('profileModal').classList.add('open');
}
window.openProfileEdit = openProfileEdit;

async function saveProfile() {
  profile.emoji = $('profileEmoji').value.trim() || '🌸';
  profile.name = $('profileName').value.trim() || 'Без ника';
  profile.status = $('profileStatus').value.trim();
  updateProfileView();
  try { await api('/api/me', { method:'PUT', body:JSON.stringify({ nickname: profile.name, nicknameEmoji: profile.emoji }) }); } catch {}
  closeModal('profileModal');
  toast('Профиль обновлён');
}
window.saveProfile = saveProfile;

function updateProfileView() {
  const av = $('ppAvatar');
  av.innerHTML = currentUser?.avatarFileId ? `<img src="${getAvatarUrl(currentUser.avatarFileId)}" alt="">` : (profile.name[0] || '?').toUpperCase();
  av.classList.add('online');
  $('ppName').innerHTML = `<span>${esc(profile.emoji)} ${esc(profile.name)}</span>`;
  $('ppLogin').textContent = '@' + profile.login + (profile.status ? ' · ' + profile.status : '');
}

// SETTINGS
function setBlur(v) { ui.blur = parseInt(v); applyUI(); }
window.setBlur = setBlur;
function setMsgOpacity(type, v) {
  if (type === 'in') ui.msgInOpacity = parseInt(v) / 100;
  else ui.msgOutOpacity = parseInt(v) / 100;
  applyUI();
}
window.setMsgOpacity = setMsgOpacity;

// CHAT
async function openChat(id) {
  const c = chats.find(x => x.id === id); if (!c) return;
  currentChatId = id; currentChatMeta = c;
  const u = c.isGroup ? null : c.otherUser;
  const av = $('chAvatar');
  av.innerHTML = c.isGroup
    ? (c.avatarFileId ? `<img src="${getAvatarUrl(c.avatarFileId)}" alt="">` : '<span style="color:#fff">#</span>')
    : avatarInner(u);
  av.className = 'ch-avatar' + (!c.isGroup && (u?.online || onlineStatus[c.otherLogin]) ? ' online' : '');
  $('chName').textContent = c.isGroup ? c.name : (u?.nickname || c.otherLogin || '?');
  $('chSub').textContent = c.isGroup
    ? `${c.membersCount} участ.${c.isChannel ? ' · канал' : ''} · @${c.login || ''}`
    : ((u?.online || onlineStatus[c.otherLogin]) ? '● online' : '○ offline') + ' · @' + c.otherLogin;
  $('chatScreen').classList.add('open');
  sendWS({ type:'activeChat', payload:{ chatId: id } });
  $('messagesArea').innerHTML = '<div class="empty">Загрузка...</div>';
  try {
    messages[id] = await api('/api/chats/' + id + '/messages');
    renderMessages();
    loadChats();
  } catch (e) { $('messagesArea').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
window.openChat = openChat;

function closeChat() {
  $('chatScreen').classList.remove('open');
  currentChatId = null; currentChatMeta = null;
  sendWS({ type:'activeChat', payload:{ chatId: null } });
}
window.closeChat = closeChat;

function renderMessages() {
  const arr = messages[currentChatId] || [];
  const area = $('messagesArea');
  if (!arr.length) { area.innerHTML = '<div class="empty">Начни общение!</div>'; return; }
  const wasAtBottom = area.scrollHeight - area.scrollTop - area.clientHeight < 80;
  area.innerHTML = arr.map(m => {
    if (m.deleted) return '';
    const isOut = m.sender === currentUser?.login;
    let fileHtml = '';
    if (m.type === 'file' && m.file) {
      const f = m.file;
      if (f.kind === 'image') fileHtml = `<img src="${getAvatarUrl(f.id || f._id)}" onclick="viewImage(this.src)">`;
      else if (f.kind === 'audio' || f.kind === 'voice') fileHtml = `<audio controls src="${getAvatarUrl(f.id || f._id)}"></audio>`;
      else if (f.kind === 'video') fileHtml = `<video controls src="${getAvatarUrl(f.id || f._id)}"></video>`;
      else fileHtml = `<div class="file-doc"><span class="file-icon">📎</span><div class="file-info"><div class="file-name">${esc(f.name)}</div><div class="file-size">${fmtSize(f.size)}</div></div></div>`;
    }
    let textHtml = '';
    if (m.text && m.text.trim()) textHtml = `<div>${esc(m.text).replace(/(https?:\/\/[^\s]+)/g,'<span class="link" onclick="window.open(\'$1\',\'_blank\')">$1</span>')}</div>`;
    const fwd = m.forwardFrom ? `<div class="msg-fwd">↪ от ${esc(m.forwardFrom.name)}</div>` : '';
    return `<div class="msg ${isOut?'out':'in'} ${m.pending?'pending':''} ${m.failed?'failed':''}">
      ${!isOut && currentChatMeta?.isGroup ? `<div class="msg-sender">${esc(m.senderName)}</div>` : ''}
      <div class="msg-bubble">${fwd}${fileHtml}${textHtml}</div>
      <div class="msg-time">${fTime(m.timestamp)}${isOut && m.readBy?.length ? ' ✓✓' : ''}</div>
    </div>`;
  }).join('');
  if (wasAtBottom) area.scrollTop = area.scrollHeight;
}

function viewImage(src) { window.open(src, '_blank'); }
window.viewImage = viewImage;

function sendMsg() {
  if (!currentChatId) return;
  const inp = $('msgInput');
  const text = inp.value.trim();
  if (!text) return;
  const clientId = 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
  const opt = { id:null, clientId, chatId: currentChatId, sender: currentUser.login, senderName: currentUser.nickname, type:'text', text, timestamp: new Date().toISOString(), pending:true };
  if (!messages[currentChatId]) messages[currentChatId] = [];
  messages[currentChatId].push(opt);
  renderMessages();
  const payload = { chatId: currentChatId, text, clientId };
  inp.value = '';
  if (!sendWS({ type:'newMessage', payload })) sendQueue.push(payload);
}
window.sendMsg = sendMsg;

function toggleEmoji() { $('emojiPanel').classList.toggle('active'); }
window.toggleEmoji = toggleEmoji;

function buildEmojiGrid() {
  $('emojiGrid').innerHTML = '';
  DEFAULT_EMOJIS.forEach(e => {
    const b = document.createElement('button');
    b.textContent = e;
    b.onclick = () => { const i = $('msgInput'); i.value += e; i.focus(); };
    $('emojiGrid').appendChild(b);
  });
}

$('msgInput')?.addEventListener('keydown', e => { if (e.key === 'Enter') sendMsg(); });

$('fileInput')?.addEventListener('change', e => {
  const file = e.target.files?.[0]; e.target.value = '';
  if (!file || !currentChatId) return;
  if (file.size > MAX_FILE_SIZE) return toast('Файл >20 МБ');
  const form = new FormData();
  form.append('file', file);
  form.append('chatId', currentChatId);
  form.append('clientId', 'c_' + Date.now());
  toast('Загрузка...');
  fetch('/api/upload', { method:'POST', headers:{ Authorization:'Bearer ' + token }, body: form })
    .then(r => r.json())
    .then(d => { if (d.error) toast(d.error); else { toast('Отправлено'); loadChats(); if (currentChatId) openChat(currentChatId); } })
    .catch(() => toast('Ошибка'));
});

// AUTH
function switchAuthTab(mode) {
  authMode = mode;
  const isLogin = mode === 'login';
  $('tabLoginBtn').classList.toggle('active', isLogin);
  $('tabRegBtn').classList.toggle('active', !isLogin);
  $('lblNick').style.display = isLogin ? 'none' : 'block';
  $('authNickname').style.display = isLogin ? 'none' : 'block';
  $('authConfirm').style.display = isLogin ? 'none' : 'block';
  $('authSubmitBtn').textContent = isLogin ? 'ВОЙТИ' : 'СОЗДАТЬ';
  $('authError').textContent = '';
}
window.switchAuthTab = switchAuthTab;

$('tabLoginBtn').onclick = () => switchAuthTab('login');
$('tabRegBtn').onclick = () => switchAuthTab('reg');

$('authSubmitBtn').onclick = async () => {
  const err = $('authError'); err.textContent = '';
  const login = $('authLogin').value.trim();
  const pass = $('authPassword').value;
  try {
    $('authSubmitBtn').disabled = true;
    let d;
    if (authMode === 'login') {
      if (!login || !pass) { err.textContent = 'Заполните поля'; return; }
      d = await api('/api/login', { method:'POST', body:JSON.stringify({ login, password: pass }) });
    } else {
      const nick = $('authNickname').value.trim();
      const conf = $('authConfirm').value;
      if (!login || !nick || !pass) { err.textContent = 'Заполните все поля'; return; }
      if (pass !== conf) { err.textContent = 'Пароли не совпадают'; return; }
      d = await api('/api/register', { method:'POST', body:JSON.stringify({ login, nickname: nick, password: pass, confirmPassword: conf }) });
    }
    token = d.token; currentUser = { login: d.login, nickname: d.nickname };
    localStorage.setItem('krista_token', token);
    localStorage.setItem('krista_user', JSON.stringify(currentUser));
    await afterLogin();
  } catch (e) { err.textContent = e.message; }
  finally { $('authSubmitBtn').disabled = false; }
};

async function afterLogin() {
  try {
    const me = await api('/api/me');
    currentUser = me;
    localStorage.setItem('krista_user', JSON.stringify(me));
    profile = { emoji: me.nicknameEmoji || '🌸', name: me.nickname, login: me.login, status: 'так видят тебя другие' };
    if (me.accentColor) { ui.accent = me.accentColor; applyUI(); }
    $('loginScreen').classList.remove('active');
    $('app').style.display = 'flex';
    updateProfileView();
    buildEmojiGrid();
    await loadFolders();
    connectWS();
    await loadChats();
    setInterval(loadChats, 30000);
    updateStats();
  } catch (e) { if (e.status === 401) logout(); }
}

async function updateStats() {
  try { const s = await api('/api/stats'); $('statInfo').textContent = `Аккаунтов: ${s.accounts} · Чатов: ${s.chats} · Онлайн: ${s.online}`; } catch {}
}

function logout() {
  token = null; currentUser = null;
  localStorage.removeItem('krista_token');
  localStorage.removeItem('krista_user');
  if (ws) try { ws.close(); } catch {}
  stopHeartbeat();
  $('app').style.display = 'none';
  $('loginScreen').classList.add('active');
  switchAuthTab('login');
}
window.logout = logout;

// SIDEBAR
document.querySelectorAll('.sb-btn').forEach(btn => {
  btn.onclick = () => {
    const v = btn.dataset.view;
    document.querySelectorAll('.sb-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (v === 'settings') {
      $('accentColorInput').value = ui.accent;
      $('blurRange').value = ui.blur;
      $('opInRange').value = ui.msgInOpacity * 100;
      $('opOutRange').value = ui.msgOutOpacity * 100;
      $('settingsModal').classList.add('open');
      updateStats();
    } else if (v === 'chats') {
      document.querySelector('.sb-btn[data-view="chats"]').classList.add('active');
    } else {
      toast(v === 'catalog' ? '🌐 Каталог — скоро' : v === 'music' ? '🎵 Музыка — скоро' : v === 'contacts' ? '👥 Контакты — скоро' : v === 'search' ? '🔍 Поиск — скоро' : '＋ Создать — скоро');
      setTimeout(() => { document.querySelectorAll('.sb-btn').forEach(b => b.classList.remove('active')); document.querySelector('.sb-btn[data-view="chats"]').classList.add('active'); }, 300);
    }
  };
});

$('accentColorInput')?.addEventListener('input', e => {
  ui.accent = e.target.value;
  applyUI();
  api('/api/me', { method:'PUT', body:JSON.stringify({ accentColor: ui.accent }) }).catch(()=>{});
});

// INIT
(async function init() {
  applyUI();
  buildEmojiGrid();
  if (token && currentUser) {
    try {
      $('app').style.display = 'flex';
      const me = await api('/api/me');
      currentUser = me;
      profile = { emoji: me.nicknameEmoji || '🌸', name: me.nickname, login: me.login, status: 'так видят тебя другие' };
      if (me.accentColor) ui.accent = me.accentColor;
      applyUI();
      updateProfileView();
      await loadFolders();
      connectWS();
      await loadChats();
      setInterval(loadChats, 30000);
      updateStats();
    } catch (e) {
      if (e.status === 401) logout();
    }
  } else {
    $('loginScreen').classList.add('active');
  }
})();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
console.log('%c🌸 Криста.ФриРунет v4.0', 'color:#f0a0c8;font-family:monospace;font-size:14px');
</script>
</body>
</html>
