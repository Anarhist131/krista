<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Криста v5.71</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&family=Comfortaa:wght@400;700&family=Unbounded:wght@400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<style>
    :root {
        --font-pixel: 'VT323', monospace; --font-mono: 'Share Tech Mono', monospace;
        --shadow-raise: 0 3px 5px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.15);
        --shadow-raise-sm: 0 1px 3px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
        --shadow-inset: inset 0 2px 5px rgba(0,0,0,0.8), inset 0 -1px 0 rgba(255,255,255,0.05);
    }
    body[data-theme="sunset"] { --bg-dark: #110a14; --bg-panel: #261c2d; --panel-light: #3a2a45; --panel-dark: #1a111f; --text: #e8ddec; --text-muted: #8e7b99; --text-dark: #110a14; --accent: #ff7eb3; --accent-glow: rgba(255, 126, 179, 0.4); --accent-dark: #cc5a8a; }
    body[data-theme="classic"] { --bg-dark: #008080; --bg-panel: #c0c0c0; --panel-light: #d4d0c8; --panel-dark: #808080; --text: #000000; --text-muted: #404040; --text-dark: #ffffff; --accent: #000080; --accent-glow: rgba(0,0,128,0.3); --accent-dark: #00004d; }
    body[data-theme="oldschool"] { --bg-dark: #050a04; --bg-panel: #0a0f08; --panel-light: #141a12; --panel-dark: #000000; --text: #d4ffb8; --text-muted: #5e8f45; --text-dark: #000000; --accent: #7fff2a; --accent-glow: rgba(127, 255, 42, 0.4); --accent-dark: #3aaa00; }
    body[data-theme="watermelon"] { --bg-dark: #ffb3c1; --bg-panel: #ff8fa3; --panel-light: #ffccd5; --panel-dark: #ff4d6d; --text: #2b1a1f; --text-muted: #7a4e56; --text-dark: #ffffff; --accent: #2b9348; --accent-glow: rgba(43, 147, 72, 0.3); --accent-dark: #1b5e20; }
    body[data-theme="light"] { --bg-dark: #f5f5f7; --bg-panel: #ffffff; --panel-light: #f0f0f0; --panel-dark: #d0d0d0; --text: #111111; --text-muted: #666666; --text-dark: #ffffff; --accent: #ff3b30; --accent-glow: rgba(255, 59, 48, 0.3); --accent-dark: #cc2a20; }
    body[data-theme="dark"] { --bg-dark: #1a1a24; --bg-panel: #222230; --panel-light: #2e2e40; --panel-dark: #111118; --text: #e0e0e0; --text-muted: #8890a0; --text-dark: #000000; --accent: #ff3b30; --accent-glow: rgba(255, 59, 48, 0.3); --accent-dark: #cc2a20; }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-dark); background-image: radial-gradient(circle at 50% 0%, var(--bg-panel) 0%, var(--bg-dark) 80%); color: var(--text); font-family: var(--font-mono); height: 100vh; display: flex; flex-direction: column; overflow: hidden; user-select: none; font-size: 13px; transition: background 0.3s, color 0.3s; }
    ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-thumb { background: var(--panel-dark); border-radius: 2px; }

    /* АНИМАЦИИ */
    @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    @keyframes glowPulse { 0% { box-shadow: 0 0 0 0 var(--accent-glow); } 70% { box-shadow: 0 0 10px 5px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

    .message-row { animation: slideUp 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
    .modal-box { animation: popIn 0.25s cubic-bezier(0.2, 0.8, 0.2, 1); }
    .chat-item:active { transform: scale(0.98); transition: transform 0.1s; }
    .btn-primary:active, .btn-send:active { transform: scale(0.96); transition: transform 0.1s; }

    #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--accent); color: var(--text-dark); padding: 10px 20px; border-radius: 6px; font-family: var(--font-pixel); font-size: 16px; box-shadow: 0 4px 15px var(--accent-glow); opacity: 0; transition: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); pointer-events: none; z-index: 9999; }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(3px); }
    .modal-overlay.show { display: flex; }
    .modal-box { background: var(--bg-panel); border: 2px solid var(--panel-light); border-radius: 10px; padding: 15px; width: 90%; max-width: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    .modal-box h3 { font-family: var(--font-pixel); color: var(--accent); margin-bottom: 15px; text-align: center; }
    
    #screen-login { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 15px; }
    .login-box { width: 100%; max-width: 320px; background: linear-gradient(135deg, var(--bg-panel), var(--panel-dark)); border: 1px solid rgba(255,255,255,0.05); border-radius: 10px; padding: 20px 15px; animation: popIn 0.4s ease-out; }
    .logo-flower { font-size: 48px; text-align: center; color: var(--accent); text-shadow: 0 0 15px var(--accent-glow); }
    .logo-title { font-family: var(--font-pixel); font-size: 32px; text-align: center; margin-top: 5px; }
    .auth-tabs { display: flex; margin-bottom: 15px; background: var(--bg-dark); border-radius: 5px; padding: 3px; box-shadow: var(--shadow-inset); }
    .auth-tab { flex: 1; text-align: center; padding: 8px; font-family: var(--font-pixel); color: var(--text-muted); cursor: pointer; transition: 0.2s; }
    .auth-tab.active { background: var(--panel-light); color: var(--text); box-shadow: var(--shadow-raise-sm); border-radius: 3px; }

    .input-group { margin-bottom: 12px; }
    .input-group label { display: block; font-size: 10px; color: var(--text-muted); margin-bottom: 4px; }
    .input-group input, .input-group select { width: 100%; background: var(--bg-dark); border: 1px solid #000; color: var(--accent); padding: 10px; font-family: var(--font-mono); border-radius: 5px; box-shadow: var(--shadow-inset); outline: none; transition: border-color 0.2s; }
    .input-group input:focus { border-color: var(--accent); }
    .btn-primary { width: 100%; background: linear-gradient(to bottom, var(--accent), var(--accent-dark)); color: var(--text-dark); border: 1px solid #000; border-radius: 5px; padding: 10px; font-family: var(--font-pixel); font-size: 18px; cursor: pointer; box-shadow: var(--shadow-raise-sm); transition: 0.1s; }

    #screen-main { display: none; flex-direction: column; height: 100%; }
    .top-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: linear-gradient(to bottom, var(--panel-light), var(--bg-panel)); border-bottom: 1px solid #000; }
    .header-btn { background: var(--panel-light); border: 1px solid #000; color: var(--text); width: 32px; height: 32px; border-radius: 6px; font-size: 16px; cursor: pointer; transition: 0.1s; }
    .header-btn:active { transform: scale(0.9); }
    
    .view-tab { display: none; flex: 1; flex-direction: column; overflow-y: auto; }
    .view-tab.active { display: flex; animation: slideUp 0.2s ease-out; }
    
    .search-wrapper { padding: 8px 12px; background: var(--bg-panel); border-bottom: 1px solid #000; }
    .search-input { width: 100%; background: var(--bg-dark); border: 1px solid #000; color: var(--text); padding: 8px; border-radius: 6px; box-shadow: var(--shadow-inset); outline: none; }
    .folder-title { padding: 10px 15px 5px; font-family: var(--font-pixel); color: var(--text-muted); font-size: 14px; display: flex; justify-content: space-between; cursor: pointer; }
    .chat-item { display: flex; padding: 8px 12px; margin: 4px 8px; border-radius: 8px; background: var(--panel-light); border: 1px solid #000; cursor: pointer; transition: 0.1s; }
    .avatar { width: 38px; height: 38px; background: var(--bg-dark); color: var(--accent); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-family: var(--font-pixel); font-size: 20px; border: 1px solid var(--panel-dark); overflow: hidden; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .chat-details { flex: 1; margin-left: 10px; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
    .chat-name { font-family: var(--font-pixel); font-size: 16px; color: var(--text); }
    .chat-preview { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .unread-badge { background: var(--accent); color: var(--text-dark); font-size: 10px; padding: 2px 6px; border-radius: 10px; font-weight: bold; }

    #screen-chat { display: none; flex-direction: column; height: 100%; position: fixed; inset: 0; z-index: 100; background: var(--bg-dark); }
    .chat-header { display: flex; align-items: center; padding: 8px 12px; background: var(--panel-light); border-bottom: 1px solid #000; }
    .messages-area { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .message-row { display: flex; gap: 8px; max-width: 85%; }
    .message-row.out { align-self: flex-end; flex-direction: row-reverse; }
    .message-bubble { background: var(--panel-light); border: 1px solid #000; border-radius: 8px; padding: 6px 10px; position: relative; min-width: 80px; word-break: break-word; }
    .message-row.out .message-bubble { background: linear-gradient(to bottom, var(--accent), var(--accent-dark)); color: var(--text-dark); }
    .msg-text { font-size: 13px; }
    .msg-time { font-size: 9px; color: var(--text-muted); margin-top: 3px; text-align: right; }
    .message-row.out .msg-time { color: rgba(0,0,0,0.6); }
    
    .msg-img { max-width: 100%; max-height: 200px; border-radius: 6px; margin-top: 5px; cursor: pointer; display: block; }

    .reactions-row { display: flex; gap: 4px; margin-top: 5px; flex-wrap: wrap; }
    .reaction-pill { background: var(--bg-dark); border: 1px solid var(--panel-light); border-radius: 10px; padding: 2px 6px; font-size: 11px; display: flex; align-items: center; gap: 4px; cursor: pointer; transition: 0.1s; }
    .reaction-pill:active { transform: scale(0.9); }
    .reaction-pill.mine { border-color: var(--accent); }
    .reaction-pill img { width: 16px; height: 16px; }

    .input-area { padding: 8px; background: var(--panel-dark); border-top: 1px solid #000; display: flex; align-items: center; gap: 6px; }
    .msg-input { flex: 1; background: var(--bg-dark); border: 1px solid #000; color: var(--text); padding: 10px; border-radius: 6px; outline: none; }
    .btn-send { background: var(--accent); color: var(--text-dark); border: 1px solid #000; border-radius: 6px; width: 40px; height: 40px; cursor: pointer; }
    
    .emoji-panel { display: none; background: var(--bg-panel); padding: 10px; height: 150px; overflow-y: auto; grid-template-columns: repeat(6, 1fr); gap: 5px; border-top: 1px solid #000; }
    .emoji-panel.show { display: grid; }
    .emoji-btn { font-size: 24px; text-align: center; cursor: pointer; background: var(--bg-dark); border: 1px solid #000; border-radius: 5px; transition: 0.1s; }
    .emoji-btn:active { transform: scale(0.8); }
    .emoji-btn img { width: 100%; height: 100%; }

    .context-menu { position: fixed; background: var(--bg-panel); border: 1px solid #000; border-radius: 6px; padding: 5px; z-index: 200; display: none; flex-direction: column; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .context-menu.show { display: flex; animation: popIn 0.15s; }
    .context-item { padding: 8px 15px; font-size: 12px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
    .context-item:hover { background: var(--panel-light); }
    
    .settings-panel { padding: 10px; }
    .theme-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
    .theme-btn { padding: 10px; background: var(--bg-panel); border: 1px solid #000; text-align: center; cursor: pointer; border-radius: 6px; transition: 0.1s; }
    .theme-btn:active { transform: scale(0.95); }
    .theme-btn.active { border-color: var(--accent); }
    .color-row { display: flex; gap: 8px; margin-bottom: 15px; }
    .color-circle { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #000; cursor: pointer; transition: 0.1s; }
    .color-circle:active { transform: scale(0.9); }
    .color-circle.active { border-color: var(--text); box-shadow: 0 0 10px var(--accent); }

    #modalCropper .modal-box { max-width: 400px; }
    .cropper-container { position: relative; width: 100%; aspect-ratio: 1; background: #000; overflow: hidden; margin-bottom: 10px; border-radius: 8px; border: 2px solid var(--panel-light); }
    #cropperCanvas { width: 100%; height: 100%; object-fit: contain; touch-action: none; }
</style>
</head>
<body data-theme="sunset">

<div id="toast"></div>

<!-- МОДАЛКА КРОППЕРА -->
<div class="modal-overlay" id="modalCropper">
    <div class="modal-box">
        <h3>РЕДАКТОР АВАТАРА</h3>
        <div class="cropper-container">
            <canvas id="cropperCanvas"></canvas>
        </div>
        <div style="display:flex; gap:5px; margin-bottom:10px;">
            <button class="btn-primary" style="flex:1;" onclick="rotateCrop(-90)">↺ 90°</button>
            <button class="btn-primary" style="flex:1;" onclick="rotateCrop(90)">↻ 90°</button>
        </div>
        <input type="range" id="cropZoom" min="0.1" max="3" step="0.01" value="1" style="width:100%; margin-bottom:10px;" oninput="updateCropZoom(this.value)">
        <div style="display:flex; gap:5px;">
            <button class="btn-primary" style="flex:1; background:transparent; color:var(--text); border-color:var(--panel-light);" onclick="document.getElementById('modalCropper').classList.remove('show')">ОТМЕНА</button>
            <button class="btn-primary" style="flex:1;" onclick="applyCrop()">СОХРАНИТЬ</button>
        </div>
    </div>
</div>

<!-- МОДАЛКА ПРОФИЛЯ -->
<div class="modal-overlay" id="modalProfile">
    <div class="modal-box">
        <h3>ПРОФИЛЬ</h3>
        <div style="text-align:center; margin-bottom:10px;">
            <div class="avatar" id="modalAvatar" style="width:60px; height:60px; margin:0 auto; font-size:30px;"></div>
        </div>
        <button class="btn-primary" style="font-size:14px; padding:6px; margin-bottom:10px;" onclick="selectAvatarFile()">ЗАГРУЗИТЬ АВАТАР</button>
        <input type="file" id="avatarFileInput" accept="image/*" style="display:none" onchange="startCrop(this)">
        <div class="input-group"><label>Ник</label><input type="text" id="profNick"></div>
        <button class="btn-primary" onclick="saveProfile()">СОХРАНИТЬ</button>
        <button class="btn-primary" style="background:transparent; color:var(--text); border-color:var(--panel-light); margin-top:5px;" onclick="document.getElementById('modalProfile').classList.remove('show')">ЗАКРЫТЬ</button>
    </div>
</div>

<!-- МОДАЛКА СОЗДАНИЯ -->
<div class="modal-overlay" id="modalCreate">
    <div class="modal-box">
        <h3>СОЗДАТЬ</h3>
        <div class="auth-tabs" style="margin-bottom:10px;">
            <div class="auth-tab active" id="tabGroupBtn" onclick="setCreateType('group')">Группа</div>
            <div class="auth-tab" id="tabChannelBtn" onclick="setCreateType('channel')">Канал</div>
        </div>
        <div class="input-group"><label>Название</label><input type="text" id="createName"></div>
        <div class="input-group"><label>Логин</label><input type="text" id="createLogin"></div>
        <button class="btn-primary" onclick="createGroup()">СОЗДАТЬ</button>
        <button class="btn-primary" style="background:transparent; color:var(--text); border-color:var(--panel-light); margin-top:5px;" onclick="document.getElementById('modalCreate').classList.remove('show')">ЗАКРЫТЬ</button>
    </div>
</div>

<!-- ЭКРАН 1: АВТОРИЗАЦИЯ -->
<div id="screen-login">
    <div class="login-box">
        <div class="logo-flower">🌸</div>
        <div class="logo-title">КРИСТА</div>
        <div class="auth-tabs">
            <div class="auth-tab active" onclick="switchAuthTab('login', this)">ВХОД</div>
            <div class="auth-tab" onclick="switchAuthTab('reg', this)">РЕГИСТРАЦИЯ</div>
        </div>
        <div class="input-group"><label>ЛОГИН</label><input type="text" id="loginInput"></div>
        <div class="input-group" id="nicknameGroup" style="display:none;"><label>НИК</label><input type="text" id="nicknameInput"></div>
        <div class="input-group"><label>ПАРОЛЬ</label><input type="password" id="passInput"></div>
        <button class="btn-primary" id="authSubmitBtn" onclick="doAuth()">ВОЙТИ</button>
    </div>
</div>

<!-- ЭКРАН 2: ОСНОВНОЙ -->
<div id="screen-main">
    <div class="top-header">
        <div style="font-family:var(--font-pixel); font-size:20px;" id="headerTitle">КРИСТА</div>
        <div style="display:flex; gap:5px;">
            <button class="header-btn" onclick="openModal('modalCreate')">➕</button>
            <button class="header-btn" onclick="openProfileModal()">👤</button>
            <button class="header-btn" onclick="toggleSettings()">⚙️</button>
        </div>
    </div>

    <div class="view-tab active" id="tab-chats">
        <div class="search-wrapper"><input type="text" class="search-input" placeholder="Поиск..." oninput="filterChats(this.value)"></div>
        <div id="foldersContainer"></div>
    </div>

    <div class="view-tab" id="tab-settings">
        <div class="settings-panel">
            <h3 style="margin-bottom:10px; font-family:var(--font-pixel);">ТЕМЫ</h3>
            <div class="theme-grid">
                <div class="theme-btn active" onclick="setTheme('sunset', this)">Sunset</div>
                <div class="theme-btn" onclick="setTheme('classic', this)">Classic</div>
                <div class="theme-btn" onclick="setTheme('oldschool', this)">Old-school</div>
                <div class="theme-btn" onclick="setTheme('watermelon', this)">Арбузная</div>
                <div class="theme-btn" onclick="setTheme('light', this)">Светлая</div>
                <div class="theme-btn" onclick="setTheme('dark', this)">Тёмная</div>
            </div>
            <h3 style="margin-bottom:10px; font-family:var(--font-pixel);">АКЦЕНТ</h3>
            <div class="color-row">
                <div class="color-circle" style="background:#ff3b30;" onclick="setAccent('#ff3b30', this)"></div>
                <div class="color-circle active" style="background:#ff7eb3;" onclick="setAccent('#ff7eb3', this)"></div>
                <div class="color-circle" style="background:#3b82f6;" onclick="setAccent('#3b82f6', this)"></div>
                <div class="color-circle" style="background:#22c55e;" onclick="setAccent('#22c55e', this)"></div>
            </div>
            <h3 style="margin-bottom:10px; font-family:var(--font-pixel);">АЧИВКИ</h3>
            <div id="achievementsList" style="display:flex; flex-wrap:wrap; gap:5px;"></div>
            <button class="btn-primary" style="margin-top:20px;" onclick="logout()">ВЫЙТИ</button>
        </div>
    </div>
</div>

<!-- ЭКРАН 3: ЧАТ -->
<div id="screen-chat">
    <div class="chat-header">
        <button class="header-btn" style="margin-right:10px;" onclick="closeChat()">◀</button>
        <div class="avatar" id="chatAvatar" style="width:32px; height:32px;"></div>
        <div style="margin-left:10px; flex:1;">
            <div style="font-family:var(--font-pixel); font-size:16px;" id="chatTitle">ЧАТ</div>
            <div style="font-size:10px; color:var(--text-muted);" id="chatSub">...</div>
        </div>
    </div>

    <div class="messages-area" id="messagesArea"></div>

    <div class="emoji-panel" id="emojiPanel">
        <div class="emoji-btn" onclick="insertEmoji('😀')">😀</div>
        <div class="emoji-btn" onclick="insertEmoji('😂')">😂</div>
        <div class="emoji-btn" onclick="insertEmoji('😍')">😍</div>
        <div class="emoji-btn" onclick="insertEmoji('😎')">😎</div>
        <div class="emoji-btn" onclick="insertEmoji('❤️')">❤️</div>
        <div class="emoji-btn" onclick="insertEmoji('🔥')">🔥</div>
        <div class="emoji-btn" onclick="insertEmoji('yes')"><img src="https://kolobok.us/smiles/standart/yes.gif"></div>
        <div class="emoji-btn" onclick="insertEmoji('yahoo')"><img src="https://kolobok.us/smiles/standart/yahoo.gif"></div>
        <div class="emoji-btn" onclick="insertEmoji('sarcasm')"><img src="https://kolobok.us/smiles/standart/sarcasm.gif"></div>
    </div>

    <div class="input-area">
        <button class="header-btn" onclick="document.getElementById('emojiPanel').classList.toggle('show')">😊</button>
        <button class="header-btn" onclick="document.getElementById('chatFileInput').click()">📎</button>
        <input type="file" id="chatFileInput" style="display:none" onchange="uploadChatFile(this)">
        <input type="text" class="msg-input" id="msgInput" placeholder="Сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button class="btn-send" onclick="sendMessage()">➤</button>
    </div>
</div>

<!-- МЕНЮ СООБЩЕНИЙ -->
<div class="context-menu" id="msgContextMenu">
    <div class="context-item" onclick="replyToMsg()">↩️ Ответить</div>
    <div class="context-item" onclick="copyMsg()">📋 Копировать</div>
    <div class="context-item" onclick="editMsg()">✏️ Изменить</div>
    <div class="context-item" style="color:#ff5040;" onclick="deleteMsg()">🗑️ Удалить</div>
</div>

<script>
let token = null, user = null, ws = null, chats = [], folders = [];
let currentChatId = null, messages = {}, currentMsgId = null;
let isLoginMode = true, createType = 'group';

// КРОППЕР
let cropImg = new Image(), cropScale = 1, cropX = 0, cropY = 0, cropAngle = 0;
const VIEW_SIZE = 200;

function showToast(msg) {
    const t = document.getElementById('toast'); t.innerText = msg; t.classList.add('show');
    clearTimeout(window._tt); window._tt = setTimeout(() => t.classList.remove('show'), 2500);
}
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }
function fmt(iso) { return iso ? new Date(iso).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'}) : ''; }
function openModal(id) { document.getElementById(id).classList.add('show'); }

async function api(url, opts = {}) {
    const h = { ...opts.headers, 'Authorization': `Bearer ${token}` };
    let r = await fetch(url, { ...opts, headers: h });
    if (r.status === 401) { logout(); throw new Error('Unauthorized'); }
    return r;
}

// АВТОРИЗАЦИЯ
function switchAuthTab(mode, btn) {
    document.querySelectorAll('#screen-login .auth-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active'); isLoginMode = mode === 'login';
    document.getElementById('nicknameGroup').style.display = isLoginMode ? 'none' : 'block';
}
async function doAuth() {
    const login = document.getElementById('loginInput').value.trim();
    const pass = document.getElementById('passInput').value;
    const nick = document.getElementById('nicknameInput').value.trim();
    try {
        const r = await fetch(isLoginMode ? '/api/login' : '/api/register', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify(isLoginMode ? {login, password: pass} : {login, nickname: nick, password: pass})
        });
        const d = await r.json(); if (!r.ok) throw new Error(d.error);
        token = d.token; user = d.user; startApp();
    } catch(e) { showToast(e.message); }
}
async function tryAutoLogin() {
    try { const r = await fetch('/api/refresh', {method:'POST'}); if(r.ok) { const d = await r.json(); token = d.token; user = d.user; startApp(); } } catch(e){}
}
function logout() { fetch('/api/logout', {method:'POST'}); location.reload(); }

function startApp() {
    document.getElementById('screen-login').style.display = 'none';
    document.getElementById('screen-main').style.display = 'flex';
    setTheme(user.theme || 'sunset'); setAccent(user.accent || '#ff7eb3');
    connectWS(); loadFolders(); loadChats();
}

// WS
function connectWS() {
    ws = new WebSocket(`${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}`);
    ws.onopen = () => ws.send(JSON.stringify({type:'auth', payload:{token}}));
    ws.onmessage = (e) => {
        const d = JSON.parse(e.data);
        if (d.type === 'newMessage') {
            if (!messages[d.message.chatId]) messages[d.message.chatId] = [];
            messages[d.message.chatId].push(d.message);
            if (currentChatId === d.message.chatId) renderMsgs();
            loadChats();
        }
        if (d.type === 'achievement') showToast(`🏆 Ачивка: ${d.meta.name}`);
        if (d.type === 'messageDeleted') { messages[currentChatId] = messages[currentChatId].filter(m => m._id !== d.id); if(currentChatId) renderMsgs(); }
        if (d.type === 'messageEdited') { const m = messages[currentChatId]?.find(x=>x._id===d.id); if(m) m.text = d.text; if(currentChatId) renderMsgs(); }
    };
    ws.onclose = () => setTimeout(connectWS, 3000);
}

// ЧАТЫ
async function loadFolders() { const r = await api('/api/folders'); folders = await r.json(); renderFolders(); }
async function loadChats() { const r = await api('/api/chats'); chats = await r.json(); renderFolders(); }
function renderFolders() {
    const container = document.getElementById('foldersContainer'); let html = '';
    folders.forEach(f => {
        let list = f.system && f.filter === 'unread' ? chats.filter(c => c.unreadCount > 0) : chats;
        if (!f.system && f.chatIds) list = chats.filter(c => f.chatIds.includes(c.id));
        if (list.length === 0 && f.system) return;
        html += `<div class="folder-title">${f.icon} ${escapeHtml(f.name)}</div>`;
        list.forEach(c => {
            html += `<div class="chat-item" onclick="openChat('${c.id}')">
                <div class="avatar">${c.avatar ? `<img src="${escapeHtml(c.avatar)}">` : escapeHtml(c.name.charAt(0).toUpperCase())}</div>
                <div class="chat-details">
                    <div style="display:flex; justify-content:space-between;">
                        <div class="chat-name">${escapeHtml(c.name)}</div>
                        <div style="font-size:10px; color:var(--text-muted);">${c.lastMessage ? fmt(c.lastMessage.timestamp) : ''}</div>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div class="chat-preview">${c.lastMessage ? escapeHtml(c.lastMessage.text) : 'Нет сообщений'}</div>
                        ${c.unreadCount > 0 ? `<div class="unread-badge">${c.unreadCount}</div>` : ''}
                    </div>
                </div>
            </div>`;
        });
    });
    container.innerHTML = html;
}
function filterChats(q) { q = q.toLowerCase(); document.querySelectorAll('.chat-item').forEach(el => el.style.display = el.innerText.toLowerCase().includes(q) ? 'flex' : 'none'); }

async function openChat(id) {
    currentChatId = id; document.getElementById('screen-chat').style.display = 'flex';
    document.getElementById('chatTitle').innerText = chats.find(c=>c.id===id)?.name;
    const r = await api(`/api/chats/${id}/messages`); messages[id] = await r.json();
    renderMsgs(); loadChats();
}
function closeChat() { currentChatId = null; document.getElementById('screen-chat').style.display = 'none'; }
function renderMsgs() {
    const area = document.getElementById('messagesArea');
    area.innerHTML = messages[currentChatId]?.map(m => {
        const out = m.sender === user.login;
        let rxHtml = m.reactions?.length ? `<div class="reactions-row">${m.reactions.map(r => `<div class="reaction-pill ${r.users.includes(user.login)?'mine':''}" onclick="react('${m._id}','${r.emoji}')">${r.emoji.includes('yes')||r.emoji.includes('yahoo')?`<img src="https://kolobok.us/smiles/standart/${r.emoji}.gif">`:r.emoji} ${r.users.length}</div>`).join('')}</div>` : '';
        let fileHtml = m.file ? (m.file.mime.startsWith('image/') ? `<img src="/api/file/${m.file.id}?token=${token}" class="msg-img" onclick="window.open(this.src)">` : `<a href="/api/file/${m.file.id}?token=${token}" target="_blank" style="color:var(--accent);">📄 ${escapeHtml(m.file.name)}</a>`) : '';
        
        return `<div class="message-row ${out?'out':''}" onclick="openMsgMenu(event, '${m._id}')">
            <div class="message-bubble">
                ${!out ? `<div style="font-size:10px; color:var(--accent); margin-bottom:2px;">${escapeHtml(m.sender)}</div>` : ''}
                ${fileHtml}
                <div class="msg-text">${escapeHtml(m.text)} ${m.editedAt ? '<span style="font-size:9px; opacity:0.6;">(изм)</span>' : ''}</div>
                <div class="msg-time">${fmt(m.timestamp)}</div>
                ${rxHtml}
            </div>
        </div>`;
    }).join('') || '<div style="text-align:center; color:var(--text-muted); margin-top:20px;">Нет сообщений</div>';
    area.scrollTop = area.scrollHeight;
}
function sendMessage() {
    const inp = document.getElementById('msgInput'); if(!inp.value.trim()) return;
    ws.send(JSON.stringify({type:'newMessage', payload:{chatId:currentChatId, text:inp.value, clientId:Date.now().toString()}}));
    inp.value = '';
}
function insertEmoji(e) { document.getElementById('msgInput').value += e; }

// ФАЙЛЫ В ЧАТ
async function uploadChatFile(input) {
    const file = input.files[0]; if(!file) return;
    input.value = '';
    showToast('Загрузка файла...');
    const fd = new FormData(); fd.append('file', file);
    try {
        const r = await api('/api/upload', {method:'POST', body: fd});
        const d = await r.json();
        if(d.id) {
            ws.send(JSON.stringify({type:'newMessage', payload:{chatId:currentChatId, text:'', clientId:Date.now().toString(), fileId:d.id}}));
            showToast('Файл отправлен');
        }
    } catch(e) { showToast('Ошибка'); }
}

// МЕНЮ СООБЩЕНИЙ
function openMsgMenu(e, id) {
    e.stopPropagation(); currentMsgId = id; const menu = document.getElementById('msgContextMenu');
    menu.style.left = Math.min(e.pageX, window.innerWidth - 150) + 'px'; menu.style.top = Math.min(e.pageY, window.innerHeight - 150) + 'px';
    menu.classList.add('show');
}
document.addEventListener('click', () => document.getElementById('msgContextMenu').classList.remove('show'));
async function deleteMsg() { await api(`/api/messages/${currentMsgId}`, {method:'DELETE'}); }
async function editMsg() { const t = prompt('Новый текст:'); if(t) await api(`/api/messages/${currentMsgId}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text:t})}); }
function replyToMsg() { showToast('Ответ добавлен'); }
function copyMsg() { const m = messages[currentChatId].find(x=>x._id===currentMsgId); navigator.clipboard.writeText(m.text); showToast('Скопировано'); }
function react(id, emoji) { ws.send(JSON.stringify({type:'reaction', payload:{msgId:id, emoji}})); }

// ПРОФИЛЬ И КРОППЕР
function openProfileModal() {
    openModal('modalProfile');
    document.getElementById('profNick').value = user.nickname;
    document.getElementById('modalAvatar').innerHTML = user.avatar ? `<img src="${user.avatar}">` : user.nickname.charAt(0);
}
async function saveProfile() {
    const nick = document.getElementById('profNick').value;
    await api('/api/me', {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({nickname:nick})});
    user.nickname = nick; showToast('Сохранено'); document.getElementById('modalProfile').classList.remove('show'); loadChats();
}

function selectAvatarFile() { document.getElementById('avatarFileInput').click(); }
function startCrop(input) {
    const file = input.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        cropImg.onload = () => {
            cropScale = Math.max(VIEW_SIZE / cropImg.width, VIEW_SIZE / cropImg.height);
            cropX = 0; cropY = 0; cropAngle = 0;
            document.getElementById('cropZoom').value = cropScale;
            drawCrop();
            openModal('modalCropper');
        };
        cropImg.src = e.target.result;
    };
    reader.readAsDataURL(file);
}
function drawCrop() {
    const canvas = document.getElementById('cropperCanvas'); const ctx = canvas.getContext('2d');
    canvas.width = VIEW_SIZE; canvas.height = VIEW_SIZE;
    ctx.clearRect(0, 0, VIEW_SIZE, VIEW_SIZE);
    ctx.save();
    ctx.translate(VIEW_SIZE/2, VIEW_SIZE/2);
    ctx.rotate(cropAngle * Math.PI / 180);
    ctx.scale(cropScale, cropScale);
    ctx.translate(-cropImg.width/2 + cropX, -cropImg.height/2 + cropY);
    ctx.drawImage(cropImg, 0, 0);
    ctx.restore();
    // Overlay circle
    ctx.beginPath(); ctx.arc(VIEW_SIZE/2, VIEW_SIZE/2, VIEW_SIZE/2 - 2, 0, Math.PI*2);
    ctx.strokeStyle = 'var(--accent)'; ctx.lineWidth = 3; ctx.stroke();
}
function rotateCrop(deg) { cropAngle += deg; drawCrop(); }
function updateCropZoom(val) { cropScale = parseFloat(val); drawCrop(); }
function applyCrop() {
    const outCanvas = document.createElement('canvas');
    outCanvas.width = 400; outCanvas.height = 400;
    const ctx = outCanvas.getContext('2d');
    ctx.translate(200, 200);
    ctx.rotate(cropAngle * Math.PI / 180);
    ctx.scale(cropScale * (400/VIEW_SIZE), cropScale * (400/VIEW_SIZE));
    ctx.translate(-cropImg.width/2 + cropX, -cropImg.height/2 + cropY);
    ctx.drawImage(cropImg, 0, 0);
    
    outCanvas.toBlob(async (blob) => {
        const fd = new FormData(); fd.append('file', blob, 'avatar.jpg');
        try {
            const r = await api('/api/upload', {method:'POST', body: fd});
            const d = await r.json();
            const url = `/api/file/${d.id}?token=${token}`;
            user.avatar = url;
            document.getElementById('modalAvatar').innerHTML = `<img src="${url}">`;
            await api('/api/me', {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({avatar:url})});
            document.getElementById('modalCropper').classList.remove('show');
            showToast('Аватар обновлен');
        } catch(e) { showToast('Ошибка загрузки'); }
    }, 'image/jpeg', 0.9);
}

// КРОППЕР ПЕРЕТАСКИВАНИЕ
let isDragging = false, lastX = 0, lastY = 0;
const cropCanvas = document.getElementById('cropperCanvas');
cropCanvas.addEventListener('mousedown', (e) => { isDragging = true; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener('mousemove', (e) => {
    if(!isDragging) return;
    const rect = cropCanvas.getBoundingClientRect();
    const dx = (e.clientX - lastX) * (VIEW_SIZE / rect.width) / cropScale;
    const dy = (e.clientY - lastY) * (VIEW_SIZE / rect.height) / cropScale;
    cropX += dx; cropY += dy;
    lastX = e.clientX; lastY = e.clientY;
    drawCrop();
});
window.addEventListener('mouseup', () => isDragging = false);
// Тач
cropCanvas.addEventListener('touchstart', (e) => { isDragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; }, {passive:false});
window.addEventListener('touchmove', (e) => {
    if(!isDragging) return;
    const rect = cropCanvas.getBoundingClientRect();
    const dx = (e.touches[0].clientX - lastX) * (VIEW_SIZE / rect.width) / cropScale;
    const dy = (e.touches[0].clientY - lastY) * (VIEW_SIZE / rect.height) / cropScale;
    cropX += dx; cropY += dy;
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    drawCrop();
}, {passive:false});
window.addEventListener('touchend', () => isDragging = false);

// НАСТРОЙКИ
function setTheme(theme) { document.body.setAttribute('data-theme', theme); api('/api/me', {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({theme})}); }
function setAccent(color) { document.documentElement.style.setProperty('--accent', color); api('/api/me', {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({accent:color})}); }
function toggleSettings() { document.querySelectorAll('.view-tab').forEach(t=>t.classList.remove('active')); document.getElementById('tab-settings').classList.add('active'); }

// СОЗДАНИЕ
function setCreateType(t) { createType = t; document.getElementById('tabGroupBtn').classList.toggle('active', t==='group'); document.getElementById('tabChannelBtn').classList.toggle('active', t==='channel'); }
async function createGroup() {
    const name = document.getElementById('createName').value;
    const login = document.getElementById('createLogin').value;
    await api('/api/groups', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name, login, isChannel: createType==='channel'})});
    document.getElementById('modalCreate').classList.remove('show'); loadChats(); showToast('Создано!');
}

document.addEventListener('DOMContentLoaded', tryAutoLogin);
</script>
