<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1a0f18" />
<title>Криста.Мессенджер</title>
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Handjet:wght@400;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0e0812;--surface:#1a0f18;--surface2:#261724;--surface3:#332033;--grad-panel-1:#2a1a2c;--grad-panel-2:#1a0f18;--grad-bubble-1:#2a1a2c;--grad-bubble-2:#1f1220;--grad-bubble-out-1:#4a2538;--grad-bubble-out-2:#331824;--grad-btn-1:#ffb3d1;--grad-btn-2:#e08cb0;--text:#f5e8f0;--text2:#c0a8b8;--text3:#7a5e70;--border:#3a2838;--border-light:#543d50;--accent:#ffb3d1;--accent-dim:rgba(255,179,209,.15);--on-accent:#1a0f18;--ok:#7ee0a0;--warn:#ffcc55;--danger:#ff6a8a;--font-head:'Handjet',monospace;--font-body:'JetBrains Mono',monospace}
.t-lavender{--bg:#0d0818;--surface:#180f24;--surface2:#221734;--surface3:#2e2044;--grad-panel-1:#241838;--grad-panel-2:#180f24;--grad-bubble-1:#241838;--grad-bubble-2:#1d1230;--grad-bubble-out-1:#382a54;--grad-bubble-out-2:#241838;--grad-btn-1:#d4b3ff;--grad-btn-2:#b48cdc;--text:#ede6f7;--text2:#b8a8d0;--text3:#786a90;--border:#352850;--border-light:#4c3c68;--accent:#d4b3ff;--accent-dim:rgba(212,179,255,.15);--on-accent:#180f24}
.t-sakura{--bg:#fff0f5;--surface:#fffafc;--surface2:#fce8ee;--surface3:#f8dce6;--grad-panel-1:#fce8ee;--grad-panel-2:#f4d8e2;--grad-bubble-1:#fffafc;--grad-bubble-2:#fce8ee;--grad-bubble-out-1:#ffd4e2;--grad-bubble-out-2:#ffb8ce;--grad-btn-1:#e94b8a;--grad-btn-2:#c93d70;--text:#4a1e34;--text2:#8a5870;--text3:#b898a8;--border:#f0d0dc;--border-light:#e0b8c8;--accent:#e94b8a;--accent-dim:rgba(233,75,138,.12);--on-accent:#fffafc}
.t-cream{--bg:#fdf6ee;--surface:#fffdfa;--surface2:#faf0e2;--surface3:#f5e4d0;--grad-panel-1:#faf0e2;--grad-panel-2:#f4e0c8;--grad-bubble-1:#fffdfa;--grad-bubble-2:#faf0e2;--grad-bubble-out-1:#ffe0c8;--grad-bubble-out-2:#ffcaa0;--grad-btn-1:#ff8a5c;--grad-btn-2:#e0724a;--text:#4a2a18;--text2:#8a6a54;--text3:#b89c88;--border:#edd6bc;--border-light:#ddc0a0;--accent:#ff8a5c;--accent-dim:rgba(255,138,92,.12);--on-accent:#fffaf2}
.t-night{--bg:#0a0e1a;--surface:#101624;--surface2:#182034;--surface3:#222c44;--grad-panel-1:#1a2438;--grad-panel-2:#101624;--grad-bubble-1:#1a2438;--grad-bubble-2:#141c30;--grad-bubble-out-1:#2a3858;--grad-bubble-out-2:#1c2640;--grad-btn-1:#a3c8ff;--grad-btn-2:#7aa4dc;--text:#e6f0ff;--text2:#9cb0cc;--text3:#5c6c88;--border:#28324c;--border-light:#3c4868;--accent:#a3c8ff;--accent-dim:rgba(163,200,255,.15);--on-accent:#101624}
.t-grape{--bg:#100812;--surface:#180c1c;--surface2:#24142a;--surface3:#301c38;--grad-panel-1:#241430;--grad-panel-2:#180c1c;--grad-bubble-1:#241430;--grad-bubble-2:#1c0e26;--grad-bubble-out-1:#3c1c48;--grad-bubble-out-2:#2a1434;--grad-btn-1:#b86ad9;--grad-btn-2:#9648b8;--text:#f0e6f5;--text2:#b8a0c8;--text3:#7a5c8a;--border:#382448;--border-light:#503460;--accent:#b86ad9;--accent-dim:rgba(184,106,217,.15);--on-accent:#180c1c}
.t-caramel{--bg:#fff2e8;--surface:#fffbf7;--surface2:#fae8d8;--surface3:#f4d8c0;--grad-panel-1:#fae8d8;--grad-panel-2:#f4d4b8;--grad-bubble-1:#fffbf7;--grad-bubble-2:#fae8d8;--grad-bubble-out-1:#ffd0a8;--grad-bubble-out-2:#ffb888;--grad-btn-1:#e07a3a;--grad-btn-2:#c05f28;--text:#4a2a10;--text2:#8a5a34;--text3:#b89068;--border:#eac8a8;--border-light:#d8b088;--accent:#e07a3a;--accent-dim:rgba(224,122,58,.12);--on-accent:#fff8f0}
.t-blossom{--bg:#fdd8e4;--surface:#ffeaf0;--surface2:#fcd0de;--surface3:#f8c0d0;--grad-panel-1:#fcd0de;--grad-panel-2:#f4bcd0;--grad-bubble-1:#ffeaf0;--grad-bubble-2:#fcd0de;--grad-bubble-out-1:#ffb8ce;--grad-bubble-out-2:#f098b4;--grad-btn-1:#c94a7a;--grad-btn-2:#a83864;--text:#3a1020;--text2:#7a3858;--text3:#a87894;--border:#e8a0b8;--border-light:#d488a2;--accent:#c94a7a;--accent-dim:rgba(201,74,122,.12);--on-accent:#ffeaf0}

html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;transition:background .3s,color .3s;position:fixed;width:100%;inset:0}
#app{width:100%;max-width:420px;height:100%;height:100dvh;margin:0 auto;background:var(--surface);display:flex;flex-direction:column;position:relative;overflow:hidden;border-left:1px solid var(--border);border-right:1px solid var(--border);box-shadow:0 0 80px var(--accent-dim);transition:background .3s}
#app::before{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0,transparent 3px,rgba(255,255,255,.015) 3px,rgba(255,255,255,.015) 4px);z-index:1;mix-blend-mode:overlay}

/* ШАПКА */
.hdr1{background:linear-gradient(180deg,var(--grad-panel-1),var(--grad-panel-2));padding:10px 14px 10px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;flex-shrink:0;position:relative;z-index:3}
.hdr1 svg{width:32px;height:32px;flex-shrink:0;filter:drop-shadow(0 0 8px var(--accent));cursor:pointer}
.hdr1 svg circle{fill:var(--accent)}
.hdr1 svg .c{fill:var(--surface)}
.hdr1-title{font-family:var(--font-head);font-size:26px;font-weight:700;color:var(--accent);text-shadow:0 0 10px var(--accent);letter-spacing:1.5px;line-height:1;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr1-ver{font-size:11px;color:var(--text3);flex-shrink:0}
/* Ярус 2 — как contact, отдельный блок */
.hdr2{background:var(--surface);padding:10px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);border-top:1px solid var(--border);flex-shrink:0;position:relative;z-index:2}
.hdr2 .av{width:38px;height:38px;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center;border:1px solid var(--border-light);font-family:var(--font-head);font-size:20px;font-weight:700;overflow:hidden}
.hdr2 .av .emoji{font-size:22px;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;text-shadow:none}
.hdr2 .ci{flex:1;min-width:0}
.hdr2 .cn{font-family:var(--font-head);font-size:18px;font-weight:700;letter-spacing:.5px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:baseline}
.hdr2 .cn .lg{font-family:var(--font-body);font-size:11px;font-weight:400;color:var(--text3);cursor:pointer;flex-shrink:0}
.hdr2 .cs{font-size:12px;margin-top:2px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr2 .cs.st-online{color:var(--ok)}.hdr2 .cs.st-away{color:var(--warn)}.hdr2 .cs.st-dnd{color:var(--danger)}

.search-bar{display:flex;gap:6px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;position:relative;z-index:2}
.search-bar input{flex:1;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:var(--font-body);font-size:13px;padding:8px 12px;outline:none;caret-color:var(--accent);min-width:0}
.search-bar input:focus{border-color:var(--accent)}
.search-bar input::placeholder{color:var(--text3)}
.search-bar .add-btn{background:linear-gradient(180deg,var(--grad-btn-1),var(--grad-btn-2));border:1px solid var(--accent);color:var(--on-accent);font-family:var(--font-head);font-weight:700;font-size:22px;width:38px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;flex-shrink:0}
.search-bar .add-btn:active{filter:brightness(.9)}

.conn{height:3px;flex-shrink:0;position:relative;overflow:hidden;z-index:2}
.conn.online{background:var(--accent);opacity:.55}
.conn.connecting{background:var(--warn)}
.conn.connecting::after{content:'';position:absolute;top:0;left:-40%;width:40%;height:100%;background:linear-gradient(90deg,transparent,var(--warn),transparent);animation:cs 1.2s linear infinite}
.conn.offline{background:var(--danger);animation:cp 1.6s ease-in-out infinite}
.conn .lbl{position:absolute;right:6px;top:-13px;font-size:9px;font-family:var(--font-head);font-weight:700;color:var(--accent)}
@keyframes cs{from{left:-40%}to{left:100%}}
@keyframes cp{0%,100%{opacity:.5}50%{opacity:1}}

.content{flex:1;overflow-y:auto;min-height:0;position:relative;z-index:2}
.content::-webkit-scrollbar{width:5px}
.content::-webkit-scrollbar-thumb{background:var(--border-light)}
.screen{display:none;flex-direction:column;height:100%}
.screen.active{display:flex}

.section{padding:6px 12px;background:linear-gradient(180deg,var(--grad-panel-1),var(--grad-panel-2));border-top:1px solid var(--border);border-bottom:1px solid var(--border);font-family:var(--font-head);font-size:15px;font-weight:700;color:var(--accent);text-shadow:0 0 6px var(--accent);letter-spacing:1.5px;display:flex;align-items:center;gap:6px}
.section .cnt{margin-left:auto;font-size:11px;color:var(--text3);font-family:var(--font-body);font-weight:400;letter-spacing:0}

.contact{display:flex;align-items:center;padding:8px 12px;gap:10px;border-bottom:1px solid var(--border);cursor:pointer;background:var(--surface);position:relative}
.contact:active{background:var(--accent-dim);box-shadow:inset 3px 0 0 var(--accent)}
.contact.common{background:linear-gradient(90deg,var(--accent-dim),var(--surface))}

.av{width:38px;height:38px;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center;border:1px solid var(--border-light);font-family:var(--font-head);font-size:20px;font-weight:700;overflow:hidden}
.av .emoji{font-size:22px;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;text-shadow:none}
.av .dot{position:absolute;bottom:-3px;right:-3px;width:12px;height:12px;border-radius:50%;border:2px solid var(--surface);box-sizing:content-box;background:var(--text3)}
.av .dot.on{background:var(--dot-c,var(--ok))}

.ci{flex:1;min-width:0}
.cn{font-family:var(--font-head);font-size:18px;font-weight:700;letter-spacing:.5px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:baseline}
.cn .lg{font-family:var(--font-body);font-size:10px;font-weight:400;color:var(--text3);flex-shrink:0}
.cs{font-size:11px;color:var(--text3);margin-top:2px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs.st-online{color:var(--ok)}.cs.st-away{color:var(--warn)}.cs.st-dnd{color:var(--danger)}
.cp{font-size:12px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.bdg{background:var(--accent);color:var(--on-accent);font-family:var(--font-head);font-size:12px;font-weight:700;padding:2px 7px;min-width:22px;text-align:center;flex-shrink:0}
.empty{color:var(--text3);text-align:center;padding:40px 20px;font-size:13px;line-height:1.6;font-style:italic}

.tabs{display:flex;background:linear-gradient(180deg,var(--grad-panel-2),var(--grad-panel-1));border-top:1px solid var(--border);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0);position:relative;z-index:2}
.tabs button{flex:1;background:none;border:none;border-right:1px solid var(--border);color:var(--text3);font-family:var(--font-body);font-size:10px;padding:8px 4px 10px;cursor:pointer;position:relative;line-height:1.3}
.tabs button:last-child{border-right:none}
.tabs button .i{font-size:20px;display:block;margin-bottom:2px;opacity:.75}
.tabs button.active{color:var(--accent);background:linear-gradient(180deg,transparent,var(--accent-dim))}
.tabs button.active .i{opacity:1}
.tabs button.active::before{content:'';position:absolute;top:0;left:15%;right:15%;height:2px;background:var(--accent)}

.chat-hdr{display:flex;align-items:center;padding:8px 10px;background:linear-gradient(180deg,var(--grad-panel-1),var(--grad-panel-2));border-bottom:1px solid var(--border);gap:8px;flex-shrink:0;padding-top:max(8px,env(safe-area-inset-top))}
.chat-hdr .bk{background:linear-gradient(180deg,var(--surface3),var(--surface2));border:1px solid var(--border-light);color:var(--accent);font-size:14px;padding:5px 9px;cursor:pointer;flex-shrink:0;font-family:var(--font-head);font-weight:700}
.chat-hdr .av2{width:34px;height:34px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:1px solid var(--border-light);font-family:var(--font-head);font-size:18px;font-weight:700;position:relative;overflow:hidden}
.chat-hdr .av2 .emoji{font-size:20px;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;text-shadow:none}
.chat-hdr .av2 .dot{position:absolute;bottom:-3px;right:-3px;width:10px;height:10px;border-radius:50%;border:2px solid var(--surface2);background:var(--text3)}
.chat-hdr .av2 .dot.on{background:var(--dot-c,var(--ok))}
.chat-hdr .ci2{flex:1;min-width:0;cursor:pointer}
.chat-hdr .cn2{font-family:var(--font-head);font-size:18px;font-weight:700;letter-spacing:.5px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-hdr .cs2{font-size:10px;color:var(--text3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-hdr .cs2.st-online{color:var(--ok)}.chat-hdr .cs2.st-away{color:var(--warn)}.chat-hdr .cs2.st-dnd{color:var(--danger)}
.chat-hdr .mn{background:none;border:none;color:var(--text2);font-size:22px;padding:0 4px;cursor:pointer;flex-shrink:0}

.messages{flex:1;overflow-y:auto;padding:10px;background:radial-gradient(ellipse at top,var(--accent-dim),transparent 60%),var(--surface);min-height:0}
.messages::-webkit-scrollbar{width:5px}
.messages::-webkit-scrollbar-thumb{background:var(--border-light)}

.dsep{text-align:center;font-family:var(--font-head);font-size:14px;font-weight:700;color:var(--accent);text-shadow:0 0 6px var(--accent);letter-spacing:1.5px;margin:14px 0 8px;padding:5px 0;position:relative}
.dsep::before,.dsep::after{content:'';position:absolute;top:50%;width:28%;height:1px;background:linear-gradient(90deg,transparent,var(--border-light),transparent)}
.dsep::before{left:0}.dsep::after{right:0}

.msg{margin-bottom:6px;display:flex;gap:6px;align-items:flex-start;animation:mi .25s ease}
.msg.out{flex-direction:row-reverse}
.msg.pending .bub .txt{color:var(--text3)}
.msg.pending .bub .stt{color:var(--warn);font-size:10px;margin-left:4px;font-family:var(--font-head)}
.msg.failed .bub .txt{color:var(--danger)}
.msg.failed .bub .stt{color:var(--danger);font-size:10px;margin-left:4px;cursor:pointer;text-decoration:underline;font-family:var(--font-head)}
.msg.flash .bub{animation:fa 1.6s ease}
@keyframes mi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes fa{0%,60%{box-shadow:0 0 20px var(--accent)}100%{}}

.mav{width:26px;height:26px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:1px solid var(--border-light);font-family:var(--font-head);font-size:13px;font-weight:700;overflow:hidden;background:var(--surface3)}
.mav .emoji{font-size:15px;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;text-shadow:none}
.msg.out .mav{background:linear-gradient(180deg,var(--accent),var(--grad-btn-2));border-color:var(--accent)}
.msg.out .mav span{color:var(--on-accent);text-shadow:none}

.bub{background:linear-gradient(180deg,var(--grad-bubble-1),var(--grad-bubble-2));border:1px solid var(--border-light);padding:6px 10px;max-width:80%;cursor:pointer;position:relative;word-wrap:break-word;overflow-wrap:break-word}
.bub:active{box-shadow:0 0 0 1px var(--accent)}
.msg.out .bub{background:linear-gradient(180deg,var(--grad-bubble-out-1),var(--grad-bubble-out-2));border-color:var(--accent)}
.bub .hd{font-size:10px;color:var(--text3);margin-bottom:3px;display:flex;gap:6px;align-items:baseline}
.bub .hd .nm{font-weight:700;font-family:var(--font-head);font-size:14px;letter-spacing:.5px}
.bub .hd .tm{font-family:var(--font-body)}
.bub .txt{font-size:13px;color:var(--text);line-height:1.45;word-break:break-word;white-space:pre-wrap}
.bub .txt .link{color:var(--accent);text-decoration:underline;cursor:pointer;word-break:break-all}
.bub .txt .mention{color:var(--accent);font-weight:700;background:var(--accent-dim);padding:1px 4px}
.bub .edt{font-size:10px;color:var(--text3);font-style:italic;margin-left:4px}
.bub .rq{background:var(--accent-dim);border-left:2px solid var(--accent);padding:3px 6px;margin-bottom:4px;font-size:11px;color:var(--text2);display:flex;gap:6px;cursor:pointer}
.bub .rq .jm{color:var(--accent);text-decoration:underline;font-size:10px;margin-left:auto}
.bub .rxs{margin-top:5px;display:flex;gap:4px;flex-wrap:wrap}
.bub .rxs .rx{background:var(--surface2);border:1px solid var(--border-light);padding:2px 7px;font-size:12px;color:var(--text2);cursor:pointer;display:flex;gap:3px}
.bub .rxs .rx.mine{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}

.typing{min-height:18px;padding:2px 12px 4px;font-size:11px;color:var(--accent);font-style:italic;background:var(--surface2);flex-shrink:0;opacity:0;transition:opacity .2s}
.typing.vis{opacity:1}
.typing .dots::after{content:'';animation:td 1.4s steps(4,end) infinite}
@keyframes td{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}

.ib{display:flex;align-items:center;gap:4px;padding:6px;background:linear-gradient(180deg,var(--grad-panel-2),var(--grad-panel-1));border-top:1px solid var(--border);flex-shrink:0;padding-bottom:max(6px,env(safe-area-inset-bottom))}
.ib .icn{background:linear-gradient(180deg,var(--surface3),var(--surface2));border:1px solid var(--border-light);color:var(--text2);font-size:18px;width:36px;height:36px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.ib .icn:hover,.ib .icn.active{border-color:var(--accent);color:var(--accent)}
.ib input{flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:var(--font-body);font-size:13px;padding:8px 10px;outline:none;min-width:0;caret-color:var(--accent)}
.ib input:focus{border-color:var(--accent)}
.ib input::placeholder{color:var(--text3)}
.ib .snd{background:linear-gradient(180deg,var(--grad-btn-1),var(--grad-btn-2));border:1px solid var(--accent);color:var(--on-accent);font-family:var(--font-head);font-weight:700;font-size:16px;padding:0 10px;height:36px;cursor:pointer;letter-spacing:1px;flex-shrink:0}
.ib .snd:active{filter:brightness(.9)}

.emoji-panel{display:none;background:linear-gradient(180deg,var(--grad-panel-2),var(--grad-panel-1));border-top:1px solid var(--border);padding:6px;flex-shrink:0;max-height:170px;overflow-y:auto}
.emoji-panel.active{display:block}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.emoji-grid button{background:linear-gradient(180deg,var(--surface3),var(--surface2));border:1px solid var(--border);font-size:18px;padding:5px 0;cursor:pointer;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;line-height:1}

.join-bar{display:flex;align-items:center;justify-content:center;gap:12px;padding:14px;background:linear-gradient(180deg,var(--grad-panel-2),var(--grad-panel-1));border-top:1px solid var(--border);flex-shrink:0}
.join-bar .info{font-size:12px;color:var(--text3);font-style:italic}
.join-bar button{background:linear-gradient(180deg,var(--grad-btn-1),var(--grad-btn-2));border:1px solid var(--accent);color:var(--on-accent);font-family:var(--font-head);font-weight:700;font-size:15px;padding:8px 20px;cursor:pointer;letter-spacing:1px}

.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);align-items:center;justify-content:center;z-index:100;padding:20px;backdrop-filter:blur(3px)}
.ov.active{display:flex}
.mod{background:linear-gradient(180deg,var(--grad-panel-1),var(--grad-panel-2));border:1px solid var(--accent);width:100%;max-width:400px;max-height:90vh;overflow-y:auto;padding:20px 16px 16px;position:relative}
.mod h3{font-family:var(--font-head);font-size:22px;font-weight:700;color:var(--accent);text-shadow:0 0 8px var(--accent);letter-spacing:1.5px;margin-bottom:16px;text-align:center;padding-bottom:10px;position:relative}
.mod h3::after{content:'◆';position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--accent)}
.mod input,.mod textarea{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:var(--font-body);font-size:14px;padding:8px 10px;outline:none;margin-bottom:8px;caret-color:var(--accent);resize:none}
.mod input:focus,.mod textarea:focus{border-color:var(--accent)}
.mod input::placeholder,.mod textarea::placeholder{color:var(--text3)}
.mod .err{color:var(--danger);font-size:12px;min-height:16px;margin-bottom:4px;font-style:italic}
.row{display:flex;gap:8px;margin-top:12px}
.row button{flex:1;background:linear-gradient(180deg,var(--surface3),var(--surface2));border:1px solid var(--border-light);color:var(--text2);font-family:var(--font-head);font-weight:700;font-size:14px;padding:9px 10px;cursor:pointer;letter-spacing:1px}
.row button.primary{background:linear-gradient(180deg,var(--grad-btn-1),var(--grad-btn-2));border-color:var(--accent);color:var(--on-accent)}
.row button.danger{border-color:var(--danger);color:var(--danger)}

.set-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;gap:8px;flex-wrap:wrap}
.set-row:last-child{border-bottom:none}
.set-row .lbl{color:var(--text2)}
.set-row .val{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.set-row .val input{width:130px;margin:0;font-size:13px;padding:5px 8px}
.set-row .val button{background:linear-gradient(180deg,var(--surface3),var(--surface2));border:1px solid var(--border-light);color:var(--text2);font-family:var(--font-head);font-weight:700;font-size:13px;padding:4px 12px;cursor:pointer}
.set-row .val button:hover{border-color:var(--accent);color:var(--accent)}

.chk{display:flex;align-items:center;gap:8px;padding:8px 0;cursor:pointer;font-size:13px;color:var(--text2)}
.chk input[type=checkbox],.chk input[type=radio]{appearance:none;width:18px;height:18px;border:1px solid var(--border-light);background:var(--surface);cursor:pointer;position:relative;flex-shrink:0}
.chk input:checked{border-color:var(--accent)}
.chk input[type=checkbox]:checked::after{content:'✕';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:var(--accent);font-size:13px;font-family:var(--font-head);font-weight:700}
.chk input[type=radio]:checked::after{content:'●';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:var(--accent);font-size:14px}
.chk .dsc{font-size:11px;color:var(--text3);display:block;margin-top:2px;font-style:italic}

.tg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;padding-top:4px}
.tw{aspect-ratio:1;border:1px solid var(--border-light);cursor:pointer;position:relative;min-height:34px}
.tw.active{border-color:var(--accent)}
.tw.active::after{content:'◆';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:14px;text-shadow:0 0 6px rgba(0,0,0,.9)}
.tw .lbl{position:absolute;bottom:2px;left:0;right:0;font-size:8px;text-align:center;font-family:var(--font-head);color:rgba(255,255,255,.9);text-shadow:0 0 3px #000;font-weight:700}
.tw.t-rose{background:linear-gradient(135deg,#1a0f18 50%,#ffb3d1 50%)}
.tw.t-lavender{background:linear-gradient(135deg,#180f24 50%,#d4b3ff 50%)}
.tw.t-sakura{background:linear-gradient(135deg,#fff0f5 50%,#e94b8a 50%)}
.tw.t-cream{background:linear-gradient(135deg,#fdf6ee 50%,#ff8a5c 50%)}
.tw.t-night{background:linear-gradient(135deg,#101624 50%,#a3c8ff 50%)}
.tw.t-grape{background:linear-gradient(135deg,#180c1c 50%,#b86ad9 50%)}
.tw.t-caramel{background:linear-gradient(135deg,#fff2e8 50%,#e07a3a 50%)}
.tw.t-blossom{background:linear-gradient(135deg,#fdd8e4 50%,#c94a7a 50%)}

.pal{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;width:100%;padding-top:4px}
.csw{aspect-ratio:1;border:1px solid var(--border);cursor:pointer;position:relative;min-height:26px}
.csw.active{border-color:var(--text)}
.csw.active::after{content:'◆';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:10px;text-shadow:0 0 4px #000}

.member{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border:1px solid var(--border-light);background:linear-gradient(180deg,var(--surface2),var(--surface3));margin-bottom:6px;gap:8px}
.member .minfo{flex:1;min-width:0}
.member .mname{color:var(--text);font-size:14px;font-family:var(--font-head);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.member .mlogin{color:var(--text3);font-size:11px}
.member .mtag{font-family:var(--font-head);font-size:9px;font-weight:700;color:var(--accent);border:1px solid var(--accent);padding:1px 4px;margin-left:6px;vertical-align:middle}
.member .kick{background:linear-gradient(180deg,var(--surface3),var(--surface2));border:1px solid var(--danger);color:var(--danger);font-family:var(--font-head);font-weight:700;font-size:11px;padding:4px 8px;cursor:pointer}

.acc{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border:1px solid var(--border-light);background:linear-gradient(180deg,var(--surface2),var(--surface3));margin-bottom:6px;gap:8px}
.acc.active{border-color:var(--accent)}
.acc .ainfo{flex:1;min-width:0}
.acc .aname{color:var(--text);font-size:14px;font-family:var(--font-head);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc .alogin{color:var(--text3);font-size:11px}
.acc .atag{font-family:var(--font-head);font-size:10px;font-weight:700;color:var(--accent)}
.acc button{background:linear-gradient(180deg,var(--surface3),var(--surface2));border:1px solid var(--border-light);color:var(--text2);font-family:var(--font-head);font-weight:700;font-size:11px;padding:4px 10px;cursor:pointer}
.acc button.del{border-color:var(--danger);color:var(--danger)}

.cpyr{text-align:center;font-size:11px;color:var(--text3);padding:16px 0 4px;line-height:1.6;font-style:italic}

.ctx{display:none;position:fixed;background:linear-gradient(180deg,var(--grad-panel-1),var(--grad-panel-2));border:1px solid var(--accent);z-index:200;min-width:180px;padding:4px 0}
.ctx.active{display:block}
.ctx button{display:block;width:100%;background:none;border:none;text-align:left;padding:10px 14px;color:var(--text2);font-family:var(--font-body);font-size:13px;cursor:pointer}
.ctx button:hover{background:var(--accent-dim);color:var(--accent)}
.ctx button.danger{color:var(--danger)}

.acts{display:none;position:fixed;z-index:210;background:linear-gradient(180deg,var(--grad-panel-1),var(--grad-panel-2));border:1px solid var(--accent);padding:6px;flex-direction:column;gap:6px;max-width:calc(100vw - 20px)}
.acts.active{display:flex}
.acts .rx-row,.acts .act-row{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.acts .rx-btn{background:linear-gradient(180deg,var(--surface3),var(--surface2));border:1px solid var(--border-light);font-size:20px;padding:6px 10px;cursor:pointer;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;line-height:1}
.acts .act-btn{background:linear-gradient(180deg,var(--surface3),var(--surface2));border:1px solid var(--border-light);color:var(--text2);font-family:var(--font-body);font-size:11px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.acts .act-btn.danger{color:var(--danger);border-color:var(--danger)}

.ts{position:fixed;top:12px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:500;pointer-events:none;padding:0 12px}
.ts .t{background:linear-gradient(180deg,var(--grad-panel-1),var(--grad-panel-2));border:1px solid var(--accent);padding:10px 14px;max-width:400px;width:100%;pointer-events:auto;cursor:pointer;display:flex;gap:10px;align-items:flex-start;animation:tin .25s ease}
.ts .t .ico{font-size:20px;flex-shrink:0;color:var(--accent)}
.ts .t .bd{flex:1;min-width:0}
.ts .t .tt{font-size:13px;color:var(--accent);font-family:var(--font-head);font-weight:700;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ts .t .tx{font-size:12px;color:var(--text);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ts .t.closing{animation:tout .2s ease forwards}
@keyframes tin{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
@keyframes tout{to{opacity:0;transform:translateY(-12px)}}

.ls{display:none;flex-direction:column;justify-content:center;align-items:center;height:100%;padding:20px;background:radial-gradient(ellipse at 50% 30%,var(--accent-dim),transparent 60%),var(--bg);position:relative;z-index:2}
.ls.active{display:flex}
.lb{width:100%;max-width:320px;background:linear-gradient(180deg,var(--grad-panel-1),var(--grad-panel-2));border:1px solid var(--border-light);padding:20px 16px 16px;position:relative}
.lb svg{width:64px;height:64px;margin:0 auto 12px;display:block;filter:drop-shadow(0 0 12px var(--accent));animation:fp 3s ease-in-out infinite}
.lb svg circle{fill:var(--accent)}
.lb svg .c{fill:var(--surface)}
@keyframes fp{0%,100%{filter:drop-shadow(0 0 10px var(--accent))}50%{filter:drop-shadow(0 0 22px var(--accent))}}
.lt{text-align:center;font-family:var(--font-head);font-size:28px;font-weight:700;color:var(--accent);text-shadow:0 0 12px var(--accent);letter-spacing:2px}
.lsub{text-align:center;font-size:11px;color:var(--text3);letter-spacing:1px;margin-bottom:18px;margin-top:4px}
.ltabs{display:flex;width:100%;border:1px solid var(--border-light);margin-bottom:12px;background:var(--surface)}
.ltabs button{flex:1;background:none;border:none;color:var(--text3);font-family:var(--font-head);font-weight:700;font-size:13px;padding:10px 4px;cursor:pointer;letter-spacing:1px}
.ltabs button.active{background:linear-gradient(180deg,var(--grad-btn-1),var(--grad-btn-2));color:var(--on-accent)}
.llabel{font-size:10px;color:var(--accent);font-family:var(--font-head);font-weight:700;letter-spacing:1.5px;margin-bottom:3px;display:block}
.lin{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:var(--font-body);font-size:14px;padding:9px 11px;outline:none;caret-color:var(--accent);margin-bottom:10px}
.lin:focus{border-color:var(--accent)}
.lin::placeholder{color:var(--text3)}
.lbtn{width:100%;background:linear-gradient(180deg,var(--grad-btn-1),var(--grad-btn-2));border:1px solid var(--accent);color:var(--on-accent);font-family:var(--font-head);font-weight:700;font-size:18px;padding:11px;cursor:pointer;letter-spacing:2px;margin-top:6px}
.lbtn:active{filter:brightness(.9)}
.lbtn:disabled{opacity:.6}
.lerr{color:var(--danger);font-size:12px;min-height:16px;text-align:center;margin-bottom:6px;font-style:italic}
.lhint{text-align:center;font-size:11px;color:var(--text3);margin-top:12px;font-style:italic}
.lhint .lnk{color:var(--accent);text-decoration:underline;cursor:pointer}

.pp{display:flex;align-items:center;gap:12px;padding:12px;background:var(--surface);border:1px solid var(--border);margin-bottom:12px}
.pp .pa{width:52px;height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:2px solid var(--accent);font-family:var(--font-head);font-size:26px;font-weight:700;overflow:hidden}
.pp .pa .emoji{font-size:30px;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.pp .pi{flex:1;min-width:0}
.pp .pn{font-family:var(--font-head);font-size:22px;font-weight:700;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp .ps{font-size:12px;font-style:italic;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp .pl{font-size:11px;color:var(--text3);margin-top:2px}

.dr{display:flex;justify-content:space-between;padding:6px 8px;border-bottom:1px solid var(--border);font-size:12px;background:var(--surface)}
.dr .l{color:var(--text3)}
.dr .v{color:var(--accent);font-weight:700}
</style>
</head>
<body>
<div id="app">

<div class="ls" id="loadingScreen" style="display:none">
  <div class="lb" style="text-align:center;padding:40px 20px">
    <svg viewBox="0 0 100 100"><circle cx="50" cy="20" r="14" opacity=".9"/><circle cx="78" cy="38" r="14" opacity=".8"/><circle cx="78" cy="62" r="14" opacity=".9"/><circle cx="50" cy="80" r="14" opacity=".8"/><circle cx="22" cy="62" r="14" opacity=".9"/><circle cx="22" cy="38" r="14" opacity=".8"/><circle class="c" cx="50" cy="50" r="12"/><circle cx="50" cy="50" r="6"/></svg>
    <div style="font-family:var(--font-head);font-size:16px;color:var(--accent);letter-spacing:2px;margin-top:12px">ЗАГРУЗКА...</div>
  </div>
</div>

<div class="ls" id="loginScreen">
  <div class="lb">
    <svg viewBox="0 0 100 100"><circle cx="50" cy="20" r="14" opacity=".9"/><circle cx="78" cy="38" r="14" opacity=".8"/><circle cx="78" cy="62" r="14" opacity=".9"/><circle cx="50" cy="80" r="14" opacity=".8"/><circle cx="22" cy="62" r="14" opacity=".9"/><circle cx="22" cy="38" r="14" opacity=".8"/><circle class="c" cx="50" cy="50" r="12"/><circle cx="50" cy="50" r="6"/></svg>
    <div class="lt">КРИСТА</div>
    <div class="lsub">.МЕССЕНДЖЕР v0.12</div>
    <div class="ltabs"><button class="active" id="tabLogin">ВХОД</button><button id="tabReg">РЕГИСТРАЦИЯ</button></div>
    <div class="lerr" id="authError"></div>
    <label class="llabel">ЛОГИН</label>
    <input class="lin" id="authLogin" placeholder="prikin_1" maxlength="32" autocomplete="off" />
    <label class="llabel" id="lblNick" style="display:none">НИК</label>
    <input class="lin" id="authNickname" placeholder="Кирилл" maxlength="30" autocomplete="off" style="display:none" />
    <label class="llabel">ПАРОЛЬ</label>
    <input class="lin" type="password" id="authPassword" placeholder="••••••••" />
    <input class="lin" type="password" id="authConfirm" placeholder="••••••••" style="display:none" />
    <button class="lbtn" id="authSubmitBtn">ВОЙТИ</button>
    <div class="lhint">Нет аккаунта? <span class="lnk" onclick="switchAuthTab('reg')">Регистрация</span></div>
  </div>
</div>

<div class="screen" id="screenMain">
  <div class="hdr1">
    <svg viewBox="0 0 100 100" id="logoBtn"><circle cx="50" cy="20" r="14" opacity=".9"/><circle cx="78" cy="38" r="14" opacity=".8"/><circle cx="78" cy="62" r="14" opacity=".9"/><circle cx="50" cy="80" r="14" opacity=".8"/><circle cx="22" cy="62" r="14" opacity=".9"/><circle cx="22" cy="38" r="14" opacity=".8"/><circle class="c" cx="50" cy="50" r="12"/><circle cx="50" cy="50" r="6"/></svg>
    <div class="hdr1-title">КРИСТА.МЕССЕНДЖЕР</div>
    <div class="hdr1-ver">v0.12</div>
  </div>
  <div class="hdr2">
    <div class="av" id="myHeaderAv"></div>
    <div class="ci">
      <div class="cn"><span id="myHeaderName">Ник</span> <span class="lg" id="myHeaderLogin">@—</span></div>
      <div class="cs" id="myHeaderStatus">в сети</div>
    </div>
  </div>
  <div class="search-bar">
    <input id="searchInput" placeholder="Поиск людей, групп или чатов..." autocomplete="off" />
    <button class="add-btn" id="addBtn">＋</button>
  </div>
  <div class="conn online" id="connBar"><span class="lbl" id="connLabel">OK</span></div>
  <div class="content" id="mainContent">
    <div class="screen active" id="tabContentChats"><div id="chatListContainer"></div></div>
    <div class="screen" id="tabContentProfile"><div style="padding:14px" id="profileContent"></div></div>
    <div class="screen" id="tabContentSettings"><div style="padding:14px" id="settingsContent"></div></div>
  </div>
  <div class="tabs">
    <button class="active" data-tab="Chats" onclick="switchTab('Chats')"><span class="i">💬</span>Чаты</button>
    <button data-tab="Profile" onclick="switchTab('Profile')"><span class="i">👤</span>Профиль</button>
    <button data-tab="Settings" onclick="switchTab('Settings')"><span class="i">⚙</span>Настройки</button>
  </div>
</div>

<div class="screen" id="screenChat" style="position:absolute;inset:0;background:var(--surface);z-index:10;flex-direction:column">
  <div class="chat-hdr">
    <button class="bk" id="backBtn">◄ НАЗАД</button>
    <div class="av2" id="chatAvatar">?</div>
    <div class="ci2" id="chatHeaderInfo"><div class="cn2" id="chatName">—</div><div class="cs2" id="chatSub">—</div></div>
    <button class="mn" id="chatMenuBtn">⋮</button>
  </div>
  <div class="conn online" id="connBarChat"><span class="lbl" id="connLabelChat">OK</span></div>
  <div class="messages" id="messagesArea"></div>
  <div class="typing" id="typingBar"><span class="dots"></span></div>
  <div class="emoji-panel" id="emojiPanel"><div class="emoji-grid" id="emojiGrid"></div></div>
  <div class="ib" id="inputBar">
    <button class="icn" id="emojiToggle">☺</button>
    <input id="msgInput" placeholder="Введите сообщение..." autocomplete="off" />
    <button class="snd" id="sendBtn">SEND</button>
  </div>
  <div class="join-bar" id="joinBar" style="display:none"><span class="info" id="joinInfo">Вы не участник</span><button id="joinBtn">ВСТУПИТЬ</button></div>
</div>

</div>

<div class="ov" id="createModal">
  <div class="mod">
    <h3>СОЗДАТЬ</h3>
    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:10px">
      <button onclick="openGroupCreate()" style="background:linear-gradient(180deg,var(--surface3),var(--surface2));border:1px solid var(--border-light);color:var(--text);font-family:var(--font-body);font-size:15px;padding:16px;cursor:pointer;text-align:left">👥 ГРУППА<span style="display:block;font-size:11px;color:var(--text3);margin-top:3px;font-style:italic">С логином группы</span></button>
      <button onclick="openChannelCreate()" style="background:linear-gradient(180deg,var(--surface3),var(--surface2));border:1px solid var(--border-light);color:var(--text);font-family:var(--font-body);font-size:15px;padding:16px;cursor:pointer;text-align:left">📢 КАНАЛ<span style="display:block;font-size:11px;color:var(--text3);margin-top:3px;font-style:italic">Пишут только админы</span></button>
    </div>
    <div class="row"><button onclick="closeModal('createModal')">[ ЗАКРЫТЬ ]</button></div>
  </div>
</div>

<div class="ov" id="dialogModal">
  <div class="mod">
    <h3>НОВЫЙ ДИАЛОГ</h3>
    <div class="err" id="dialogErr"></div>
    <input id="dialogLoginInput" placeholder="Логин собеседника" maxlength="32" autocomplete="off" />
    <div class="row"><button onclick="closeModal('dialogModal')">[ ОТМЕНА ]</button><button class="primary" onclick="createDialog()">[ СОЗДАТЬ ]</button></div>
  </div>
</div>

<div class="ov" id="groupModal">
  <div class="mod">
    <h3 id="groupModalTitle">НОВАЯ ГРУППА</h3>
    <div class="err" id="groupErr"></div>
    <input id="groupNameInput" placeholder="Название" maxlength="60" autocomplete="off" />
    <input id="groupLoginInput" placeholder="Логин группы (например my_club)" maxlength="32" autocomplete="off" />
    <input id="groupMemberInput" placeholder="Логин участника" maxlength="32" autocomplete="off" />
    <div class="row" style="margin-top:0;margin-bottom:6px"><button onclick="addGroupMember()">[+ ДОБАВИТЬ]</button></div>
    <div id="groupMembersList" style="max-height:140px;overflow-y:auto;margin-bottom:8px"></div>
    <div class="row"><button onclick="closeModal('groupModal')">[ ОТМЕНА ]</button><button class="primary" onclick="createGroup()">[ СОЗДАТЬ ]</button></div>
  </div>

<script>
const WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;
let token = localStorage.getItem('krista_token') || null;
let currentUser = JSON.parse(localStorage.getItem('krista_user') || 'null');
let ws = null, wsState = 'offline', lastPongAt = 0, pingInt = null, wdInt = null;
let chats = [], currentChatId = null, currentChatMeta = null;
let messages = {}, onlineStatus = {};
let replyToMsg = null, editingMsgId = null;
let groupDraft = [], groupKind = 'group';
let reconnectTimer = null, sendQueue = [];
let accounts = JSON.parse(localStorage.getItem('krista_accounts') || '[]');
let typingClearTimer = null, lastTypingSent = 0;
let autoTheme = localStorage.getItem('krista_auto_theme') === '1';
let systemTheme = localStorage.getItem('krista_system_theme') === '1';
let themeDay = localStorage.getItem('krista_theme_day') || 'sakura';
let themeNight = localStorage.getItem('krista_theme_night') || 'rose';
let autoThemeTimer = null, currentTab = 'Chats';

const $ = id => document.getElementById(id);
const app = $('app');

const PALETTE = ['#ffb3d1','#d4b3ff','#a3c8ff','#b86ad9','#e94b8a','#c94a7a','#e07a3a','#7ee0a0'];
const THEMES = [{id:'rose',name:'Роза'},{id:'lavender',name:'Лаванда'},{id:'sakura',name:'Сакура'},{id:'cream',name:'Крем'},{id:'night',name:'Ночь'},{id:'grape',name:'Виноград'},{id:'caramel',name:'Карамель'},{id:'blossom',name:'Blossom'}];
const REACTIONS = ['❤️','🔥','👍','😂','😢','😡'];
const EMOJIS = ['👍','👎','🍑','🌐','☢️','☣️','😀','😁','😅','🥺','😂','🙂','🙃','🫠','😉','😊','🥰','😍','😘','😗','😋','😝','🫣','😶','😏','😒','🙄','😮‍💨','🫨','😪','🤤','😴','😷','🤒','🥵','🥶','🤯','🥳','🫪','😨','😭','😱','😖','😣','😓','😡','🤬','😈','👿','💩','👾','❤️‍🔥','🔥','❤️','💔','🤝','👀','🐱','🦊','🐺','🐶','✅','❎','🔇','🔕','🔉','📢','🎙️','🎤','🎧','🎸','🎹','📱','📲','📟','🔋','🪫','💽','💾','🖥️','💻','📸','⚠️','🚫','🏴','🏳️'];
const STATUS_OPTS = [{id:'online',label:'В сети',color:'#7ee0a0'},{id:'away',label:'Отошёл',color:'#ffcc55'},{id:'dnd',label:'Не беспокоить',color:'#ff6a8a'},{id:'custom',label:'Свой текст',color:'#a89ab0'}];

EMOJIS.forEach(e => { const b = document.createElement('button'); b.type='button'; b.textContent=e; b.onclick=()=>insertEmoji(e); $('emojiGrid').appendChild(b); });

async function api(url, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (token) headers.Authorization = 'Bearer ' + token;
  const res = await fetch(url, { ...opts, headers });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(data.error || 'Ошибка'); e.status = res.status; throw e; }
  return data;
}
async function apiRetry(url, opts = {}, n = 3) {
  let last;
  for (let i = 0; i < n; i++) {
    try { return await api(url, opts); }
    catch(e) { last = e; if (e.status === 401 || e.status === 403 || e.status === 404) throw e; await new Promise(r => setTimeout(r, 1500)); }
  }
  throw last;
}

function showScreen(name) {
  ['loadingScreen','loginScreen'].forEach(s => $(s).classList.remove('active'));
  $('screenChat').classList.remove('active');
  $('screenMain').classList.remove('active');
  if (name === 'loading') $('loadingScreen').classList.add('active');
  else if (name === 'login') $('loginScreen').classList.add('active');
  else if (name === 'main') $('screenMain').classList.add('active');
}

function applyTheme(id) {
  app.className = '';
  if (id && id !== 'rose') app.classList.add('t-' + id);
  document.querySelectorAll('.tw').forEach(s => s.classList.toggle('active', s.dataset.theme === id));
}
function isDayTime() { const h = new Date().getHours(); return h >= 8 && h < 20; }
function computeTheme() {
  if (systemTheme) return window.matchMedia('(prefers-color-scheme: dark)').matches ? themeNight : themeDay;
  if (autoTheme) return isDayTime() ? themeDay : themeNight;
  return currentUser?.theme || 'rose';
}
function refreshTheme() { applyTheme(computeTheme()); }
function startAutoThemeWatcher() { if (autoThemeTimer) clearInterval(autoThemeTimer); autoThemeTimer = setInterval(refreshTheme, 60000); }
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (systemTheme) refreshTheme(); });

function statusLabel(st, text) { if (st === 'custom') return text || 'свой статус'; return {online:'в сети',away:'отошёл',dnd:'не беспокоить'}[st] || 'в сети'; }
function statusClass(st) { return 'st-' + (st || 'online'); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
function fTime(iso) { try { return new Date(iso).toTimeString().slice(0,8); } catch { return ''; } }
function fDate(iso) { try { const d = new Date(iso); const m = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря']; return `${d.getDate()} ${m[d.getMonth()]}`; } catch { return ''; } }
function shade(hex, pct) { try { const n = parseInt(hex.replace('#',''),16); const r = Math.max(0,Math.min(255,(n>>16)+pct)); const g = Math.max(0,Math.min(255,((n>>8)&0xff)+pct)); const b = Math.max(0,Math.min(255,(n&0xff)+pct)); return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0'); } catch { return hex; } }
function avatarBg(u) { const c = u?.avatarBgColor || '#ffb3d1'; return `linear-gradient(180deg,${c} 0,${shade(c,-25)} 100%)`; }
function avatarInner(u) { if (!u) return '<span>?</span>'; const isE = u.avatarType === 'emoji' && u.avatarEmoji; if (isE) return `<span class="emoji">${esc(u.avatarEmoji)}</span>`; return `<span style="color:${u.avatarBgColor||'var(--accent)'};text-shadow:0 0 6px ${u.avatarBgColor||'var(--accent)'}">${esc((u.nickname||u.login||'?')[0].toUpperCase())}</span>`; }
function statusDot(u, isOn) { if (!isOn) return `<span class="dot"></span>`; return `<span class="dot on" style="--dot-c:${u?.statusColor||'#7ee0a0'}"></span>`; }

// ---- АВТОРИЗАЦИЯ ----
let authMode = 'login';
function switchAuthTab(mode) {
  authMode = mode;
  const isLogin = mode === 'login';
  $('tabLogin').classList.toggle('active', isLogin);
  $('tabReg').classList.toggle('active', !isLogin);
  $('lblNick').style.display = isLogin ? 'none' : 'block';
  $('authNickname').style.display = isLogin ? 'none' : 'block';
  $('authConfirm').style.display = isLogin ? 'none' : 'block';
  $('authSubmitBtn').textContent = isLogin ? 'ВОЙТИ' : 'СОЗДАТЬ';
  $('authError').textContent = '';
}
$('tabLogin').onclick = () => switchAuthTab('login');
$('tabReg').onclick = () => switchAuthTab('reg');

$('authSubmitBtn').onclick = async () => {
  const err = $('authError'); err.textContent = '';
  const login = $('authLogin').value.trim();
  const pass = $('authPassword').value;
  try {
    $('authSubmitBtn').disabled = true;
    let data;
    if (authMode === 'login') {
      if (!login || !pass) return err.textContent = 'Заполни поля';
      data = await api('/api/login', { method:'POST', body: JSON.stringify({ login, password: pass }) });
    } else {
      const nick = $('authNickname').value.trim();
      const conf = $('authConfirm').value;
      if (!login || !nick || !pass) return err.textContent = 'Заполни все поля';
      if (pass !== conf) return err.textContent = 'Пароли не совпадают';
      data = await api('/api/register', { method:'POST', body: JSON.stringify({ login, nickname: nick, password: pass, confirmPassword: conf }) });
    }
    token = data.token;
    localStorage.setItem('krista_token', token);
    currentUser = { login: data.login, nickname: data.nickname };
    localStorage.setItem('krista_user', JSON.stringify(currentUser));
    saveAccount({ login: data.login, nickname: data.nickname, token });
    await afterLogin();
  } catch(e) { err.textContent = e.message; }
  finally { $('authSubmitBtn').disabled = false; }
};
$('authPassword').addEventListener('keydown', e => { if (e.key === 'Enter') $('authSubmitBtn').click(); });
$('authConfirm').addEventListener('keydown', e => { if (e.key === 'Enter') $('authSubmitBtn').click(); });

async function afterLogin() {
  try {
    const me = await apiRetry('/api/me');
    currentUser = me;
    localStorage.setItem('krista_user', JSON.stringify(me));
    applyUserToHeader();
    refreshTheme();
    showScreen('main');
    switchTab('Chats');
    connectWS();
    await loadChats();
  } catch(e) {
    if (e.status === 401 || e.status === 404) logout();
    else if (currentUser) { showScreen('main'); connectWS(); loadChats().catch(()=>{}); }
    else showScreen('login');
  }
}

// ---- ШАПКА — обновлённая (ярус 2 как contact) ----
function applyUserToHeader() {
  if (!currentUser) return;
  const u = currentUser;
  // Ярус 2 — как contact
  const avEl = $('myHeaderAv');
  const isE = u.avatarType === 'emoji' && u.avatarEmoji;
  const bg = u.avatarBgColor || '#ffb3d1';
  avEl.style.background = avatarBg(u);
  avEl.innerHTML = isE
    ? `<span class="emoji">${esc(u.avatarEmoji)}</span>`
    : `<span style="color:${bg};text-shadow:0 0 6px ${bg}">${esc((u.nickname||u.login||'?')[0].toUpperCase())}</span>`;
  $('myHeaderName').textContent = u.nickname || u.login;
  $('myHeaderName').style.color = u.nicknameColor || 'var(--accent)';
  $('myHeaderLogin').textContent = '@' + (u.login || '—');
  $('myHeaderStatus').textContent = statusLabel(u.status, u.statusText);
  $('myHeaderStatus').style.color = u.statusColor || 'var(--accent)';
  $('myHeaderStatus').className = 'cs ' + statusClass(u.status);
}

// ---- WEBSOCKET ----
function setConn(s) {
  wsState = s;
  ['connBar','connBarChat'].forEach(id => { const el = $(id); if (!el) return; el.classList.remove('online','connecting','offline'); el.classList.add(s); });
  const lbl = s === 'online' ? 'OK' : s === 'connecting' ? 'CONN' : 'OFF';
  $('connLabel').textContent = lbl; $('connLabelChat').textContent = lbl;
}
function connectWS() {
  if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;
  try { if (ws) ws.close(); } catch {}
  setConn('connecting');
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    ws.send(JSON.stringify({ type:'auth', payload:{ token } }));
    lastPongAt = Date.now();
    try { ws.send(JSON.stringify({ type:'ping' })); } catch {}
    setConn('online'); startHeartbeat(); flushQueue();
  };
  ws.onmessage = e => {
    try {
      const d = JSON.parse(e.data);
      if (d.type === 'pong') { lastPongAt = Date.now(); return; }
      if (d.type === 'ping') { try { ws.send(JSON.stringify({ type:'pong' })); } catch {} return; }
      handleWS(d);
    } catch {}
  };
  ws.onclose = () => {
    ws = null; stopHeartbeat(); setConn('offline');
    if (token) { if (reconnectTimer) clearTimeout(reconnectTimer); setConn('connecting'); reconnectTimer = setTimeout(connectWS, 2000); }
  };
  ws.onerror = () => {};
}
function startHeartbeat() {
  stopHeartbeat();
  pingInt = setInterval(() => { if (ws?.readyState === 1) try { ws.send(JSON.stringify({ type:'ping' })); } catch {} }, 10000);
  wdInt = setInterval(() => { if (ws?.readyState === 1 && Date.now() - lastPongAt > 25000) try { ws.close(); } catch {} }, 5000);
}
function stopHeartbeat() { if (pingInt) clearInterval(pingInt), pingInt = null; if (wdInt) clearInterval(wdInt), wdInt = null; }
function flushQueue() { if (!sendQueue.length || !ws || ws.readyState !== 1) return; const q = [...sendQueue]; sendQueue = []; q.forEach(p => { try { ws.send(JSON.stringify({ type:'newMessage', payload:p })); } catch { sendQueue.push(p); } }); }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && token) {
    if (!ws || ws.readyState !== 1) connectWS();
    else try { ws.send(JSON.stringify({ type:'ping' })); } catch {}
  }
});
window.addEventListener('online', () => { if (token && (!ws || ws.readyState !== 1)) connectWS(); });

function handleWS(data) {
  const { type, payload } = data;
  if (type === 'newMessage') {
    if (!messages[payload.chatId]) messages[payload.chatId] = [];
    if (messages[payload.chatId].some(m => m.id === payload.id || (payload.clientId && m.clientId === payload.clientId))) {
      const i = messages[payload.chatId].findIndex(m => m.clientId && m.clientId === payload.clientId);
      if (i !== -1) messages[payload.chatId][i] = payload;
      if (currentChatId === payload.chatId) renderMessages();
      return;
    }
    messages[payload.chatId].push(payload);
    if (currentChatId === payload.chatId) { renderMessages(); api(`/api/chats/${payload.chatId}/messages`).catch(()=>{}); }
    if (payload.sender !== currentUser.login) {
      const chat = chats.find(c => c.id === payload.chatId);
      showNotification(chat?.name || 'Чат', payload.senderName, payload.text, payload.chatId);
      beep();
    }
    loadChats();
  } else if (type === 'messageAck') {
    if (payload.clientId && messages[currentChatId]) {
      const i = messages[currentChatId].findIndex(m => m.clientId === payload.clientId);
      if (i !== -1) { messages[currentChatId][i].pending = false; messages[currentChatId][i].id = payload.id; renderMessages(); }
    }
  } else if (type === 'messageEdited') {
    if (messages[payload.chatId]) { const i = messages[payload.chatId].findIndex(m => m.id === payload.id); if (i !== -1) { messages[payload.chatId][i] = payload; if (currentChatId === payload.chatId) renderMessages(); } }
  } else if (type === 'messageReaction') {
    if (messages[payload.chatId]) { const i = messages[payload.chatId].findIndex(m => m.id === payload.id); if (i !== -1) { messages[payload.chatId][i].reactions = payload.reactions; if (currentChatId === payload.chatId) renderMessages(); } }
  } else if (type === 'deleteMessage') {
    if (messages[payload.chatId]) { const i = messages[payload.chatId].findIndex(m => m.id === payload.messageId); if (i !== -1) messages[payload.chatId][i].deleted = 1; if (currentChatId === payload.chatId) renderMessages(); }
    loadChats();
  } else if (type === 'chatDeleted') {
    chats = chats.filter(c => c.id !== payload.chatId);
    delete messages[payload.chatId];
    if (currentChatId === payload.chatId) { currentChatId = null; $('screenChat').classList.remove('active'); }
    renderChats();
  } else if (type === 'status') {
    onlineStatus[payload.login] = payload.status === 'online';
    renderChats(); if (currentChatMeta && !currentChatMeta.isGroup) updateChatHeader(currentChatMeta);
  } else if (type === 'userUpdated') {
    if (currentChatMeta?.otherLogin === payload.login) { currentChatMeta.otherUser = payload; updateChatHeader(currentChatMeta); }
    renderChats();
  } else if (type === 'typing') {
    if (payload.chatId === currentChatId) showTyping(`${payload.nickname} печатает`);
  } else if (['chatCreated','chatRenamed','memberAdded','memberRemoved'].includes(type)) {
    loadChats();
  } else if (type === 'error') {
    if (payload?.clientId) { const arr = messages[currentChatId]; if (arr) { const i = arr.findIndex(m => m.clientId === payload.clientId); if (i !== -1) { arr[i].pending = false; arr[i].failed = true; renderMessages(); } } }
    toast('Ошибка', payload?.error || payload || 'Неизвестно');
  }
}

async function loadChats() {
  try { chats = await apiRetry('/api/chats'); renderChats(); }
  catch(e) { if (e.status === 401) logout(); else $('chatListContainer').innerHTML = '<div class="empty">Ошибка загрузки</div>'; }
}

let searchQuery = '';
function renderChats() {
  const filtered = searchQuery
    ? chats.filter(c => c.name.toLowerCase().includes(searchQuery.toLowerCase()) || (c.login && c.login.toLowerCase().includes(searchQuery.toLowerCase())) || (c.otherLogin && c.otherLogin.toLowerCase().includes(searchQuery.toLowerCase())))
    : chats;
  if (!filtered.length) {
    $('chatListContainer').innerHTML = searchQuery ? '<div class="empty">Ничего не найдено</div>' : '<div class="empty">Нет чатов<br>Найди пользователя через поиск</div>';
    return;
  }
  const dialogs = filtered.filter(c => !c.isGroup);
  const groups = filtered.filter(c => c.isGroup);
  const onlines = dialogs.filter(c => c.online || onlineStatus[c.otherLogin]);
  const offlines = dialogs.filter(c => !(c.online || onlineStatus[c.otherLogin]));

  let html = '';
  if (onlines.length) html += `<div class="section">● ОНЛАЙН<span class="cnt">${onlines.length}</span></div>` + onlines.map(renderContact).join('');
  if (offlines.length) html += `<div class="section">○ ОФФЛАЙН<span class="cnt">${offlines.length}</span></div>` + offlines.map(renderContact).join('');
  if (groups.length) html += `<div class="section"># ГРУППЫ<span class="cnt">${groups.length}</span></div>` + groups.map(renderContact).join('');

  $('chatListContainer').innerHTML = html;
  $('chatListContainer').querySelectorAll('.contact').forEach(el => {
    const id = el.dataset.id;
    el.addEventListener('click', () => openChat(id));
    el.addEventListener('contextmenu', e => { e.preventDefault(); showChatCtx(e.clientX, e.clientY, id); });
    let t;
    el.addEventListener('touchstart', e => { t = setTimeout(() => { const p = e.touches[0]; showChatCtx(p.clientX, p.clientY, id); }, 600); });
    el.addEventListener('touchend', () => clearTimeout(t));
    el.addEventListener('touchmove', () => clearTimeout(t));
  });
}

function renderContact(c) {
  const isOn = c.isGroup ? false : (c.online || onlineStatus[c.otherLogin] || false);
  const u = c.isGroup ? null : c.otherUser;
  const initial = c.isGroup ? '#' : (u?.nickname || u?.login || '?')[0].toUpperCase();
  const isE = u?.avatarType === 'emoji' && u.avatarEmoji;
  const bg = u?.avatarBgColor || (c.isCommon ? 'var(--accent)' : '#ffb3d1');
  const avInner = isE
    ? `<span class="emoji">${esc(u.avatarEmoji)}</span>`
    : `<span style="color:${c.isCommon ? 'var(--on-accent)' : bg};text-shadow:${c.isCommon ? 'none' : '0 0 6px ' + bg}">${esc(initial)}</span>`;
  const dot = c.isGroup ? '' : statusDot(u, isOn);
  const nameColor = u?.nicknameColor || 'var(--text)';
  const statusColor = u?.statusColor || 'var(--text3)';
  const statusText = c.isGroup ? c.subtitle : (u?.statusText || statusLabel(u?.status, ''));
  let preview = '';
  if (c.lastMessage) {
    const m = c.lastMessage;
    const t = m.text.length > 40 ? m.text.slice(0, 38) + '…' : m.text;
    preview = `<div class="cp">${esc(m.senderName)}: ${esc(t)}</div>`;
  } else if (c.isGroup) preview = `<div class="cp" style="font-style:italic">${esc(c.subtitle || '')}</div>`;
  const badge = c.unreadCount > 0 ? `<div class="bdg">${c.unreadCount}</div>` : '';
  const loginLabel = c.isGroup ? (c.login ? '@' + c.login : '') : '@' + (c.otherLogin || '');
  const avBg = c.isCommon ? 'background:linear-gradient(180deg,var(--grad-btn-1),var(--grad-btn-2))' : (c.isGroup ? 'background:linear-gradient(180deg,var(--surface3),var(--surface2))' : 'background:' + avatarBg(u));
  return `<div class="contact${c.isCommon?' common':''}" data-id="${c.id}">
    <div class="av" style="${avBg}">${avInner}${dot}</div>
    <div class="ci"><div class="cn" style="color:${nameColor}">${esc(c.name)} <span class="lg">${esc(loginLabel)}</span></div><div class="cs ${statusClass(u?.status)}" style="color:${statusColor}">${esc(statusText)}</div>${preview}</div>
    ${badge}</div>`;
}

async function openChat(chatId) {
  currentChatId = chatId;
  const chat = chats.find(c => c.id === chatId);
  if (!chat) { toast('Инфо', 'Чат не найден'); return; }
  currentChatMeta = chat;
  updateChatHeader(chat);
  updateJoinBar(chat);
  $('screenChat').classList.add('active');
  $('emojiPanel').classList.remove('active');
  $('emojiToggle').classList.remove('active');
  replyToMsg = null;
  $('msgInput').value = '';
  hideTyping();
  $('messagesArea').innerHTML = '<div class="empty">Загрузка...</div>';
  try {
    messages[chatId] = await apiRetry(`/api/chats/${chatId}/messages`);
    renderMessages();
  } catch(e) {
    if (messages[chatId]) renderMessages();
    else $('messagesArea').innerHTML = '<div class="empty">Ошибка загрузки</div>';
  }
}

function updateChatHeader(chat) {
  if (!chat) return;
  const isG = chat.isGroup;
  $('chatName').textContent = (chat.name || '—').toUpperCase();
  const color = isG ? 'var(--accent)' : (chat.otherUser?.nicknameColor || 'var(--text)');
  $('chatName').style.color = color;
  if (isG) {
    $('chatSub').textContent = chat.isCommon ? `${chat.membersCount} участ. · общий` : `${chat.membersCount} участ.${chat.isChannel?' · канал':''} · @${chat.login||''}`;
    $('chatSub').className = 'cs2';
  } else {
    const st = chat.otherUser?.statusText || statusLabel(chat.otherUser?.status, '');
    $('chatSub').textContent = `@${chat.otherLogin} · ${st}`;
    $('chatSub').className = 'cs2 ' + statusClass(chat.otherUser?.status);
  }
  const av = $('chatAvatar');
  if (isG) { av.innerHTML = `<span style="color:var(--accent)">#</span>`; av.style.background = 'linear-gradient(180deg,var(--surface3),var(--surface2))'; }
  else {
    const u = chat.otherUser;
    const isE = u?.avatarType === 'emoji' && u.avatarEmoji;
    const bg = u?.avatarBgColor || '#ffb3d1';
    const inner = isE ? `<span class="emoji">${esc(u.avatarEmoji)}</span>` : `<span style="color:${bg};text-shadow:0 0 6px ${bg}">${esc((u?.nickname || u?.login || '?')[0].toUpperCase())}</span>`;
    const isOn = chat.online || onlineStatus[chat.otherLogin];
    av.innerHTML = inner + statusDot(u, isOn);
    av.style.background = avatarBg(u);
  }
}

function updateJoinBar(chat) {
  if (!chat) return;
  const notM = chat.notMember === true;
  const isCh = chat.isChannel, isAdm = chat.isAdmin;
  if (notM) {
    $('inputBar').style.display = 'none';
    $('emojiPanel').classList.remove('active');
    $('joinBar').style.display = 'flex';
    $('joinInfo').textContent = chat.isPrivate ? 'Приватный чат' : `${chat.membersCount} участ.`;
    $('joinBtn').style.display = chat.isPrivate ? 'none' : 'inline-block';
  } else if (isCh && !isAdm) {
    $('inputBar').style.display = 'none';
    $('joinBar').style.display = 'flex';
    $('joinInfo').textContent = 'В канале пишут только админы';
    $('joinBtn').style.display = 'none';
  } else {
    $('inputBar').style.display = 'flex';
    $('joinBar').style.display = 'none';
  }
}

$('backBtn').onclick = () => { $('screenChat').classList.remove('active'); currentChatId = null; currentChatMeta = null; loadChats(); };
$('chatHeaderInfo').onclick = () => { if (currentChatMeta?.isGroup && !currentChatMeta.isCommon) openGroupSettings(); };
$('chatMenuBtn').onclick = e => { e.stopPropagation(); const r = e.target.getBoundingClientRect(); showChatCtx(r.left - 100, r.bottom + 6, currentChatId); };

function renderMessages() {
  const arr = messages[currentChatId] || [];
  if (!arr.length) { $('messagesArea').innerHTML = '<div class="empty">Нет сообщений</div>'; return; }
  let html = '', lastDate = null;
  for (const m of arr) {
    if (m.deleted) continue;
    const d = fDate(m.timestamp);
    if (d !== lastDate) { html += `<div class="dsep">${esc(d.toUpperCase())}</div>`; lastDate = d; }
    html += renderMsg(m, arr);
  }
  $('messagesArea').innerHTML = html;
  $('messagesArea').scrollTop = $('messagesArea').scrollHeight;
  bindMsgEvents(arr);
}

function renderMsg(m, arr) {
  const isOut = m.sender === currentUser.login;
  let replyHtml = '';
  if (m.replyTo) {
    const p = arr.find(x => x.id === m.replyTo);
    if (p && !p.deleted) {
      const short = p.text.length > 22 ? p.text.slice(0, 20) + '…' : p.text;
      replyHtml = `<div class="rq" data-jump="${p.id}">↪ ${esc(p.senderName)}: ${esc(short)} <span class="jm">[Перейти]</span></div>`;
    } else replyHtml = `<div class="rq">↪ [удалено]</div>`;
  }
  let txt = esc(m.text);
  txt = txt.replace(/(https?:\/\/[^\s]+|www\.[^\s]+)/gi, match => { const url = match.startsWith('www.') ? 'http://' + match : match; return `<span class="link" data-url="${esc(url)}">${esc(match)}</span>`; });
  txt = txt.replace(/@([a-zA-Z0-9_-]{3,32})/g, (_, name) => `<span class="mention">@${esc(name)}</span>`);
  const edited = m.editedAt ? `<span class="edt">(изм.)</span>` : '';
  let state = '';
  if (m.pending) state = '<span class="stt">⏳</span>';
  else if (m.failed) state = `<span class="stt" data-retry="${m.clientId}">ошибка ↻</span>`;
  let rxs = '';
  const rlist = m.reactions || [];
  if (rlist.length) rxs = '<div class="rxs">' + rlist.map(r => { const mine = r.logins.includes(currentUser.login); return `<span class="rx ${mine?'mine':''}" data-react="${esc(r.emoji)}" data-msg="${m.id}">${r.emoji} ${r.logins.length}</span>`; }).join('') + '</div>';
  const msgId = m.id || m.clientId;
  const senderColor = isOut ? (currentUser.nicknameColor || 'var(--accent)') : 'var(--accent)';
  const avInner = isOut ? avatarInner(currentUser) : `<span>${esc((m.senderName || '?')[0].toUpperCase())}</span>`;
  const avStyle = isOut ? `background:${avatarBg(currentUser)}` : '';
  return `<div class="msg ${isOut?'out':''} ${m.pending?'pending':''} ${m.failed?'failed':''}" data-id="${msgId}" data-client="${m.clientId||''}" data-sender="${m.sender}">
    <div class="mav" style="${avStyle}">${avInner}</div>
    <div class="bub"><div class="hd"><span class="nm" style="color:${senderColor}">${esc(m.senderName)}</span><span class="tm">${fTime(m.timestamp)}</span>${edited}</div>${replyHtml}<div class="txt">${txt}${state}</div>${rxs}</div></div>`;
}

function bindMsgEvents(arr) {
  $('messagesArea').querySelectorAll('.rq[data-jump]').forEach(el => {
    el.addEventListener('click', e => { e.stopPropagation(); const t = $('messagesArea').querySelector(`.msg[data-id="${el.dataset.jump}"]`); if (t) { t.scrollIntoView({ behavior:'smooth', block:'center' }); t.classList.add('flash'); setTimeout(() => t.classList.remove('flash'), 1700); } });
  });
  $('messagesArea').querySelectorAll('.link').forEach(el => el.addEventListener('click', e => { e.stopPropagation(); window.open(el.dataset.url, '_blank', 'noopener'); }));
  $('messagesArea').querySelectorAll('[data-retry]').forEach(el => el.addEventListener('click', e => { e.stopPropagation(); retryMsg(el.dataset.retry); }));
  $('messagesArea').querySelectorAll('.rx').forEach(el => el.addEventListener('click', e => { e.stopPropagation(); toggleReaction(el.dataset.msg, el.dataset.react); }));
  $('messagesArea').querySelectorAll('.msg').forEach(el => {
    let t = null, moved = false;
    el.addEventListener('touchstart', () => { moved = false; t = setTimeout(() => { if (!moved) showMsgActions(el); }, 450); }, { passive:true });
    el.addEventListener('touchmove', () => { moved = true; if (t) clearTimeout(t); });
    el.addEventListener('touchend', () => { if (t) clearTimeout(t); });
    el.addEventListener('contextmenu', e => { e.preventDefault(); showMsgActions(el); });
    el.addEventListener('click', e => { if (e.target.closest('.link') || e.target.closest('.jm') || e.target.closest('.rx') || e.target.closest('[data-retry]')) return; showMsgActions(el); });
  });
}

function showMsgActions(el) {
  const msgId = el.dataset.id, sender = el.dataset.sender;
  const arr = messages[currentChatId] || [];
  const m = arr.find(x => x.id === msgId || x.clientId === msgId);
  if (!m) return;
  const isMine = sender === currentUser.login;
  const isAdmin = currentChatMeta?.isAdmin;
  const canDel = isMine || isAdmin;
  const canEdit = isMine && m.id && (!m.editedAt || Date.now() - new Date(m.timestamp).getTime() < 5*86400000);
  const rxRow = $('rxRow'); rxRow.innerHTML = '';
  REACTIONS.forEach(r => { const b = document.createElement('button'); b.className = 'rx-btn'; b.textContent = r; b.onclick = e => { e.stopPropagation(); toggleReaction(m.id, r); hideMsgActions(); }; rxRow.appendChild(b); });
  const actRow = $('actRow'); actRow.innerHTML = '';
  const add = (label, cls, fn) => { const b = document.createElement('button'); b.className = 'act-btn' + (cls?' '+cls:''); b.textContent = label; b.onclick = e => { e.stopPropagation(); fn(); hideMsgActions(); }; actRow.appendChild(b); };
  add('📋 КОПИЯ','',()=>navigator.clipboard?.writeText(m.text).then(()=>toast('Инфо','Скопировано')));
  add('↩ ОТВЕТ','',()=>{ replyToMsg = m.id; $('msgInput').placeholder = `↪ ${m.senderName}: _`; $('msgInput').focus(); });
  if (canEdit) add('✏ ИЗМ','',()=>openEdit(m));
  if (canDel) add('🗑 УДАЛ','danger',()=>{ if (confirm('Удалить?')) sendWS({ type:'deleteMessage', payload:{ messageId:m.id } }); });
  const rect = el.getBoundingClientRect();
  $('msgActions').classList.add('active');
  const w = $('msgActions').offsetWidth || 280, h = $('msgActions').offsetHeight || 100;
  let left = rect.left + rect.width/2 - w/2, top = rect.top - h - 8;
  if (left < 8) left = 8;
  if (left + w > window.innerWidth - 8) left = window.innerWidth - w - 8;
  if (top < 8) top = rect.bottom + 8;
  $('msgActions').style.left = left + 'px'; $('msgActions').style.top = top + 'px';
}
function hideMsgActions() { $('msgActions').classList.remove('active'); }
document.addEventListener('click', e => { if (!$('msgActions').contains(e.target)) hideMsgActions(); });
function toggleReaction(msgId, emoji) { sendWS({ type:'toggleReaction', payload:{ messageId: msgId, emoji } }); }
function sendWS(obj) { if (ws && ws.readyState === 1) try { ws.send(JSON.stringify(obj)); return true; } catch {} return false; }

$('msgInput').addEventListener('input', () => {
  const now = Date.now();
  if (now - lastTypingSent > 1500 && currentChatId) { lastTypingSent = now; sendWS({ type:'typing', payload:{ chatId: currentChatId } }); }
});
$('msgInput').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); } });

function sendMsg() {
  const text = $('msgInput').value.trim();
  if (!text || !currentChatId || !currentUser) return;
  const clientId = 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
  const opt = { id:null, clientId, chatId:currentChatId, sender:currentUser.login, senderName:currentUser.nickname||currentUser.login, text, timestamp:new Date().toISOString(), replyTo:replyToMsg||null, deleted:0, pending:true, reactions:[] };
  if (!messages[currentChatId]) messages[currentChatId] = [];
  messages[currentChatId].push(opt);
  renderMessages();
  const payload = { chatId:currentChatId, text, clientId };
  if (replyToMsg) payload.replyTo = replyToMsg;
  $('msgInput').value = ''; replyToMsg = null; $('msgInput').placeholder = 'Введите сообщение...';
  if (!sendWS({ type:'newMessage', payload })) sendQueue.push(payload);
  setTimeout(() => { if (opt.pending) { opt.pending = false; opt.failed = true; if (currentChatId === opt.chatId) renderMessages(); } }, 8000);
  setTimeout(() => $('msgInput').focus(), 50);
}
let sendLock = false;
function sendTap(e) {
  if (e.type === 'touchstart') { e.preventDefault(); if (sendLock) return; sendLock = true; sendMsg(); setTimeout(() => sendLock = false, 300); }
  else { if (sendLock) return; sendMsg(); }
}
$('sendBtn').addEventListener('touchstart', sendTap, { passive:false });
$('sendBtn').addEventListener('click', sendTap);

function retryMsg(clientId) {
  const arr = messages[currentChatId]; if (!arr) return;
  const m = arr.find(x => x.clientId === clientId); if (!m) return;
  m.failed = false; m.pending = true;
  const payload = { chatId:currentChatId, text:m.text, clientId };
  if (m.replyTo) payload.replyTo = m.replyTo;
  if (!sendWS({ type:'newMessage', payload })) sendQueue.push(payload);
  renderMessages();
}

$('emojiToggle').onclick = () => { const o = $('emojiPanel').classList.toggle('active'); $('emojiToggle').classList.toggle('active', o); };
function insertEmoji(e) {
  const i = $('msgInput').selectionStart ?? $('msgInput').value.length;
  const j = $('msgInput').selectionEnd ?? i;
  $('msgInput').value = $('msgInput').value.slice(0, i) + e + $('msgInput').value.slice(j);
  $('msgInput').setSelectionRange(i + e.length, i + e.length);
  $('msgInput').focus();
}
function showTyping(text) { const t = $('typingBar'); t.querySelector('.dots').textContent = text; t.classList.add('vis'); if (typingClearTimer) clearTimeout(typingClearTimer); typingClearTimer = setTimeout(hideTyping, 4000); }
function hideTyping() { $('typingBar').classList.remove('vis'); }

function openEdit(m) {
  editingMsgId = m.id;
  $('editTextarea').value = m.text;
  $('editCounter').textContent = m.text.length;
  $('editErr').textContent = '';
  $('editModal').classList.add('active');
}
$('editTextarea').addEventListener('input', () => $('editCounter').textContent = $('editTextarea').value.length);
function saveEdit() {
  const t = $('editTextarea').value.trim();
  if (!t) return $('editErr').textContent = 'Пусто';
  if (!editingMsgId) return;
  const ok = sendWS({ type:'editMessage', payload:{ messageId: editingMsgId, text: t } });
  if (!ok) return $('editErr').textContent = 'Нет соединения';
  closeModal('editModal'); editingMsgId = null;
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('#mainContent > .screen').forEach(s => s.classList.remove('active'));
  const el = $('tabContent' + tab); if (el) el.classList.add('active');
  if (tab === 'Profile') renderProfile();
  if (tab === 'Settings') renderSettings();
}

// Поиск
let searchTimer = null;
$('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  clearTimeout(searchTimer);
  searchTimer = setTimeout(doSearch, 250);
});
let searchResults = null;
async function doSearch() {
  if (!searchQuery || searchQuery.length < 2) { searchResults = null; renderChats(); return; }
  try { const r = await api(`/api/search?q=${encodeURIComponent(searchQuery)}`); searchResults = r; renderSearchResults(); }
  catch(e) { console.error(e); }
}
function renderSearchResults() {
  if (!searchResults) return;
  const { users, chats: groups } = searchResults;
  let html = '';
  if (users.length) {
    html += '<div class="section">👤 ПОЛЬЗОВАТЕЛИ</div>';
    users.forEach(u => {
      const isE = u.avatarType === 'emoji' && u.avatarEmoji;
      const bg = u.avatarBgColor || '#ffb3d1';
      const avInner = isE ? `<span class="emoji">${esc(u.avatarEmoji)}</span>` : `<span style="color:${bg};text-shadow:0 0 6px ${bg}">${esc((u.nickname||u.login||'?')[0].toUpperCase())}</span>`;
      html += `<div class="contact" data-type="user" data-login="${esc(u.login)}">
        <div class="av" style="background:${avatarBg(u)}">${avInner}${statusDot(u, onlineStatus[u.login])}</div>
        <div class="ci"><div class="cn" style="color:${u.nicknameColor||'var(--text)'}">${esc(u.nickname)} <span class="lg">@${esc(u.login)}</span></div><div class="cs ${statusClass(u.status)}" style="color:${u.statusColor||'var(--text3)'}">${esc(u.statusText || statusLabel(u.status,''))}</div></div>
      </div>`;
    });
  }
  if (groups.length) {
    html += '<div class="section"># ГРУППЫ</div>';
    groups.forEach(g => {
      html += `<div class="contact" data-type="group" data-id="${g.id}" data-login="${esc(g.login||'')}">
        <div class="av" style="background:linear-gradient(180deg,var(--surface3),var(--surface2))"><span style="color:var(--accent)">#</span></div>
        <div class="ci"><div class="cn">${esc(g.name)} <span class="lg">@${esc(g.login||'')}</span></div><div class="cs">${g.membersCount} участ.${g.isPrivate?' · приватная':''}${g.isMember?' · вы участник':''}</div></div>
      </div>`;
    });
  }
  if (!html) html = '<div class="empty">Ничего не найдено</div>';
  $('chatListContainer').innerHTML = html;
  $('chatListContainer').querySelectorAll('.contact').forEach(el => {
    el.addEventListener('click', () => {
      if (el.dataset.type === 'user') {
        $('searchInput').value = '';
        searchQuery = '';
        searchResults = null;
        $('dialogLoginInput').value = el.dataset.login;
        $('dialogErr').textContent = '';
        $('dialogModal').classList.add('active');
      } else {
        const id = el.dataset.id;
        const found = chats.find(c => c.id === id);
        $('searchInput').value = '';
        searchQuery = '';
        searchResults = null;
        if (found) openChat(id);
        else {
          api(`/api/chats/find/${encodeURIComponent(el.dataset.login)}`).then(c => {
            currentChatId = c.id;
            currentChatMeta = { ...c, isGroup: true, isAdmin: false, notMember: !c.isMember };
            $('chatName').textContent = (c.name || '?').toUpperCase();
            $('chatSub').textContent = `${c.membersCount} участ. · @${c.login}`;
            updateJoinBar(currentChatMeta);
            $('messagesArea').innerHTML = '<div class="empty">Вы ещё не в этом чате</div>';
            $('screenChat').classList.add('active');
          }).catch(e => toast('Ошибка', e.message));
        }
      }
    });
  });
}

let audioCtx = null;
function beep() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.06, audioCtx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.15);
    o.start(); o.stop(audioCtx.currentTime + 0.16);
  } catch {}
}

  showScreen('login');
  ['authLogin','authPassword','authConfirm','authNickname'].forEach(id => $(id).value = '');
  $('authError').textContent = '';
  switchAuthTab('login');
}
async function deleteAccount() {
  if (!confirm('Удалить аккаунт навсегда?')) return;
  try { await api('/api/me', { method:'DELETE' }); accounts = accounts.filter(a => a.login !== currentUser.login); saveAccList(); toast('Инфо', 'Аккаунт удалён'); setTimeout(logout, 500); }
  catch(e) { toast('Ошибка', e.message); }
}

// ============================================================
//  ПРИВЯЗКА КЛАВИАТУРЫ — через visualViewport (исправлено)
// ============================================================
(function setupViewport() {
  if (!window.visualViewport) return;
  const vv = window.visualViewport;
  let raf = null;

  function update() {
    if (raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const kbHeight = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      // Только высота #app, без сдвигов и transform — фикс бага "пол экрана вправо"
      if (kbHeight > 80) {
        // Клавиатура открыта — сжимаем #app
        app.style.height = vv.height + 'px';
        app.style.maxHeight = vv.height + 'px';
        // Скролл сообщений вниз
        if (currentChatId) {
          setTimeout(() => { const a = $('messagesArea'); if (a) a.scrollTop = a.scrollHeight; }, 30);
        }
      } else {
        // Клавиатура закрыта — возвращаем нормальную высоту
        app.style.height = '';
        app.style.maxHeight = '';
      }
    });
  }

  vv.addEventListener('resize', update);
  vv.addEventListener('scroll', update);
  window.addEventListener('orientationchange', () => setTimeout(update, 200));
  // Фокус на поле ввода — подождать клавиатуру
  $('msgInput').addEventListener('focus', () => setTimeout(update, 250));
  $('msgInput').addEventListener('blur', () => setTimeout(update, 250));
})();

// Старт
(async function init() {
  if (autoTheme) startAutoThemeWatcher();
  if (!token) { showScreen('login'); return; }
  if (currentUser) { applyUserToHeader(); refreshTheme(); showScreen('main'); switchTab('Chats'); }
  else showScreen('loading');
  try {
    const me = await apiRetry('/api/me');
    currentUser = me;
    localStorage.setItem('krista_user', JSON.stringify(me));
    applyUserToHeader(); refreshTheme();
    showScreen('main'); switchTab('Chats');
    connectWS();
    await loadChats();
  } catch(e) {
    if (e.status === 401 || e.status === 404) logout();
    else if (currentUser) { showScreen('main'); connectWS(); loadChats().catch(()=>{}); }
    else showScreen('login');
  }
})();
