<style>
:root{
  --safe-top:env(safe-area-inset-top,0);--safe-bottom:env(safe-area-inset-bottom,0);
  --sidebar-w:64px;--rad:20px;--rad-sm:14px;
  --font-head:'Comfortaa',sans-serif;--font-body:'Inter',sans-serif;--font-mono:'JetBrains Mono',monospace;
  --blur: 30px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;position:fixed;inset:0;width:100%;background:#000}
.txt,.file-name,.file-info,.dlg-detail,.info-grid .v,.info-grid .k,.ach-name,.ach-desc,.history-sub,.history-name,.ch-name,.ch-sub,.pp-name,.pp-login,.mname,.mlogin,.member-row .mtxt,.thread-card-title,.thread-card-text,.thread-detail-text,.thread-post-text{user-select:text;-webkit-user-select:text}
input,textarea{user-select:text !important;-webkit-user-select:text !important}

/* ========== LIQUID GLASS 3D ========== */
.glass {
  background: rgba(255, 255, 255, 0.03);
  backdrop-filter: blur(var(--blur)) saturate(250%) contrast(120%);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(250%) contrast(120%);
  border-top: 1px solid rgba(255, 255, 255, 0.5);
  border-left: 1px solid rgba(255, 255, 255, 0.3);
  border-bottom: 1px solid rgba(0, 0, 0, 0.2);
  border-right: 1px solid rgba(0, 0, 0, 0.1);
  box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 2px 5px rgba(0,0,0,0.3), inset 0 1px 1px rgba(255,255,255,0.3), inset 0 -1px 1px rgba(0,0,0,0.2);
  transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
  position: relative; z-index: 10;
}
.glass::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.05) 100%);
  pointer-events: none; z-index: -1; border-radius: inherit;
}
.shake-click:active {
  transform: scale(0.96) translateY(2px);
  transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.1s;
  box-shadow: 0 10px 20px rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.3), inset 0 2px 5px rgba(0,0,0,0.2);
}

/* ========== ТЕМЫ И ОБОИ ========== */
html[data-theme="sunset"] {
  --accent:#ff3b30; --accent-2:#cc2a20; --accent-rgb:255,59,48;
  --text:#fff; --text-2:rgba(255,255,255,0.7); --text-3:rgba(255,255,255,0.4);
  --bg-gradient: linear-gradient(180deg, #1a0b2e 0%, #4a1a30 40%, #ff3b30 100%);
}
html[data-theme="oldschool"] {
  --accent:#7fff2a; --accent-2:#3aaa00; --accent-rgb:127,255,42;
  --text:#d4ffb8; --text-2:rgba(212,255,184,0.7); --text-3:rgba(212,255,184,0.4);
  --bg-gradient: #1a1f16;
}
html[data-theme="classic"] {
  --accent:#000080; --accent-2:#1084d0; --accent-rgb:0,0,128;
  --text:#000; --text-2:#333; --text-3:#666;
  --bg-gradient: #008080;
  --font-head:'VT323',monospace; --font-body:'VT323',monospace;
}
html[data-theme="watermelon"] {
  --accent:#2b9348; --accent-2:#1b5e20; --accent-rgb:43,147,72;
  --text:#000; --text-2:rgba(0,0,0,0.7); --text-3:rgba(0,0,0,0.5);
  --bg-gradient: linear-gradient(135deg,#ffb3c1,#ff4d6d);
}

/* ФОНОВЫЙ СЛОЙ */
.bg-layer {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: var(--bg-gradient);
  background-attachment: fixed;
}
html[data-theme="sunset"] .bg-layer::after {
  content: ''; position: absolute; inset: 0;
  background-image: linear-gradient(0deg, transparent 24%, rgba(255,255,255,0.1) 25%, rgba(255,255,255,0.1) 26%, transparent 27%, transparent 74%, rgba(255,255,255,0.1) 75%, rgba(255,255,255,0.1) 76%, transparent 77%, transparent), linear-gradient(90deg, transparent 24%, rgba(255,255,255,0.1) 25%, rgba(255,255,255,0.1) 26%, transparent 27%, transparent 74%, rgba(255,255,255,0.1) 75%, rgba(255,255,255,0.1) 76%, transparent 77%, transparent);
  background-size: 40px 40px;
  transform: perspective(500px) rotateX(60deg) scale(3);
  transform-origin: bottom center; animation: moveGrid 10s linear infinite; opacity: 0.7;
}
@keyframes moveGrid { from { background-position: 0 0; } to { background-position: 0 40px; } }

html[data-theme="oldschool"] .bg-layer::after {
  content: ''; position: absolute; inset: 0;
  background-image: repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(255,255,255,0.03) 40px, rgba(255,255,255,0.03) 80px), repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(255,255,255,0.03) 40px, rgba(255,255,255,0.03) 80px), repeating-linear-gradient(90deg, transparent, transparent 10px, rgba(0,0,0,0.2) 10px, rgba(0,0,0,0.2) 20px), repeating-linear-gradient(0deg, transparent, transparent 10px, rgba(0,0,0,0.2) 10px, rgba(0,0,0,0.2) 20px);
}

.main-bg-wallpaper { position: fixed; inset: 0; z-index: 0; background: var(--main-wallpaper) center/cover no-repeat; opacity: 0.4; pointer-events: none; display: none; }
.main-bg-wallpaper.active { display: block; }

/* ========== БЕЙДЖИ ========== */
.badge {
  display: inline-block; font-size: 9px; font-weight: 800; font-family: var(--font-head);
  padding: 2px 6px; border-radius: 6px; margin-left: 6px; vertical-align: middle;
  background: linear-gradient(180deg, #ffe066 0%, #f5a623 100%); color: #4a2500;
  box-shadow: 0 3px 6px rgba(245,166,35,0.4), inset 0 1px 1px rgba(255,255,255,0.8), inset 0 -1px 1px rgba(0,0,0,0.2);
  border: 1px solid #ffd700; text-shadow: 0 1px 0 rgba(255,255,255,0.4); line-height: 1.2;
}

/* ========== БАЗА И LAYOUT ========== */
body{font-family:var(--font-body);font-size:14px;color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.avatar-wrap,.mav-wrap,.ch-avatar-wrap,.pp-avatar-wrap,.pa-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center}
.mav-wrap{flex-shrink:0}

#app{width:100%;height:100%;display:flex;position:relative;overflow:hidden;z-index:2;max-width:none;padding: 10px; gap: 10px;}
.main{flex:1;min-width:0;display:flex;flex-direction:row;position:relative;overflow:hidden; gap: 10px;}
#leftPane{width:340px;min-width:240px;max-width:60vw;flex-shrink:0;display:flex;flex-direction:column;overflow:hidden;border-radius: 24px;position:relative}
#rightPane{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;position:relative;border-radius: 24px; background: transparent;}
#resizer{width:6px;flex-shrink:0;cursor:col-resize;position:relative;z-index:100}
.right-placeholder{display:flex;flex:1;align-items:center;justify-content:center;color:var(--text-3);font-family:var(--font-head);font-size:14px;text-align:center;padding:20px;gap:8px;flex-direction:column; border-radius: 24px;}

.sidebar{width:var(--sidebar-w);flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:14px;border-radius: 26px;z-index:10}
.sidebar-logo{width:44px;height:44px;flex-shrink:0;position:relative;margin-bottom:4px;cursor:pointer; border-radius: 16px;}
.ws-dot{position:absolute;top:-2px;right:-2px;width:12px;height:12px;border-radius:50%;background:#666;transition:background .3s;border:2px solid #000;box-sizing:content-box;z-index:5}
.ws-dot.on{background:#00ff88;box-shadow:0 0 10px #00ff88}
.sb-btn{width:46px;height:46px;flex-shrink:0;border-radius:16px;color:var(--text-2);font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;position:relative;border:1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.1); transition: all .3s;}
.sb-btn.active{background:var(--accent);color:#fff;box-shadow:0 0 20px var(--accent), inset 0 1px 1px rgba(255,255,255,0.5);border-color:transparent}
.sb-btn .sb-badge{position:absolute;top:-4px;right:-4px;background:var(--accent);color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:9px;padding:0 4px;display:flex;align-items:center;justify-content:center;border:2px solid #1a0b2e;line-height:1;box-shadow: 0 2px 5px rgba(0,0,0,0.5);}

/* СКРЫТИЕ ПАНЕЛИ НА МОБИЛКАХ */
@media (max-width: 768px) {
  #app { padding: 0; gap: 0; }
  .main { gap: 0; }
  .sidebar { border-radius: 0; margin: 0; width: 56px; padding-top: max(14px, var(--safe-top)); background: transparent; border: none; box-shadow: none; backdrop-filter: none; }
  .sidebar::after { display: none; }
  #leftPane{width:100%;max-width:100%;border-radius: 0; border: none; box-shadow: none; backdrop-filter: none;}
  #leftPane::after { display: none; }
  #leftPane .profile-preview { margin: 10px; border-radius: 18px; }
  #resizer{display:none}
  #rightPane{display:none; border-radius: 0; margin: 0;}
  body.chat-open #rightPane, body.thread-open #rightPane, body.settings-open #rightPane { display:flex; position:absolute; inset:0; z-index:60; }
  body.chat-open #leftPane, body.thread-open #leftPane, body.settings-open #leftPane { display:none }
  body.chat-open .sidebar, body.thread-open .sidebar, body.settings-open .sidebar { display: none !important; }
  .chat-screen { border-radius: 0; border: none; }
}

/* ========== ЭЛЕМЕНТЫ ИНТЕРФЕЙСА ========== */
.profile-preview{flex-shrink:0;margin:10px 10px 0;padding:10px 14px;border-radius:20px;display:flex;align-items:center;gap:12px;cursor:pointer}
.pp-avatar{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;position:relative;box-shadow:0 5px 15px var(--accent-glow), inset 0 2px 2px rgba(255,255,255,0.4);overflow:hidden}
.pp-avatar img{width:100%;height:100%;object-fit:cover}
.pp-avatar.online::after{content:'';position:absolute;bottom:0;right:0;width:12px;height:12px;border-radius:50%;background:#00ff88;border:2px solid #1a0b2e;box-sizing:content-box;box-shadow:0 0 10px #00ff88}
.pp-info{flex:1;min-width:0}
.pp-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;line-height:1.2;font-family:var(--font-head)}
.pp-login{font-size:11px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--font-mono)}
.pp-edit{width:32px;height:32px;flex-shrink:0;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.1);color:var(--accent);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:10px;}

.view{display:none;flex:1;min-height:0;flex-direction:column;overflow:hidden}
.view.active{display:flex}
.view-header{flex-shrink:0;padding:14px 16px 8px;display:flex;align-items:center;gap:10px;}
.view-title{flex:1;min-width:0;font-size:13px;font-weight:700;font-family:var(--font-head);color:var(--accent);text-transform:uppercase;letter-spacing:1.5px;}
.folders-area{flex:1;overflow-y:auto;min-height:0;padding:10px 10px 80px;overscroll-behavior:contain}

.folder{border-radius:20px;margin-bottom:10px;overflow:hidden; transition: all 0.3s;}
.folder-header{display:flex;align-items:center;padding:12px 14px;cursor:pointer;gap:12px;}
.folder-chevron{width:12px;flex-shrink:0;font-size:12px;color:var(--accent);text-align:center;transition:transform .3s;font-weight:700}
.folder.open .folder-chevron{transform:rotate(90deg)}
.folder-icon{width:20px;flex-shrink:0;font-size:16px;text-align:center;}
.folder-name{flex:1;min-width:0;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--font-head); text-shadow: 0 2px 4px rgba(0,0,0,0.5);}
.folder-count{font-size:11px;color:var(--accent);flex-shrink:0;font-weight:800;font-family:var(--font-head);padding:2px 8px;background:rgba(255,255,255,0.1);border-radius:10px;border:1px solid rgba(255,255,255,0.1)}
.folder-body{display:none;padding:2px 8px 8px}
.folder.open .folder-body{display:block}

.chat-row{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;border-radius:16px;margin-top:6px;transition:all .2s;border:1px solid transparent;position:relative;}
.chat-row:active{transform:scale(0.97);background:rgba(255,255,255,0.1)}
.chat-row.unread-strong{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.15)}
.chat-row.active-chat{background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.3); box-shadow: 0 5px 15px rgba(0,0,0,0.2);}
.chat-avatar{width:44px;height:44px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;position:relative;box-shadow:0 5px 15px rgba(0,0,0,0.3), inset 0 1px 1px rgba(255,255,255,0.4);overflow:hidden}
.chat-avatar img{width:100%;height:100%;object-fit:cover}
.chat-info{flex:1;min-width:0}
.chat-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;line-height:1.2;font-family:var(--font-head); text-shadow: 0 1px 2px rgba(0,0,0,0.5);}
.chat-preview{font-size:12px;color:var(--text-2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.chat-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.chat-time{font-size:11px;color:var(--text-3);font-weight:600}
.chat-badge{background:var(--accent);color:#fff;font-size:10px;font-weight:800;padding:2px 7px;min-width:20px;text-align:center;border-radius:10px;font-family:var(--font-head);box-shadow:0 2px 5px rgba(0,0,0,0.3), inset 0 1px 1px rgba(255,255,255,0.4);}

.chat-screen{position:absolute;inset:0;z-index:50;display:none;flex-direction:column;border-radius:24px;overflow:hidden;}
.chat-screen.open{display:flex;animation:slideIn .3s cubic-bezier(0.2, 0.8, 0.2, 1)}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}
.chat-screen > *{position:relative;z-index:2}

.chat-header{flex-shrink:0;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;gap:12px;}
.back-btn{width:40px;height:40px;flex-shrink:0;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:14px;}
.ch-avatar{width:42px;height:42px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;cursor:pointer; box-shadow:0 5px 15px rgba(0,0,0,0.3), inset 0 1px 1px rgba(255,255,255,0.4);}
.ch-avatar img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.ch-name{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--font-head); text-shadow: 0 2px 4px rgba(0,0,0,0.5); display:flex; align-items:center;}
.ch-sub{font-size:11px;color:var(--text-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.messages{flex:1;overflow-y:auto;min-height:0;padding:20px 16px;display:flex;flex-direction:column;}
.msg{margin-bottom:12px;display:flex;gap:8px;align-items:flex-end;position:relative;max-width:100%;}
.msg.appear{animation:msgAppear .4s cubic-bezier(0.175, 0.885, 0.32, 1.275)}
@keyframes msgAppear{from{opacity:0;transform:translateY(20px) scale(0.9)}to{opacity:1;transform:translateY(0) scale(1)}}
.msg.out{flex-direction:row-reverse}
.mav{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-size:12px;font-weight:800;overflow:hidden;border-radius:12px;border:1px solid rgba(255,255,255,0.2); background:rgba(0,0,0,0.2); cursor:pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3)}
.mav img{width:100%;height:100%;object-fit:cover}
.bub{position:relative;padding:10px 16px;max-width:80%;cursor:pointer;word-wrap:break-word;border-radius:22px 22px 22px 6px; font-size:14px; line-height:1.4;}
.msg.out .bub{border-radius:22px 22px 6px 22px; background:linear-gradient(135deg, rgba(255,59,48,0.8), rgba(204,42,32,0.9)); border-top: 1px solid rgba(255,150,150,0.5); border-left: 1px solid rgba(255,150,150,0.3); border-bottom: 1px solid rgba(0,0,0,0.3); border-right: 1px solid rgba(0,0,0,0.1); box-shadow: 0 10px 20px rgba(204,42,32,0.3), inset 0 1px 1px rgba(255,255,255,0.3);}
.msg.in .bub { background: rgba(255,255,255,0.08); border-top: 1px solid rgba(255,255,255,0.3); border-left: 1px solid rgba(255,255,255,0.15); border-bottom: 1px solid rgba(0,0,0,0.2); border-right: 1px solid rgba(0,0,0,0.1); box-shadow: 0 10px 20px rgba(0,0,0,0.2), inset 0 1px 1px rgba(255,255,255,0.1); backdrop-filter: blur(10px); }
.hd{font-size:11px;color:var(--text-2);margin-bottom:4px;display:flex;gap:6px;align-items:center; font-family:var(--font-head)}
.hd .nm{font-weight:800;color:var(--accent); text-shadow: 0 1px 2px rgba(0,0,0,0.5); display:flex; align-items:center;}
.txt{word-break:break-word;white-space:pre-wrap;color:#fff; text-shadow: 0 1px 2px rgba(0,0,0,0.3);}
.txt.sticker{font-size:92px;line-height:1;padding:6px 10px;text-align:center;display:inline-block;white-space:normal}
.txt .kolobok{width:24px !important;height:24px !important;vertical-align:-5px;display:inline-block;margin:0 2px;image-rendering:pixelated;object-fit:contain}
.txt.sticker .kolobok{width:92px !important;height:92px !important;vertical-align:middle;margin:0;image-rendering:pixelated}

.chat-input-bar{flex-shrink:0;padding:12px 16px;padding-bottom:calc(12px + var(--safe-bottom));border-top:1px solid rgba(255,255,255,0.1);display:flex;gap:10px;align-items:stretch;}
.chat-input-bar .icn-btn{width:46px;height:46px;flex-shrink:0;background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:22px;cursor:pointer;border-radius:16px;display:flex;align-items:center;justify-content:center; box-shadow: inset 0 1px 2px rgba(0,0,0,0.2);}
.chat-input-bar input{flex:1;min-width:0;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.15);color:#fff;font-family:var(--font-body);font-size:16px;padding:12px 18px;outline:none;min-height:46px;border-radius:18px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);}
.chat-input-bar .send-btn{flex-shrink:0;background:linear-gradient(180deg, #ff5e54 0%, #cc2a20 100%);color:#fff;font-size:22px;padding:0 20px;cursor:pointer;min-height:46px;border:none;border-radius:18px;box-shadow:0 10px 20px rgba(255,59,48,0.3), inset 0 2px 2px rgba(255,255,255,0.3); border-top: 1px solid rgba(255,255,255,0.5);}

.chat-join-bar{display:none;padding:12px 16px;padding-bottom:calc(12px + var(--safe-bottom));border-top:1px solid rgba(255,255,255,0.1); z-index: 2;}
.join-btn{width:100%;background:linear-gradient(180deg, #ff5e54 0%, #cc2a20 100%);border:none;color:#fff;font-family:var(--font-head);font-weight:800;font-size:15px;padding:14px;cursor:pointer;border-radius:16px;box-shadow:0 10px 20px rgba(255,59,48,0.3), inset 0 2px 2px rgba(255,255,255,0.3); border-top: 1px solid rgba(255,255,255,0.5);}

/* МОДАЛКИ */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(10px);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal-box{width:100%;max-width:380px;border-radius:28px;display:flex;flex-direction:column;max-height:85vh;overflow:hidden; transform: scale(0.85) translateY(20px); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);}
.modal-overlay.open .modal-box { transform: scale(1) translateY(0); }
.modal-header{padding:18px 20px;border-bottom:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:space-between;}
.modal-header h3{font-size:16px;font-weight:800;font-family:var(--font-head);color:#fff; text-shadow: 0 2px 4px rgba(0,0,0,0.5);}
.modal-close{width:34px;height:34px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.1);color:#fff;font-size:16px;cursor:pointer;border-radius:12px; display: flex; align-items: center; justify-content: center;}
.modal-body{padding:20px;overflow-y:auto;flex:1;}
.modal-body label{display:block;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--text-3);margin-bottom:6px;font-family:var(--font-head);margin-top:14px}
.modal-body input, .modal-body textarea, .modal-body select{width:100%;background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.15);color:#fff;padding:12px 14px;border-radius:12px; margin-bottom:10px; outline: none; font-family: var(--font-body); box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);}
.modal-actions{display:flex;gap:10px;padding:16px 20px;border-top:1px solid rgba(255,255,255,0.1);}
.modal-actions button{flex:1;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.1);color:#fff;font-family:var(--font-head);font-size:13px;font-weight:800;padding:12px;cursor:pointer;border-radius:14px; transition: 0.2s;}
.modal-actions button.primary{background:var(--accent);border-color:transparent;box-shadow:0 5px 15px var(--accent-glow), inset 0 1px 1px rgba(255,255,255,0.4);}

/* КРОППЕР */
#cropperModal .modal-box{max-width:90vw;max-height:90vh;padding:0}
#cropperModal .modal-body{display:flex;justify-content:center;align-items:center;background:#000;overflow:hidden;position:relative;height:60vh;padding:0}
#cropperCanvas{touch-action:none;max-width:100%;max-height:100%}
.cropper-controls { display: flex; justify-content: center; gap: 10px; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 14px; margin-top: 10px; }
.cropper-controls button { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; width: 44px; height: 44px; border-radius: 12px; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

.login-screen{position:fixed;inset:0;display:none;flex-direction:column;justify-content:center;align-items:center;padding:24px;z-index:600;background:var(--bg-gradient);overflow-y:auto}
.login-screen.active{display:flex}
.login-box{width:100%;max-width:360px;padding:30px 24px;border-radius:28px;}
.login-title{text-align:center;font-family:var(--font-head);font-size:24px;font-weight:800;color:#fff;letter-spacing:1px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); margin-bottom: 20px;}
.login-btn{width:100%;background:var(--accent);border:none;color:#fff;font-family:var(--font-head);font-weight:800;font-size:16px;padding:14px;cursor:pointer;border-radius:16px;box-shadow:0 5px 15px var(--accent-glow), inset 0 1px 1px rgba(255,255,255,0.4); margin-top: 10px;}

/* Прочее */
.ach-popup{position:fixed;top:-100px;left:50%;transform:translateX(-50%);opacity:0;visibility:hidden;z-index:700;background:var(--accent);color:#fff;padding:14px 24px;border-radius:20px;display:flex;align-items:center;gap:14px;box-shadow:0 15px 30px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.4);transition:all .5s cubic-bezier(0.175, 0.885, 0.32, 1.275);font-family:var(--font-head);border-top: 1px solid rgba(255,255,255,0.5);}
.ach-popup.show{top:max(20px, var(--safe-top));opacity:1;visibility:visible;}

</head>

<script>
const VERSION_STR = '5.65';
const WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;
const MAX_FILE_SIZE = 20 * 1024 * 1024;
const EDIT_WINDOW_MS = 48 * 60 * 60 * 1000;

// Инициализация Telegram WebApp
const tg = window.Telegram?.WebApp;
if (tg) {
    tg.ready();
    tg.expand();
    if (tg.setHeaderColor) {
        tg.setHeaderColor('#1a0b2e');
    }
}

const $ = id => document.getElementById(id);
const $$ = s => document.querySelectorAll(s);
const $on = (sel, ev, fn) => $$(sel).forEach(el => el.addEventListener(ev, fn));
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
const fmtSize = b => !b && b !== 0 ? '' : b < 1024 ? b + ' Б' : b < 1048576 ? (b/1024).toFixed(1) + ' КБ' : (b/1048576).toFixed(2) + ' МБ';
const fTime = iso => { try { return new Date(iso).toTimeString().slice(0,5); } catch { return ''; } };
const fDateTime = iso => { try { return new Date(iso).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); } catch { return ''; } };
const fDate = iso => { try { const d = new Date(iso), m = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря']; return `${d.getDate()} ${m[d.getMonth()]}`; } catch { return ''; } };
const shade = (hex, pct) => { try { const n = parseInt(hex.replace('#',''),16), r = Math.max(0,Math.min(255,(n>>16)+pct)), g = Math.max(0,Math.min(255,((n>>8)&0xff)+pct)), b = Math.max(0,Math.min(255,(n&0xff)+pct)); return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0'); } catch { return hex; } };
const hexRgb = hex => { try { const n = parseInt(hex.replace('#',''),16); return [(n>>16)&255,(n>>8)&255,n&255].join(','); } catch { return '255,59,48'; } };
const getPalette = () => ['#ff3b30', '#ff2d92', '#3b82f6', '#22c55e', '#d0d0d0'];
const getAvatarUrl = id => id ? `/api/file/${encodeURIComponent(id)}?token=${encodeURIComponent(token||'')}` : '';
const firstChar = s => { try { return Array.from(String(s||'?'))[0] || '?'; } catch { return '?'; } };
const avatarInner = u => { if (!u) return '<span>?</span>'; if (u.avatarFileId) return `<img src="${esc(getAvatarUrl(u.avatarFileId))}" alt="">`; return esc(firstChar(u.nickname || u.login).toUpperCase()); };
const timeAgo = iso => { try { const d = (Date.now()-new Date(iso).getTime())/1000; if (d<60) return 'только что'; if (d<3600) return `${Math.floor(d/60)} мин назад`; if (d<86400) return `${Math.floor(d/3600)} ч назад`; return `${Math.floor(d/86400)} дн назад`; } catch { return ''; } };

const ALLOWED_FRAMES = new Set(['none','devil','star','sparkle','vine','flower']);
const frameSafe = f => ALLOWED_FRAMES.has(f) ? f : 'none';
const KOLOBKI_LIST = ['yes','yes2','yes3','yes4','victory','yahoo','yu','umnik','umnik2','to_clue','whistle','whistle2','whistle3','wink3','tongue','sarcasm','facepalm','sorry2','cray2','to_take_umbrage'];
const KOLOBKI_SET = new Set(KOLOBKI_LIST);

let cropState = { img: null, type: null, scale: 1, rotation: 0, x: 0, y: 0, canvas: null, ctx: null };
function openCropper(file, type) {
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      cropState.img = img; cropState.type = type;
      cropState.scale = 1; cropState.rotation = 0; cropState.x = 0; cropState.y = 0;
      const canvas = $('cropperCanvas'); const ctx = canvas.getContext('2d');
      const ratio = (type === 'avatar' || type === 'group_avatar') ? 1 : 9/16;
      canvas.width = 400; canvas.height = Math.round(400 / ratio);
      const scaleX = canvas.width / img.width, scaleY = canvas.height / img.height;
      cropState.scale = Math.max(scaleX, scaleY);
      cropState.x = (canvas.width - img.width * cropState.scale) / 2;
      cropState.y = (canvas.height - img.height * cropState.scale) / 2;
      cropState.canvas = canvas; cropState.ctx = ctx;
      drawCropper();
      $('cropperModal').classList.add('open');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function drawCropper() {
  const { ctx, canvas, img, scale, rotation, x, y } = cropState;
  if (!ctx || !img) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.translate(canvas.width / 2, canvas.height / 2);
  ctx.rotate(rotation * Math.PI / 180);
  ctx.translate(-canvas.width / 2, -canvas.height / 2);
  ctx.drawImage(img, x, y, img.width * scale, img.height * scale);
  ctx.restore();
}
function rotateCrop() { cropState.rotation = (cropState.rotation + 90) % 360; drawCropper(); }
window.rotateCrop = rotateCrop;
function zoomCrop(factor) { cropState.scale *= factor; drawCropper(); }
window.zoomCrop = zoomCrop;
(function initCropperEvents() {
  const canvas = $('cropperCanvas'); if (!canvas) return;
  let isDragging = false, startX, startY, startCropX, startCropY;
  canvas.addEventListener('mousedown', e => { isDragging = true; startX = e.clientX; startY = e.clientY; startCropX = cropState.x; startCropY = cropState.y; });
  window.addEventListener('mousemove', e => { if (!isDragging) return; cropState.x = startCropX + (e.clientX - startX); cropState.y = startCropY + (e.clientY - startY); drawCropper(); });
  window.addEventListener('mouseup', () => isDragging = false);
  canvas.addEventListener('touchstart', e => { if (e.touches.length === 1) { isDragging = true; startX = e.touches[0].clientX; startY = e.touches[0].clientY; startCropX = cropState.x; startCropY = cropState.y; } }, { passive: true });
  window.addEventListener('touchmove', e => { if (!isDragging || e.touches.length !== 1) return; e.preventDefault(); cropState.x = startCropX + (e.touches[0].clientX - startX); cropState.y = startCropY + (e.touches[0].clientY - startY); drawCropper(); }, { passive: false });
  window.addEventListener('touchend', () => isDragging = false);
})();

// === WS ===
function connectWS() {
  if (!token || !navigator.onLine) return;
  if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;
  try { if (ws) ws.close(); } catch {}
  wsState = 'connecting'; updateWsDot();
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    ws.send(JSON.stringify({ type:'auth', payload:{ token } }));
    lastPongAt = Date.now(); wsState = 'online'; updateWsDot();
    startHeartbeat(); flushQueue(); wsReconnectAttempts = 0;
    if (currentChatId) sendWS({ type:'activeChat', payload:{ chatId: currentChatId } });
  };
  ws.onmessage = e => {
    try {
      const d = JSON.parse(e.data);
      if (d.type === 'pong') { lastPongAt = Date.now(); if (wsPingSentAt) { lastPingMs = Math.round(performance.now() - wsPingSentAt); wsPingSentAt = 0; } return; }
      if (d.type === 'ping') { try { ws.send(JSON.stringify({ type:'pong' })); } catch {} return; }
      handleWS(d);
    } catch {}
  };
  ws.onclose = () => { ws = null; stopHeartbeat(); wsState = 'offline'; updateWsDot(); if (token) { wsReconnectCount++; wsReconnectAttempts++; const delay = Math.min(2000 * Math.pow(1.5, wsReconnectAttempts), 30000); if (reconnectTimer) clearTimeout(reconnectTimer); reconnectTimer = setTimeout(connectWS, delay); } };
  ws.onerror = () => {};
}
function startHeartbeat() { stopHeartbeat(); pingInt = setInterval(() => { if (ws?.readyState === 1) { try { wsPingSentAt = performance.now(); ws.send(JSON.stringify({ type:'ping' })); } catch {} } }, 5000); wdInt = setInterval(() => { if (ws?.readyState === 1 && Date.now() - lastPongAt > 35000) { try { ws.close(); } catch {} } }, 6000); }
function stopHeartbeat() { if (pingInt) clearInterval(pingInt), pingInt = null; if (wdInt) clearInterval(wdInt), wdInt = null; }
function flushQueue() { if (!sendQueue.length || !ws || ws.readyState !== 1) return; const q = [...sendQueue]; sendQueue = []; q.forEach(p => { try { ws.send(JSON.stringify({ type:'newMessage', payload:p })); } catch { sendQueue.push(p); } }); }
function sendWS(o) { if (ws && ws.readyState === 1) try { ws.send(JSON.stringify(o)); return true; } catch {} return false; }
window.sendWS = sendWS;
function updateWsDot() { const d = $('wsDot'); if (d) d.classList.toggle('on', wsState === 'online'); }

async function handleWS(data) {
  const { type, payload } = data;
  if (type === 'newMessage') {
    if (!messages[payload.chatId]) messages[payload.chatId] = [];
    if (messages[payload.chatId].some(m => m.id === payload.id || (payload.clientId && m.clientId === payload.clientId))) {
      const i = messages[payload.chatId].findIndex(m => m.clientId && m.clientId === payload.clientId);
      if (i !== -1) messages[payload.chatId][i] = payload;
      if (currentChatId === payload.chatId) renderMessages(); return;
    }
    messages[payload.chatId].push(payload);
    if (currentChatId === payload.chatId) { renderMessages(); sendWS({ type:'delivered', payload:{ messageId: payload.id } }); }
    loadChats();
  }
  else if (type === 'messageAck') { if (payload.clientId && messages[currentChatId]) { const i = messages[currentChatId].findIndex(m => m.clientId === payload.clientId); if (i !== -1) { messages[currentChatId][i].pending = false; messages[currentChatId][i].id = payload.id; renderMessages(); } } }
  else if (type === 'messageEdited') { if (messages[payload.chatId]) { const i = messages[payload.chatId].findIndex(m => m.id === payload.messageId); if (i !== -1) { messages[payload.chatId][i].text = payload.text; messages[payload.chatId][i].file = payload.file; messages[payload.chatId][i].editedAt = payload.editedAt; if (currentChatId === payload.chatId) renderMessages(); } } loadChats(); }
  else if (type === 'messageReaction') { if (messages[payload.chatId]) { const i = messages[payload.chatId].findIndex(m => m.id === payload.id); if (i !== -1) { messages[payload.chatId][i].reactions = payload.reactions; if (currentChatId === payload.chatId) renderMessages(); } } }
  else if (type === 'messagesRead') { const arr = messages[payload.chatId]; if (arr) { payload.messageIds.forEach(id => { const m = arr.find(x => x.id === id); if (m) { const rb = m.readBy || []; if (!rb.includes(payload.byLogin)) m.readBy = [...rb, payload.byLogin]; } }); if (currentChatId === payload.chatId) renderMessages(); } }
  else if (type === 'deleteMessage') { if (messages[payload.chatId]) { const i = messages[payload.chatId].findIndex(m => m.id === payload.messageId); if (i !== -1) messages[payload.chatId][i].deleted = 1; if (currentChatId === payload.chatId) renderMessages(); } loadChats(); }
  else if (type === 'chatDeleted') { chats = chats.filter(c => c.id !== payload.chatId); delete messages[payload.chatId]; if (currentChatId === payload.chatId) closeChat(); renderFolders(); }
  else if (type === 'status') { onlineStatus[payload.login] = payload.status === 'online'; renderFolders(); if (currentChatMeta && !currentChatMeta.isGroup) updateChatHeader(currentChatMeta); }
  else if (type === 'userUpdated') { if (currentChatMeta?.otherLogin === payload.login) { currentChatMeta.otherUser = payload; updateChatHeader(currentChatMeta); } renderFolders(); }
  else if (['chatCreated','chatRenamed','memberAdded','memberRemoved','adminChanged'].includes(type)) loadChats();
}

function renderMessages() {

    if (d !== lastDate) { html += `<div style="text-align:center;margin:16px 0;"><span style="background:rgba(0,0,0,0.3);padding:4px 12px;border-radius:10px;font-size:11px;color:#aaa;">${esc(d.toUpperCase())}</span></div>`; lastDate = d; }

    let body = '';
    if (m.type === 'file' && m.file) body += `<div style="margin-bottom:4px;">📎 ${esc(m.file.name)}</div>`;

  if (tg && tg.initData) {
      try {
          const res = await fetch('/api/auth/telegram', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ initData: tg.initData }) });
          const d = await res.json();
          if (d.token) { token = d.token; currentUser = d; localStorage.setItem('krista_token', token); localStorage.setItem('krista_user', JSON.stringify(currentUser)); }
      } catch(e) { console.warn("TG auth failed", e); }
  }

  if (token && currentUser) {
    try {
      $('app').style.display = 'flex';
      const me = await api('/api/me'); currentUser = me; localStorage.setItem('krista_user', JSON.stringify(me));
      profile = { emoji: me.nicknameEmoji || '', name: me.nickname, login: me.login };
      if (me.accentColor) { ui.accent = me.accentColor; applyUI(); }
      if (me.theme) applyTheme(me.theme);
      $('ppName').innerHTML = esc(profile.name) + (me.badges||[]).map(b => `<span class="badge" style="background:${b.color};color:#000;margin-left:4px;">${esc(b.text)}</span>`).join('');
      $('ppLogin').textContent = '@' + profile.login;
      $('ppAvatar').innerHTML = me.avatarFileId ? `<img src="${getAvatarUrl(me.avatarFileId)}">` : esc(firstChar(profile.name).toUpperCase());
      await loadFolders(); connectWS(); await loadChats();
    } catch (e) { if (e.status === 401) logout(); else $('app').style.display = 'flex'; }
  } else {
    $('loginScreen').classList.add('active');
  }
})();
</script>
