<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1a1020" />
<title>Криста.Мессенджер</title>
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* ============ ТЕМЫ ============ */
/* ROSE — тёмная роза */
:root{
  --bg-1:#1a1020;--bg-2:#2a1a30;
  --glass:rgba(255,180,210,.08);--glass-2:rgba(255,180,210,.12);--glass-3:rgba(255,180,210,.18);
  --glass-border:rgba(255,220,235,.14);
  --text:#f5e8f0;--text2:rgba(245,232,240,.72);--text3:rgba(245,232,240,.42);
  --accent:#f0a0c8;--accent-2:#d67aa8;--on-accent:#2a1020;
  --ok:#8ee0a8;--warn:#ffd06a;--danger:#ff8aa0;
  --font-head:'Comfortaa',sans-serif;
  --font-body:'Inter',sans-serif;
}
/* LAVENDER */
.t-lavender{
  --bg-1:#0f0a1e;--bg-2:#1e1636;
  --glass:rgba(200,170,255,.08);--glass-2:rgba(200,170,255,.12);--glass-3:rgba(200,170,255,.18);
  --glass-border:rgba(220,200,255,.14);
  --text:#ede6f7;--text2:rgba(237,230,247,.72);--text3:rgba(237,230,247,.42);
  --accent:#c9a8ff;--accent-2:#a888e0;--on-accent:#150e26;
}
/* SAKURA */
.t-sakura{
  --bg-1:#ffeef5;--bg-2:#fbd8e6;
  --glass:rgba(255,255,255,.55);--glass-2:rgba(255,255,255,.68);--glass-3:rgba(255,255,255,.8);
  --glass-border:rgba(200,140,175,.22);
  --text:#3a1a2c;--text2:rgba(58,26,44,.72);--text3:rgba(58,26,44,.42);
  --accent:#d64a8a;--accent-2:#b03a70;--on-accent:#fff;
}
/* CREAM */
.t-cream{
  --bg-1:#fff6ec;--bg-2:#fce4c8;
  --glass:rgba(255,255,255,.55);--glass-2:rgba(255,255,255,.68);--glass-3:rgba(255,255,255,.8);
  --glass-border:rgba(200,150,110,.22);
  --text:#3a2410;--text2:rgba(58,36,16,.72);--text3:rgba(58,36,16,.42);
  --accent:#e07840;--accent-2:#c05828;--on-accent:#fff;
}

html,body{height:100%;overflow:hidden;position:fixed;inset:0;width:100%;font-family:var(--font-body);font-size:14px;color:var(--text);user-select:none;-webkit-user-select:none}
body{background:linear-gradient(135deg,var(--bg-1) 0%,var(--bg-2) 100%);transition:background .5s}

/* декоративные пятна на фоне */
body::before,body::after{content:'';position:fixed;border-radius:50%;pointer-events:none;z-index:0;opacity:.35}
body::before{width:70vw;height:70vw;background:radial-gradient(circle,var(--accent),transparent 70%);top:-25vw;left:-25vw;filter:blur(60px)}
body::after{width:60vw;height:60vw;background:radial-gradient(circle,var(--accent-2),transparent 70%);bottom:-20vw;right:-20vw;filter:blur(60px)}

#app{width:100%;max-width:440px;height:100%;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden;z-index:1}

/* ============ СТЕКЛО — базовый класс ============ */
.glass{background:var(--glass);backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);border:1px solid var(--glass-border)}
.glass-2{background:var(--glass-2);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--glass-border)}
.glass-3{background:var(--glass-3);backdrop-filter:blur(10px) saturate(1.15);-webkit-backdrop-filter:blur(10px) saturate(1.15);border:1px solid var(--glass-border)}

/* ============ ШАПКА ============ */
.hdr1{padding:12px 14px 10px;padding-top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;flex-shrink:0;background:var(--glass-2);backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);border-bottom:1px solid var(--glass-border);position:relative;z-index:3;border-radius:0 0 16px 16px}
.hdr1 svg{width:26px;height:26px;flex-shrink:0;cursor:pointer}
.hdr1 svg circle{fill:var(--accent)}
.hdr1 svg .c{fill:var(--bg-1)}
.hdr1-title{font-family:var(--font-head);font-size:18px;font-weight:700;color:var(--accent);letter-spacing:.5px;line-height:1;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr1-ver{font-size:10px;color:var(--text3);flex-shrink:0;font-weight:500}

/* Ярус 2 — как контакт */
.hdr2{margin:8px 10px 0;padding:10px 12px;display:flex;align-items:center;gap:10px;border-radius:16px;background:var(--glass-2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-border);flex-shrink:0;cursor:pointer;position:relative;z-index:2}
.hdr2:active{background:var(--glass-3)}
.hdr2 .av{width:38px;height:38px;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-size:16px;font-weight:700;overflow:hidden;border-radius:50%;border:1px solid var(--glass-border)}
.hdr2 .av .emoji{font-size:20px;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.hdr2 .ci{flex:1;min-width:0}
.hdr2 .cn{font-family:var(--font-head);font-size:15px;font-weight:600;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr2 .lg{font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;margin-top:1px}
.hdr2 .st{font-size:11px;margin-top:1px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr2 .st.st-online{color:var(--ok)}.hdr2 .st.st-away{color:var(--warn)}.hdr2 .st.st-dnd{color:var(--danger)}

/* Поиск */
.search{margin:8px 10px 0;display:flex;gap:6px;flex-shrink:0;position:relative;z-index:2}
.search input{flex:1;background:var(--glass-2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--glass-border);border-radius:14px;color:var(--text);font-family:var(--font-body);font-size:13px;padding:10px 14px;outline:none;min-width:0;transition:border-color .2s}
.search input::placeholder{color:var(--text3)}
.search input:focus{border-color:var(--accent)}
.search .add{background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none;color:var(--on-accent);font-family:var(--font-head);font-weight:700;font-size:20px;width:42px;border-radius:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;flex-shrink:0;transition:transform .15s}
.search .add:active{transform:scale(.92)}

/* ============ КОНТЕНТ ============ */
.content{flex:1;overflow-y:auto;min-height:0;position:relative;z-index:1;padding-top:8px}
.content::-webkit-scrollbar{width:4px}
.content::-webkit-scrollbar-thumb{background:var(--glass-border);border-radius:2px}
.screen{display:none;flex-direction:column;height:100%}
.screen.active{display:flex}

.section{margin:10px 10px 6px;padding:6px 14px;font-family:var(--font-head);font-size:12px;font-weight:700;color:var(--accent);letter-spacing:1.2px;display:flex;align-items:center;gap:6px;border-radius:10px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.section .cnt{margin-left:auto;font-size:11px;color:var(--text3);font-weight:500;letter-spacing:0}

/* Контакт */
.contact{margin:0 10px 6px;padding:10px 12px;display:flex;align-items:center;gap:10px;cursor:pointer;border-radius:16px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--glass-border);transition:background .15s,transform .1s}
.contact:active{background:var(--glass-2);transform:scale(.985)}
.av{width:40px;height:40px;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-size:16px;font-weight:700;overflow:hidden;border-radius:50%;border:1px solid var(--glass-border)}
.av .emoji{font-size:22px;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.av .dot{position:absolute;bottom:1px;right:1px;width:11px;height:11px;border-radius:50%;border:2px solid var(--bg-1);background:var(--text3);box-sizing:content-box}
.av .dot.on{background:var(--dot-c,var(--ok))}
.ci{flex:1;min-width:0}
.cn{font-family:var(--font-head);font-size:14px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:baseline}
.cn .lg{font-size:10px;font-weight:500;color:var(--text3);flex-shrink:0;font-family:var(--font-body)}
.cs{font-size:11px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:italic}
.cs.st-online{color:var(--ok)}.cs.st-away{color:var(--warn)}.cs.st-dnd{color:var(--danger)}
.cp{font-size:11px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.8}
.bdg{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);font-family:var(--font-head);font-size:11px;font-weight:700;padding:3px 8px;min-width:22px;text-align:center;border-radius:10px;flex-shrink:0}
.empty{color:var(--text3);text-align:center;padding:40px 20px;font-size:12px;line-height:1.6;font-style:italic}

/* Табы */
.tabs{margin:0 10px;padding:6px;padding-bottom:max(6px,env(safe-area-inset-bottom));display:flex;gap:4px;flex-shrink:0;border-radius:20px 20px 0 0;background:var(--glass-2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-bottom:none;position:relative;z-index:2}
.tabs button{flex:1;background:none;border:none;color:var(--text3);font-family:var(--font-body);font-size:10px;padding:8px 4px;cursor:pointer;border-radius:14px;line-height:1.3;transition:all .15s;font-weight:500}
.tabs button .i{font-size:18px;display:block;margin-bottom:2px;opacity:.7}
.tabs button.active{color:var(--accent);background:var(--glass-3);font-weight:600}
.tabs button.active .i{opacity:1}

/* ============ ЭКРАН ЧАТА ============ */
.chat-hdr{margin:0;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;flex-shrink:0;background:var(--glass-2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-border);border-radius:0 0 16px 16px;position:relative;z-index:3}
.chat-hdr .bk{background:var(--glass-2);border:1px solid var(--glass-border);color:var(--accent);font-size:18px;padding:6px 10px;border-radius:12px;cursor:pointer;flex-shrink:0;font-weight:600;line-height:1;font-family:var(--font-head)}
.chat-hdr .bk:active{background:var(--glass-3)}
.chat-hdr .av2{width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-size:16px;font-weight:700;position:relative;overflow:hidden;border-radius:50%;border:1px solid var(--glass-border)}
.chat-hdr .av2 .emoji{font-size:18px;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.chat-hdr .av2 .dot{position:absolute;bottom:0;right:0;width:10px;height:10px;border-radius:50%;border:2px solid var(--bg-1);background:var(--text3);box-sizing:content-box}
.chat-hdr .av2 .dot.on{background:var(--dot-c,var(--ok))}
.chat-hdr .ci2{flex:1;min-width:0;cursor:pointer}
.chat-hdr .cn2{font-family:var(--font-head);font-size:14px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-hdr .cs2{font-size:10px;color:var(--text3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:italic}
.chat-hdr .cs2.st-online{color:var(--ok)}.chat-hdr .cs2.st-away{color:var(--warn)}.chat-hdr .cs2.st-dnd{color:var(--danger)}
.chat-hdr .mn{background:var(--glass-2);border:1px solid var(--glass-border);color:var(--text2);font-size:18px;width:34px;height:34px;cursor:pointer;flex-shrink:0;border-radius:12px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center}
.chat-hdr .mn:active{background:var(--glass-3)}

.messages{flex:1;overflow-y:auto;padding:12px 10px;min-height:0}
.messages::-webkit-scrollbar{width:4px}
.messages::-webkit-scrollbar-thumb{background:var(--glass-border);border-radius:2px}

.dsep{text-align:center;font-family:var(--font-head);font-size:11px;font-weight:600;color:var(--text3);letter-spacing:1.2px;margin:14px 0 8px;padding:5px 12px;display:inline-block;border-radius:12px;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--glass-border)}
.dsep-wrap{text-align:center;margin:14px 0 8px}

.msg{margin-bottom:6px;display:flex;gap:6px;align-items:flex-end;animation:mi .25s ease}
.msg.out{flex-direction:row-reverse}
.msg.pending .bub{opacity:.6}
.msg.failed .bub{border-color:var(--danger)}
.msg.flash .bub{animation:fa 1.5s ease}
@keyframes mi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes fa{0%,50%{box-shadow:0 0 0 2px var(--accent)}100%{}}

.mav{width:26px;height:26px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-size:11px;font-weight:700;overflow:hidden;border-radius:50%;border:1px solid var(--glass-border);background:var(--glass-2);cursor:pointer}
.mav:active{transform:scale(.92)}
.mav .emoji{font-size:14px;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}

.bub{background:var(--glass-2);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--glass-border);padding:8px 12px;max-width:78%;cursor:pointer;border-radius:18px 18px 18px 4px;position:relative;word-wrap:break-word;overflow-wrap:break-word;transition:transform .1s}
.bub:active{transform:scale(.98)}
.msg.out .bub{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);border-radius:18px 18px 4px 18px;border-color:transparent}
.msg.out .bub .hd,.msg.out .bub .txt{color:var(--on-accent)}
.hd{font-size:10px;color:var(--text3);margin-bottom:3px;display:flex;gap:6px;align-items:baseline}
.hd .nm{font-weight:700;font-family:var(--font-head);font-size:12px;letter-spacing:.2px;cursor:pointer}
.hd .nm:active{opacity:.7}
.msg.out .hd .nm{color:var(--on-accent)}
.txt{font-size:13px;line-height:1.45;word-break:break-word;white-space:pre-wrap;color:var(--text)}
.txt .link{color:var(--accent);text-decoration:underline;cursor:pointer;word-break:break-all;font-weight:500}
.msg.out .txt .link{color:var(--on-accent)}
.txt .mention{color:var(--accent);font-weight:600;background:var(--glass-3);padding:1px 5px;border-radius:6px}
.edt{font-size:10px;color:var(--text3);font-style:italic;margin-left:4px}
.msg.out .edt{color:rgba(42,16,32,.5)}
.rq{background:var(--glass);border-left:2px solid var(--accent);padding:4px 8px;margin-bottom:5px;font-size:11px;color:var(--text2);display:flex;gap:6px;cursor:pointer;border-radius:8px}
.msg.out .rq{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.5);color:var(--on-accent)}
.rq .jm{color:var(--accent);font-size:10px;margin-left:auto;font-weight:600}
.msg.out .rq .jm{color:var(--on-accent);text-decoration:underline}
.rxs{margin-top:5px;display:flex;gap:4px;flex-wrap:wrap}
.rxs .rx{background:var(--glass-3);border:1px solid var(--glass-border);padding:2px 8px;font-size:12px;color:var(--text2);cursor:pointer;display:flex;gap:3px;border-radius:10px;transition:transform .1s}
.rxs .rx:active{transform:scale(.94)}
.rxs .rx.mine{border-color:var(--accent);color:var(--accent);background:var(--glass-3)}
.msg.out .rxs .rx{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.3);color:var(--on-accent)}
.msg.out .rxs .rx.mine{background:rgba(255,255,255,.3);border-color:var(--on-accent);color:var(--on-accent)}
.stt{font-size:10px;margin-left:4px;font-family:var(--font-head);font-weight:600;opacity:.7}
.msg.failed .stt{color:var(--danger);cursor:pointer;text-decoration:underline;opacity:1}

.typing{min-height:16px;padding:2px 14px 4px;font-size:11px;color:var(--accent);font-style:italic;flex-shrink:0;opacity:0;transition:opacity .2s;font-weight:500}
.typing.vis{opacity:1}
.typing .dots::after{content:'';animation:td 1.4s steps(4,end) infinite}
@keyframes td{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}

.ib{margin:0 10px 10px;padding:6px;display:flex;align-items:center;gap:6px;flex-shrink:0;border-radius:20px;background:var(--glass-2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-border)}
.ib .icn{background:var(--glass-2);border:1px solid var(--glass-border);color:var(--text2);font-size:16px;width:34px;height:34px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;border-radius:50%;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;transition:background .15s}
.ib .icn:active,.ib .icn.active{background:var(--glass-3);border-color:var(--accent)}
.ib input{flex:1;background:transparent;border:none;color:var(--text);font-family:var(--font-body);font-size:13px;padding:8px 4px;outline:none;min-width:0;caret-color:var(--accent)}
.ib input::placeholder{color:var(--text3)}
.ib .snd{background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none;color:var(--on-accent);font-family:var(--font-head);font-weight:700;font-size:13px;padding:0 14px;height:34px;cursor:pointer;letter-spacing:.5px;flex-shrink:0;border-radius:17px;transition:transform .1s}
.ib .snd:active{transform:scale(.94)}

.emoji-panel{display:none;margin:0 10px 6px;background:var(--glass-2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-border);padding:8px;flex-shrink:0;max-height:180px;overflow-y:auto;border-radius:16px}
.emoji-panel.active{display:block}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.emoji-grid button{background:var(--glass);border:1px solid transparent;font-size:18px;padding:6px 0;cursor:pointer;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;line-height:1;border-radius:10px;transition:background .15s}
.emoji-grid button:active{background:var(--glass-3);border-color:var(--accent)}

.join-bar{margin:0 10px 10px;padding:12px;display:flex;align-items:center;justify-content:center;gap:12px;flex-shrink:0;border-radius:16px;background:var(--glass-2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-border)}
.join-bar .info{font-size:12px;color:var(--text3);font-style:italic}
.join-bar button{background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none;color:var(--on-accent);font-family:var(--font-head);font-weight:700;font-size:13px;padding:9px 22px;cursor:pointer;letter-spacing:.5px;border-radius:14px;transition:transform .1s}
.join-bar button:active{transform:scale(.94)}

/* ============ МОДАЛКИ ============ */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);align-items:center;justify-content:center;z-index:100;padding:20px;animation:fade .25s ease}
.ov.active{display:flex}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mod{width:100%;max-width:380px;max-height:88vh;overflow-y:auto;padding:22px 18px 18px;border-radius:22px;background:var(--glass-3);backdrop-filter:blur(30px) saturate(1.4);-webkit-backdrop-filter:blur(30px) saturate(1.4);border:1px solid var(--glass-border);box-shadow:0 20px 60px rgba(0,0,0,.4);position:relative;animation:scale .25s ease}
@keyframes scale{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.mod h3{font-family:var(--font-head);font-size:16px;font-weight:700;color:var(--accent);letter-spacing:.5px;margin-bottom:16px;text-align:center;padding-bottom:10px;border-bottom:1px solid var(--glass-border)}
.mod input,.mod textarea{width:100%;background:var(--glass-2);border:1px solid var(--glass-border);color:var(--text);font-family:var(--font-body);font-size:13px;padding:10px 14px;outline:none;margin-bottom:8px;caret-color:var(--accent);resize:none;border-radius:14px;transition:border-color .15s}
.mod input::placeholder,.mod textarea::placeholder{color:var(--text3)}
.mod input:focus,.mod textarea:focus{border-color:var(--accent)}
.mod .err{color:var(--danger);font-size:12px;min-height:16px;margin-bottom:4px;text-align:center;font-weight:500}
.mod .ok{color:var(--ok);font-size:12px;min-height:16px;margin-bottom:4px;text-align:center;font-weight:500}
.row{display:flex;gap:8px;margin-top:12px}
.row button{flex:1;background:var(--glass-2);border:1px solid var(--glass-border);color:var(--text2);font-family:var(--font-head);font-weight:600;font-size:13px;padding:11px 10px;cursor:pointer;letter-spacing:.5px;border-radius:14px;transition:transform .1s,background .15s}
.row button:active{transform:scale(.96);background:var(--glass-3)}
.row button.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none;color:var(--on-accent);font-weight:700}
.row button.danger{border-color:var(--danger);color:var(--danger)}

.set-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--glass-border);font-size:13px;gap:8px;flex-wrap:wrap}
.set-row:last-child{border-bottom:none}
.set-row .lbl{color:var(--text2);font-weight:500}
.set-row .val{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.set-row .val input{width:120px;margin:0;font-size:12px;padding:6px 10px}
.set-row .val button{background:var(--glass-2);border:1px solid var(--glass-border);color:var(--text2);font-family:var(--font-head);font-weight:600;font-size:12px;padding:6px 14px;cursor:pointer;border-radius:10px}
.set-row .val button:active{background:var(--glass-3);border-color:var(--accent);color:var(--accent)}

.chk{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;font-size:13px;color:var(--text2)}
.chk input[type=checkbox],.chk input[type=radio]{appearance:none;width:20px;height:20px;border:1.5px solid var(--glass-border);background:var(--glass-2);cursor:pointer;position:relative;flex-shrink:0;border-radius:6px;transition:all .15s}
.chk input[type=radio]{border-radius:50%}
.chk input:checked{border-color:var(--accent);background:var(--accent)}
.chk input[type=checkbox]:checked::after{content:'';position:absolute;top:4px;left:7px;width:4px;height:9px;border:solid var(--on-accent);border-width:0 2px 2px 0;transform:rotate(45deg)}
.chk input[type=radio]:checked::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:8px;height:8px;border-radius:50%;background:var(--on-accent)}

.tg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;padding-top:4px}
.tw{aspect-ratio:1;border:1.5px solid var(--glass-border);cursor:pointer;position:relative;min-height:38px;border-radius:14px;transition:transform .15s;overflow:hidden}
.tw:active{transform:scale(.94)}
.tw.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.tw .lbl{position:absolute;bottom:4px;left:0;right:0;font-size:9px;text-align:center;font-family:var(--font-head);color:#fff;text-shadow:0 0 4px #000,1px 1px 0 #000;font-weight:700;letter-spacing:.3px}
.tw.t-rose{background:linear-gradient(135deg,#1a1020 50%,#f0a0c8 50%)}
.tw.t-lavender{background:linear-gradient(135deg,#0f0a1e 50%,#c9a8ff 50%)}
.tw.t-sakura{background:linear-gradient(135deg,#ffeef5 50%,#d64a8a 50%)}
.tw.t-cream{background:linear-gradient(135deg,#fff6ec 50%,#e07840 50%)}

.pal{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;width:100%;padding-top:4px}
.csw{aspect-ratio:1;border:1.5px solid var(--glass-border);cursor:pointer;position:relative;min-height:28px;border-radius:10px;transition:transform .15s}
.csw:active{transform:scale(.9)}
.csw.active{border-color:var(--text);box-shadow:0 0 0 2px var(--accent)}

.member{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:var(--glass-2);border:1px solid var(--glass-border);margin-bottom:6px;gap:8px;border-radius:14px}
.member .minfo{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.member .mav{width:32px;height:32px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-size:13px;font-weight:700;border-radius:50%;border:1px solid var(--glass-border);overflow:hidden;background:var(--glass-3)}
.member .mav .emoji{font-size:16px;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.member .mtxt{flex:1;min-width:0}
.member .mname{color:var(--text);font-size:13px;font-family:var(--font-head);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.member .mlogin{color:var(--text3);font-size:11px;font-weight:500}
.member .mtag{font-family:var(--font-head);font-size:9px;font-weight:700;color:var(--accent);background:var(--glass-3);border:1px solid var(--accent);padding:2px 6px;margin-left:6px;border-radius:6px;vertical-align:middle}
.member .kick{background:var(--glass-2);border:1px solid var(--danger);color:var(--danger);font-family:var(--font-head);font-weight:600;font-size:11px;padding:6px 10px;cursor:pointer;border-radius:10px}
.member .kick:active{background:var(--danger);color:#fff}

.acc{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:var(--glass-2);border:1px solid var(--glass-border);margin-bottom:6px;gap:8px;border-radius:14px}
.acc.active{border-color:var(--accent);background:var(--glass-3)}
.acc .ainfo{flex:1;min-width:0}
.acc .aname{color:var(--text);font-size:13px;font-family:var(--font-head);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc .alogin{color:var(--text3);font-size:11px}
.acc .atag{font-family:var(--font-head);font-size:10px;font-weight:700;color:var(--accent)}
.acc button{background:var(--glass-2);border:1px solid var(--glass-border);color:var(--text2);font-family:var(--font-head);font-weight:600;font-size:11px;padding:6px 12px;cursor:pointer;border-radius:10px}
.acc button.del{border-color:var(--danger);color:var(--danger)}

.cpyr{text-align:center;font-size:11px;color:var(--text3);padding:16px 0 4px;line-height:1.6;font-style:italic}

/* Контекстное меню */
.ctx{display:none;position:fixed;background:var(--glass-3);backdrop-filter:blur(30px) saturate(1.4);-webkit-backdrop-filter:blur(30px) saturate(1.4);border:1px solid var(--glass-border);z-index:200;min-width:180px;padding:6px;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.ctx.active{display:block;animation:scale .15s ease}
.ctx button{display:block;width:100%;background:none;border:none;text-align:left;padding:10px 14px;color:var(--text2);font-family:var(--font-body);font-size:13px;cursor:pointer;border-radius:10px;font-weight:500}
.ctx button:active{background:var(--glass-2);color:var(--accent)}
.ctx button.danger{color:var(--danger)}
.ctx button.danger:active{background:var(--danger);color:#fff}

.acts{display:none;position:fixed;z-index:210;background:var(--glass-3);backdrop-filter:blur(30px) saturate(1.4);-webkit-backdrop-filter:blur(30px) saturate(1.4);border:1px solid var(--glass-border);padding:8px;flex-direction:column;gap:8px;max-width:calc(100vw - 24px);border-radius:20px;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.acts.active{display:flex;animation:scale .18s ease}
.acts .rx-row,.acts .act-row{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.acts .rx-btn{background:var(--glass-2);border:1px solid var(--glass-border);font-size:20px;padding:7px 11px;cursor:pointer;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;line-height:1;border-radius:12px;transition:transform .12s,background .15s}
.acts .rx-btn:active{transform:scale(1.15);background:var(--glass-3)}
.acts .act-btn{background:var(--glass-2);border:1px solid var(--glass-border);color:var(--text2);font-family:var(--font-body);font-size:12px;padding:8px 12px;cursor:pointer;white-space:nowrap;border-radius:10px;font-weight:500}
.acts .act-btn:active{background:var(--glass-3);color:var(--accent)}
.acts .act-btn.danger{color:var(--danger);border-color:var(--danger)}
.acts .act-btn.danger:active{background:var(--danger);color:#fff}

/* Toasts */
.ts{position:fixed;top:14px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:500;pointer-events:none;padding:0 14px}
.ts .t{background:var(--glass-3);backdrop-filter:blur(30px) saturate(1.4);-webkit-backdrop-filter:blur(30px) saturate(1.4);border:1px solid var(--glass-border);padding:12px 16px;max-width:400px;width:100%;pointer-events:auto;cursor:pointer;display:flex;gap:12px;align-items:flex-start;border-radius:18px;animation:tin .3s ease;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.ts .t .ico{font-size:20px;flex-shrink:0}
.ts .t .bd{flex:1;min-width:0}
.ts .t .tt{font-size:13px;color:var(--accent);font-family:var(--font-head);font-weight:700;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ts .t .tx{font-size:12px;color:var(--text);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ts .t.closing{animation:tout .25s ease forwards}
@keyframes tin{from{opacity:0;transform:translateY(-16px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes tout{to{opacity:0;transform:translateY(-16px) scale(.95)}}

/* Авторизация */
.ls{display:none;flex-direction:column;justify-content:center;align-items:center;height:100%;padding:24px;position:relative;z-index:2}
.ls.active{display:flex}
.lb{width:100%;max-width:340px;padding:26px 22px 22px;border-radius:24px;background:var(--glass-3);backdrop-filter:blur(30px) saturate(1.4);-webkit-backdrop-filter:blur(30px) saturate(1.4);border:1px solid var(--glass-border);box-shadow:0 20px 60px rgba(0,0,0,.4)}
.lb svg{width:60px;height:60px;margin:0 auto 14px;display:block}
.lb svg circle{fill:var(--accent)}
.lb svg .c{fill:var(--bg-1)}
.lt{text-align:center;font-family:var(--font-head);font-size:22px;font-weight:700;color:var(--accent);letter-spacing:1px}
.lsub{text-align:center;font-size:11px;color:var(--text3);letter-spacing:.8px;margin-bottom:18px;margin-top:4px;font-weight:500}
.ltabs{display:flex;width:100%;padding:4px;margin-bottom:14px;background:var(--glass-2);border:1px solid var(--glass-border);border-radius:14px}
.ltabs button{flex:1;background:none;border:none;color:var(--text3);font-family:var(--font-head);font-weight:600;font-size:12px;padding:9px 4px;cursor:pointer;letter-spacing:.5px;border-radius:10px;transition:all .15s}
.ltabs button.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);font-weight:700}
.llabel{font-size:10px;color:var(--text3);font-family:var(--font-head);font-weight:700;letter-spacing:1.2px;margin-bottom:4px;display:block;padding-left:4px}
.lin{width:100%;background:var(--glass-2);border:1px solid var(--glass-border);color:var(--text);font-family:var(--font-body);font-size:14px;padding:11px 14px;outline:none;caret-color:var(--accent);margin-bottom:12px;border-radius:14px;transition:border-color .15s}
.lin::placeholder{color:var(--text3)}
.lin:focus{border-color:var(--accent)}
.lbtn{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none;color:var(--on-accent);font-family:var(--font-head);font-weight:700;font-size:15px;padding:13px;cursor:pointer;letter-spacing:1px;margin-top:6px;border-radius:16px;transition:transform .1s}
.lbtn:active{transform:scale(.97)}
.lbtn:disabled{opacity:.5}
.lerr{color:var(--danger);font-size:12px;min-height:16px;text-align:center;margin-bottom:6px;font-weight:500}
.lhint{text-align:center;font-size:12px;color:var(--text3);margin-top:14px;font-weight:500}
.lhint .lnk{color:var(--accent);cursor:pointer;font-weight:600}

.pp{display:flex;align-items:center;gap:14px;padding:14px;background:var(--glass-2);border:1px solid var(--glass-border);margin-bottom:14px;border-radius:16px}
.pp .pa{width:56px;height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-size:22px;font-weight:700;overflow:hidden;border-radius:50%;border:2px solid var(--accent)}
.pp .pa .emoji{font-size:32px;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.pp .pi{flex:1;min-width:0}
.pp .pn{font-family:var(--font-head);font-size:18px;font-weight:700;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp .ps{font-size:12px;font-style:italic;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp .pl{font-size:11px;color:var(--text3);margin-top:3px;font-weight:500}

/* Инфо-модалка */
.info-user{padding:22px 18px;text-align:center}
.info-user .iu-av{width:96px;height:96px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-size:36px;font-weight:700;border-radius:50%;border:2px solid var(--glass-border);overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.info-user .iu-av .emoji{font-size:52px;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.info-user .iu-name{font-family:var(--font-head);font-size:20px;font-weight:700;margin-bottom:4px}
.info-user .iu-login{font-size:12px;color:var(--text3);margin-bottom:8px;font-weight:500}
.info-user .iu-status{font-size:13px;font-style:italic;margin-bottom:20px}
.info-user .iu-actions{display:flex;gap:8px}
.info-user .iu-actions button{flex:1;padding:12px;border-radius:14px;font-family:var(--font-head);font-weight:600;font-size:13px;cursor:pointer;border:1px solid var(--glass-border);background:var(--glass-2);color:var(--text2);transition:transform .1s}
.info-user .iu-actions button:active{transform:scale(.96)}
.info-user .iu-actions button.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);border:none;font-weight:700}

.dr{display:flex;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--glass-border);font-size:12px}
.dr .l{color:var(--text3);font-weight:500}
.dr .v{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<div id="app">

<div class="ls" id="loadingScreen" style="display:none">

  </div>
</div>

<div class="ls" id="loginScreen">
  <div class="lb">
    <svg viewBox="0 0 100 100"><circle cx="50" cy="20" r="14" opacity=".9"/><circle cx="78" cy="38" r="14" opacity=".8"/><circle cx="78" cy="62" r="14" opacity=".9"/><circle cx="50" cy="80" r="14" opacity=".8"/><circle cx="22" cy="62" r="14" opacity=".9"/><circle cx="22" cy="38" r="14" opacity=".8"/><circle class="c" cx="50" cy="50" r="12"/><circle cx="50" cy="50" r="6"/></svg>
    <div class="lt">КРИСТА</div>
    <div class="lsub">.МЕССЕНДЖЕР v1.14</div>
    <div class="ltabs"><button class="active" id="tabLogin">ВХОД</button><button id="tabReg">РЕГИСТРАЦИЯ</button></div>
    <div class="lerr" id="authError"></div>

<div class="screen" id="screenMain">
  <div class="hdr1">
    <svg viewBox="0 0 100 100" id="logoBtn"><circle cx="50" cy="20" r="14" opacity=".9"/><circle cx="78" cy="38" r="14" opacity=".8"/><circle cx="78" cy="62" r="14" opacity=".9"/><circle cx="50" cy="80" r="14" opacity=".8"/><circle cx="22" cy="62" r="14" opacity=".9"/><circle cx="22" cy="38" r="14" opacity=".8"/><circle class="c" cx="50" cy="50" r="12"/><circle cx="50" cy="50" r="6"/></svg>
    <div class="hdr1-title">КРИСТА.МЕССЕНДЖЕР</div>

  </div>
  <div class="hdr2" id="myHeaderBlock">
    <div class="av" id="myHeaderAv"></div>

      <div class="cn"><span id="myHeaderName">Ник</span></div>

<div class="ov" id="createModal">
  <div class="mod">
    <h3>СОЗДАТЬ</h3>
    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:10px">
      <button onclick="openGroupCreate()" style="background:var(--glass-2);border:1px solid var(--glass-border);color:var(--text);font-family:var(--font-body);font-size:14px;padding:16px;cursor:pointer;text-align:left;border-radius:16px;font-weight:600">👥 ГРУППА<span style="display:block;font-size:11px;color:var(--text3);margin-top:4px;font-style:italic;font-weight:400">С логином группы</span></button>

<div class="ov" id="dialogModal">

<script>
const WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;
let token = localStorage.getItem('krista_token') || null;
let currentUser = JSON.parse(localStorage.getItem('krista_user') || 'null');
let ws = null, wsState = 'offline', lastPongAt = 0, pingInt = null, wdInt = null;
let chats = [], currentChatId = null, currentChatMeta = null;
let messages = {}, onlineStatus = {};
let replyToMsg = null, editingMsgId = null;
let groupDraft = [], groupKind = 'group';
let reconnectTimer = null, sendQueue = [];
let accounts = JSON.parse(localStorage.getItem('krista_accounts') || '[]');
let typingClearTimer = null, lastTypingSent = 0;
let currentTab = 'Chats';

const $ = id => document.getElementById(id);
const app = $('app');
const PALETTE = ['#f0a0c8','#c9a8ff','#a3c8ff','#d67aa8','#e07840','#8ee0a8','#ffd06a','#ff8aa0'];
const THEMES = [{id:'rose',name:'Роза'},{id:'lavender',name:'Лаванда'},{id:'sakura',name:'Сакура'},{id:'cream',name:'Крем'}];
const REACTIONS = ['❤️','🔥','👍','😂','😢','😡'];
const EMOJIS = ['👍','👎','🍑','🌐','☢️','☣️','😀','😁','😅','🥺','😂','🙂','🙃','🫠','😉','😊','🥰','😍','😘','😗','😋','😝','🫣','😶','😏','😒','🙄','😮‍💨','🫨','😪','🤤','😴','😷','🤒','🥵','🥶','🤯','🥳','🫪','😨','😭','😱','😖','😣','😓','😡','🤬','😈','👿','💩','👾','❤️‍🔥','🔥','❤️','💔','🤝','👀','🐱','🦊','🐺','🐶','✅','❎','🔇','🔕','🔉','📢','🎙️','🎤','🎧','🎸','🎹','📱','📲','📟','🔋','🪫','💽','💾','🖥️','💻','📸','⚠️','🚫','🏴','🏳️'];
const STATUS_OPTS = [{id:'online',label:'В сети',color:'#8ee0a8'},{id:'away',label:'Отошёл',color:'#ffd06a'},{id:'dnd',label:'Не беспокоить',color:'#ff8aa0'},{id:'custom',label:'Свой текст',color:'#a89ab0'}];

EMOJIS.forEach(e => { const b = document.createElement('button'); b.type='button'; b.textContent=e; b.onclick=()=>insertEmoji(e); $('emojiGrid').appendChild(b); });

async function api(url, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (token) headers.Authorization = 'Bearer ' + token;
  const res = await fetch(url, { ...opts, headers });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(data.error || 'Ошибка'); e.status = res.status; throw e; }
  return data;
}
async function apiRetry(url, opts = {}, n = 3) {
  let last;
  for (let i = 0; i < n; i++) {
    try { return await api(url, opts); }
    catch(e) { last = e; if (e.status === 401 || e.status === 403 || e.status === 404) throw e; await new Promise(r => setTimeout(r, 1500)); }
  }
  throw last;
}
function showScreen(name) {
  ['loadingScreen','loginScreen'].forEach(s => $(s).classList.remove('active'));
  $('screenChat').classList.remove('active');
  $('screenMain').classList.remove('active');
  if (name === 'loading') $('loadingScreen').classList.add('active');
  else if (name === 'login') $('loginScreen').classList.add('active');
  else if (name === 'main') $('screenMain').classList.add('active');
}
function applyTheme(id) {
  app.className = '';
  if (id && id !== 'rose') app.classList.add('t-' + id);
  document.querySelectorAll('.tw').forEach(s => s.classList.toggle('active', s.dataset.theme === id));
}
function refreshTheme() { applyTheme(currentUser?.theme || 'rose'); }
function statusLabel(st, text) { if (st === 'custom') return text || 'свой статус'; return {online:'в сети',away:'отошёл',dnd:'не беспокоить'}[st] || 'в сети'; }
function statusClass(st) { return 'st-' + (st || 'online'); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
function fTime(iso) { try { return new Date(iso).toTimeString().slice(0,5); } catch { return ''; } }
function fDate(iso) { try { const d = new Date(iso); const m = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря']; return `${d.getDate()} ${m[d.getMonth()]}`; } catch { return ''; } }
function shade(hex, pct) { try { const n = parseInt(hex.replace('#',''),16); const r = Math.max(0,Math.min(255,(n>>16)+pct)); const g = Math.max(0,Math.min(255,((n>>8)&0xff)+pct)); const b = Math.max(0,Math.min(255,(n&0xff)+pct)); return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0'); } catch { return hex; } }
function avatarBg(u) { const c = u?.avatarBgColor || 'var(--accent)'; return `linear-gradient(135deg,${c},${shade(c,-25)})`; }
function avatarInner(u) { if (!u) return '<span>?</span>'; const isE = u.avatarType === 'emoji' && u.avatarEmoji; if (isE) return `<span class="emoji">${esc(u.avatarEmoji)}</span>`; return `<span style="color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.2)">${esc((u.nickname||u.login||'?')[0].toUpperCase())}</span>`; }
function statusDot(u, isOn) { if (!isOn) return `<span class="dot"></span>`; return `<span class="dot on" style="--dot-c:${u?.statusColor||'#8ee0a8'}"></span>`; }

// АВТОРИЗАЦИЯ
let authMode = 'login';
function switchAuthTab(mode) {
  authMode = mode;
  const isLogin = mode === 'login';
  $('tabLogin').classList.toggle('active', isLogin);
  $('tabReg').classList.toggle('active', !isLogin);
  $('lblNick').style.display = isLogin ? 'none' : 'block';
  $('authNickname').style.display = isLogin ? 'none' : 'block';
  $('authConfirm').style.display = isLogin ? 'none' : 'block';
  $('authSubmitBtn').textContent = isLogin ? 'ВОЙТИ' : 'СОЗДАТЬ';
  $('authError').textContent = '';
}
$('tabLogin').onclick = () => switchAuthTab('login');
$('tabReg').onclick = () => switchAuthTab('reg');
$('authSubmitBtn').onclick = async () => {
  const err = $('authError'); err.textContent = '';
  const login = $('authLogin').value.trim();
  const pass = $('authPassword').value;
  try {
    $('authSubmitBtn').disabled = true;
    let data;
    if (authMode === 'login') {
      if (!login || !pass) return err.textContent = 'Заполни поля';
      data = await api('/api/login', { method:'POST', body: JSON.stringify({ login, password: pass }) });
    } else {
      const nick = $('authNickname').value.trim();
      const conf = $('authConfirm').value;
      if (!login || !nick || !pass) return err.textContent = 'Заполни все поля';
      if (pass !== conf) return err.textContent = 'Пароли не совпадают';
      data = await api('/api/register', { method:'POST', body: JSON.stringify({ login, nickname: nick, password: pass, confirmPassword: conf }) });
    }
    token = data.token;
    localStorage.setItem('krista_token', token);
    currentUser = { login: data.login, nickname: data.nickname };
    localStorage.setItem('krista_user', JSON.stringify(currentUser));
    saveAccount({ login: data.login, nickname: data.nickname, token });
    await afterLogin();
  } catch(e) { err.textContent = e.message; }
  finally { $('authSubmitBtn').disabled = false; }
};
$('authPassword').addEventListener('keydown', e => { if (e.key === 'Enter') $('authSubmitBtn').click(); });
$('authConfirm').addEventListener('keydown', e => { if (e.key === 'Enter') $('authSubmitBtn').click(); });
async function afterLogin() {
  try {
    const me = await apiRetry('/api/me');
    currentUser = me;
    localStorage.setItem('krista_user', JSON.stringify(me));
    applyUserToHeader();
    refreshTheme();
    showScreen('main');
    switchTab('Chats');
    connectWS();
    await loadChats();
  } catch(e) {
    if (e.status === 401 || e.status === 404) logout();
    else if (currentUser) { showScreen('main'); connectWS(); loadChats().catch(()=>{}); }
    else showScreen('login');
  }
}
function applyUserToHeader() {
  if (!currentUser) return;
  const u = currentUser;
  const avEl = $('myHeaderAv');
  avEl.style.background = avatarBg(u);
  avEl.innerHTML = avatarInner(u);
  $('myHeaderName').textContent = u.nickname || u.login;
  $('myHeaderName').style.color = u.nicknameColor || 'var(--accent)';
  $('myHeaderLogin').textContent = '@' + (u.login || '—');
  $('myHeaderStatus').textContent = statusLabel(u.status, u.statusText);
  $('myHeaderStatus').style.color = u.statusColor || 'var(--accent)';
}
$('myHeaderBlock').onclick = () => { if (currentUser) openInfoUser(currentUser.login); };

// WEBSOCKET
function connectWS() {
  if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;
  try { if (ws) ws.close(); } catch {}
  wsState = 'connecting';
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    ws.send(JSON.stringify({ type:'auth', payload:{ token } }));
    lastPongAt = Date.now();
    try { ws.send(JSON.stringify({ type:'ping' })); } catch {}
    wsState = 'online'; startHeartbeat(); flushQueue();
  };
  ws.onmessage = e => {
    try {
      const d = JSON.parse(e.data);
      if (d.type === 'pong') { lastPongAt = Date.now(); return; }
      if (d.type === 'ping') { try { ws.send(JSON.stringify({ type:'pong' })); } catch {} return; }
      handleWS(d);
    } catch {}
  };
  ws.onclose = () => {
    ws = null; stopHeartbeat(); wsState = 'offline';
    if (token) { if (reconnectTimer) clearTimeout(reconnectTimer); wsState = 'connecting'; reconnectTimer = setTimeout(connectWS, 2000); }
  };
  ws.onerror = () => {};
}
function startHeartbeat() {
  stopHeartbeat();
  pingInt = setInterval(() => { if (ws?.readyState === 1) try { ws.send(JSON.stringify({ type:'ping' })); } catch {} }, 10000);
  wdInt = setInterval(() => { if (ws?.readyState === 1 && Date.now() - lastPongAt > 25000) try { ws.close(); } catch {} }, 5000);
}
function stopHeartbeat() { if (pingInt) clearInterval(pingInt), pingInt = null; if (wdInt) clearInterval(wdInt), wdInt = null; }
function flushQueue() { if (!sendQueue.length || !ws || ws.readyState !== 1) return; const q = [...sendQueue]; sendQueue = []; q.forEach(p => { try { ws.send(JSON.stringify({ type:'newMessage', payload:p })); } catch { sendQueue.push(p); } }); }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && token) {
    if (!ws || ws.readyState !== 1) connectWS();
    else try { ws.send(JSON.stringify({ type:'ping' })); } catch {}
  }
});
window.addEventListener('online', () => { if (token && (!ws || ws.readyState !== 1)) connectWS(); });

function handleWS(data) {
  const { type, payload } = data;
  if (type === 'newMessage') {
    if (!messages[payload.chatId]) messages[payload.chatId] = [];
    if (messages[payload.chatId].some(m => m.id === payload.id || (payload.clientId && m.clientId === payload.clientId))) {
      const i = messages[payload.chatId].findIndex(m => m.clientId && m.clientId === payload.clientId);
      if (i !== -1) messages[payload.chatId][i] = payload;
      if (currentChatId === payload.chatId) renderMessages();
      return;
    }
    messages[payload.chatId].push(payload);
    if (currentChatId === payload.chatId) { renderMessages(); api(`/api/chats/${payload.chatId}/messages`).catch(()=>{}); }
    if (payload.sender !== currentUser.login) {
      const chat = chats.find(c => c.id === payload.chatId);
      showNotification(chat?.name || 'Чат', payload.senderName, payload.text, payload.chatId);
      beep();
    }
    loadChats();
  } else if (type === 'messageAck') {
    if (payload.clientId && messages[currentChatId]) {
      const i = messages[currentChatId].findIndex(m => m.clientId === payload.clientId);
      if (i !== -1) { messages[currentChatId][i].pending = false; messages[currentChatId][i].id = payload.id; renderMessages(); }
    }
  } else if (type === 'messageEdited') {
    if (messages[payload.chatId]) { const i = messages[payload.chatId].findIndex(m => m.id === payload.id); if (i !== -1) { messages[payload.chatId][i] = payload; if (currentChatId === payload.chatId) renderMessages(); } }
  } else if (type === 'messageReaction') {
    if (messages[payload.chatId]) { const i = messages[payload.chatId].findIndex(m => m.id === payload.id); if (i !== -1) { messages[payload.chatId][i].reactions = payload.reactions; if (currentChatId === payload.chatId) renderMessages(); } }
  } else if (type === 'deleteMessage') {
    if (messages[payload.chatId]) { const i = messages[payload.chatId].findIndex(m => m.id === payload.messageId); if (i !== -1) messages[payload.chatId][i].deleted = 1; if (currentChatId === payload.chatId) renderMessages(); }
    loadChats();
  } else if (type === 'chatDeleted') {
    chats = chats.filter(c => c.id !== payload.chatId);
    delete messages[payload.chatId];
    if (currentChatId === payload.chatId) { currentChatId = null; $('screenChat').classList.remove('active'); }
    renderChats();
  } else if (type === 'status') {
    onlineStatus[payload.login] = payload.status === 'online';
    renderChats(); if (currentChatMeta && !currentChatMeta.isGroup) updateChatHeader(currentChatMeta);
  } else if (type === 'userUpdated') {
    if (currentChatMeta?.otherLogin === payload.login) { currentChatMeta.otherUser = payload; updateChatHeader(currentChatMeta); }
    renderChats();
  } else if (type === 'typing') {
    if (payload.chatId === currentChatId) showTyping(`${payload.nickname} печатает`);
  } else if (['chatCreated','chatRenamed','memberAdded','memberRemoved'].includes(type)) {
    loadChats();
  } else if (type === 'error') {
    if (payload?.clientId) { const arr = messages[currentChatId]; if (arr) { const i = arr.findIndex(m => m.clientId === payload.clientId); if (i !== -1) { arr[i].pending = false; arr[i].failed = true; renderMessages(); } } }
    toast('Ошибка', payload?.error || payload || 'Неизвестно');
  }
}

async function loadChats() {
  try { chats = await apiRetry('/api/chats'); renderChats(); }
  catch(e) { if (e.status === 401) logout(); else $('chatListContainer').innerHTML = '<div class="empty">Ошибка загрузки</div>'; }
}
let searchQuery = '';
function renderChats() {
  const filtered = searchQuery
    ? chats.filter(c => c.name.toLowerCase().includes(searchQuery.toLowerCase()) || (c.login && c.login.toLowerCase().includes(searchQuery.toLowerCase())) || (c.otherLogin && c.otherLogin.toLowerCase().includes(searchQuery.toLowerCase())))
    : chats;
  if (!filtered.length) {
    $('chatListContainer').innerHTML = searchQuery ? '<div class="empty">Ничего не найдено</div>' : '<div class="empty">Нет чатов<br>Найди друга через поиск</div>';
    return;
  }
  const dialogs = filtered.filter(c => !c.isGroup);
  const groups = filtered.filter(c => c.isGroup);
  const onlines = dialogs.filter(c => c.online || onlineStatus[c.otherLogin]);
  const offlines = dialogs.filter(c => !(c.online || onlineStatus[c.otherLogin]));
  let html = '';
  if (onlines.length) html += `<div class="section">● ОНЛАЙН<span class="cnt">${onlines.length}</span></div>` + onlines.map(renderContact).join('');
  if (offlines.length) html += `<div class="section">○ ОФФЛАЙН<span class="cnt">${offlines.length}</span></div>` + offlines.map(renderContact).join('');
  if (groups.length) html += `<div class="section"># ГРУППЫ<span class="cnt">${groups.length}</span></div>` + groups.map(renderContact).join('');
  $('chatListContainer').innerHTML = html;
  $('chatListContainer').querySelectorAll('.contact').forEach(el => {
    const id = el.dataset.id;
    el.addEventListener('click', () => openChat(id));
    el.addEventListener('contextmenu', e => { e.preventDefault(); showChatCtx(e.clientX, e.clientY, id); });
    let t;
    el.addEventListener('touchstart', e => { t = setTimeout(() => { const p = e.touches[0]; showChatCtx(p.clientX, p.clientY, id); }, 600); });
    el.addEventListener('touchend', () => clearTimeout(t));
    el.addEventListener('touchmove', () => clearTimeout(t));
  });
}
function renderContact(c) {
  const isOn = c.isGroup ? false : (c.online || onlineStatus[c.otherLogin] || false);
  const u = c.isGroup ? null : c.otherUser;
  const initial = c.isGroup ? '#' : (u?.nickname || u?.login || '?')[0].toUpperCase();
  const isE = u?.avatarType === 'emoji' && u.avatarEmoji;
  const avInner = isE
    ? `<span class="emoji">${esc(u.avatarEmoji)}</span>`
    : `<span style="color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.2)">${esc(initial)}</span>`;
  const dot = c.isGroup ? '' : statusDot(u, isOn);
  const nameColor = u?.nicknameColor || 'var(--text)';
  const statusColor = u?.statusColor || 'var(--text3)';
  const statusText = c.isGroup ? c.subtitle : (u?.statusText || statusLabel(u?.status, ''));
  let preview = '';
  if (c.lastMessage) {
    const m = c.lastMessage;
    const t = m.text.length > 40 ? m.text.slice(0, 38) + '…' : m.text;
    preview = `<div class="cp">${esc(m.senderName)}: ${esc(t)}</div>`;
  }
  const badge = c.unreadCount > 0 ? `<div class="bdg">${c.unreadCount}</div>` : '';
  const loginLabel = c.isGroup ? (c.login ? '@' + c.login : '') : '@' + (c.otherLogin || '');
  const avBg = c.isGroup ? 'background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff' : 'background:' + avatarBg(u);
  return `<div class="contact" data-id="${c.id}">
    <div class="av" style="${avBg}">${avInner}${dot}</div>
    <div class="ci"><div class="cn" style="color:${nameColor}">${esc(c.name)} <span class="lg">${esc(loginLabel)}</span></div><div class="cs ${statusClass(u?.status)}" style="color:${statusColor}">${esc(statusText)}</div>${preview}</div>
    ${badge}</div>`;
}

async function openChat(chatId) {
  currentChatId = chatId;
  const chat = chats.find(c => c.id === chatId);
  if (!chat) { toast('Инфо', 'Чат не найден'); return; }

function renderMessages() {
  const arr = messages[currentChatId] || [];
  if (!arr.length) { $('messagesArea').innerHTML = '<div class="empty">Нет сообщений</div>'; return; }
  let html = '', lastDate = null;
  for (const m of arr) {
    if (m.deleted) continue;
    const d = fDate(m.timestamp);
    if (d !== lastDate) { html += `<div class="dsep-wrap"><span class="dsep">${esc(d.toUpperCase())}</span></div>`; lastDate = d; }
    html += renderMsg(m, arr);
  }
  $('messagesArea').innerHTML = html;
  $('messagesArea').scrollTop = $('messagesArea').scrollHeight;
  bindMsgEvents(arr);
}
function renderMsg(m, arr) {
  const isOut = m.sender === currentUser.login;
  let replyHtml = '';
  if (m.replyTo) {
    const p = arr.find(x => x.id === m.replyTo);
    if (p && !p.deleted) {
      const short = p.text.length > 22 ? p.text.slice(0, 20) + '…' : p.text;
      replyHtml = `<div class="rq" data-jump="${p.id}">↪ ${esc(p.senderName)}: ${esc(short)} <span class="jm">→</span></div>`;
    } else replyHtml = `<div class="rq">↪ [удалено]</div>`;
  }
  let txt = esc(m.text);
  txt = txt.replace(/(https?:\/\/[^\s]+|www\.[^\s]+)/gi, match => { const url = match.startsWith('www.') ? 'http://' + match : match; return `<span class="link" data-url="${esc(url)}">${esc(match)}</span>`; });
  txt = txt.replace(/@([a-zA-Z0-9_-]{3,32})/g, (_, name) => `<span class="mention">@${esc(name)}</span>`);
  const edited = m.editedAt ? `<span class="edt">(изм.)</span>` : '';
  let state = '';
  if (m.pending) state = '<span class="stt">⏳</span>';
  else if (m.failed) state = `<span class="stt" data-retry="${m.clientId}">ошибка ↻</span>`;
  let rxs = '';
  const rlist = m.reactions || [];
  if (rlist.length) rxs = '<div class="rxs">' + rlist.map(r => { const mine = r.logins.includes(currentUser.login); return `<span class="rx ${mine?'mine':''}" data-react="${esc(r.emoji)}" data-msg="${m.id}">${r.emoji} ${r.logins.length}</span>`; }).join('') + '</div>';
  const msgId = m.id || m.clientId;
  const senderColor = isOut ? 'var(--on-accent)' : 'var(--accent)';
  const avInner = isOut ? avatarInner(currentUser) : `<span>${esc((m.senderName || '?')[0].toUpperCase())}</span>`;
  const avStyle = isOut ? `background:${avatarBg(currentUser)}` : '';
  return `<div class="msg ${isOut?'out':''} ${m.pending?'pending':''} ${m.failed?'failed':''}" data-id="${msgId}" data-client="${m.clientId||''}" data-sender="${m.sender}">
    <div class="mav" data-user="${m.sender}" style="${avStyle}">${avInner}</div>
    <div class="bub"><div class="hd"><span class="nm" data-user="${m.sender}" style="color:${senderColor}">${esc(m.senderName)}</span><span>${fTime(m.timestamp)}</span>${edited}</div>${replyHtml}<div class="txt">${txt}${state}</div>${rxs}</div></div>`;
}
function bindMsgEvents(arr) {
  $('messagesArea').querySelectorAll('.rq[data-jump]').forEach(el => el.addEventListener('click', e => { e.stopPropagation(); const t = $('messagesArea').querySelector(`.msg[data-id="${el.dataset.jump}"]`); if (t) { t.scrollIntoView({ behavior:'smooth', block:'center' }); t.classList.add('flash'); setTimeout(() => t.classList.remove('flash'), 1500); } }));
  $('messagesArea').querySelectorAll('.link').forEach(el => el.addEventListener('click', e => { e.stopPropagation(); window.open(el.dataset.url, '_blank', 'noopener'); }));
  $('messagesArea').querySelectorAll('[data-retry]').forEach(el => el.addEventListener('click', e => { e.stopPropagation(); retryMsg(el.dataset.retry); }));
  $('messagesArea').querySelectorAll('.rx').forEach(el => el.addEventListener('click', e => { e.stopPropagation(); toggleReaction(el.dataset.msg, el.dataset.react); }));
  $('messagesArea').querySelectorAll('[data-user]').forEach(el => {
    if (el.classList.contains('msg')) return;
    el.addEventListener('click', e => { e.stopPropagation(); const login = el.dataset.user; if (login) openInfoUser(login); });
  });
  $('messagesArea').querySelectorAll('.msg').forEach(el => {
    let t = null, moved = false;
    el.addEventListener('touchstart', () => { moved = false; t = setTimeout(() => { if (!moved) showMsgActions(el); }, 450); }, { passive:true });
    el.addEventListener('touchmove', () => { moved = true; if (t) clearTimeout(t); });
    el.addEventListener('touchend', () => { if (t) clearTimeout(t); });
    el.addEventListener('contextmenu', e => { e.preventDefault(); showMsgActions(el); });
    el.addEventListener('click', e => {
      if (e.target.closest('.link') || e.target.closest('.jm') || e.target.closest('.rx') || e.target.closest('[data-retry]') || e.target.closest('[data-user]')) return;
      showMsgActions(el);
    });
  });
}
function showMsgActions(el) {
  const msgId = el.dataset.id, sender = el.dataset.sender;
  const arr = messages[currentChatId] || [];
  const m = arr.find(x => x.id === msgId || x.clientId === msgId);
  if (!m) return;
  const isMine = sender === currentUser.login;
  const isAdmin = currentChatMeta?.isAdmin;
  const canDel = isMine || isAdmin;
  const canEdit = isMine && m.id && (!m.editedAt || Date.now() - new Date(m.timestamp).getTime() < 5*86400000);
  const rxRow = $('rxRow'); rxRow.innerHTML = '';
  REACTIONS.forEach(r => { const b = document.createElement('button'); b.className = 'rx-btn'; b.textContent = r; b.onclick = e => { e.stopPropagation(); toggleReaction(m.id, r); hideMsgActions(); }; rxRow.appendChild(b); });
  const actRow = $('actRow'); actRow.innerHTML = '';
  const add = (label, cls, fn) => { const b = document.createElement('button'); b.className = 'act-btn' + (cls?' '+cls:''); b.textContent = label; b.onclick = e => { e.stopPropagation(); fn(); hideMsgActions(); }; actRow.appendChild(b); };
  add('📋 КОПИЯ','',()=>navigator.clipboard?.writeText(m.text).then(()=>toast('Инфо','Скопировано')));
  add('↩ ОТВЕТ','',()=>{ replyToMsg = m.id; $('msgInput').placeholder = `↪ ${m.senderName}: _`; $('msgInput').focus(); });
  if (canEdit) add('✏ ИЗМ','',()=>openEdit(m));
  if (canDel) add('🗑 УДАЛ','danger',()=>{ if (confirm('Удалить?')) sendWS({ type:'deleteMessage', payload:{ messageId:m.id } }); });
  const rect = el.getBoundingClientRect();
  $('msgActions').classList.add('active');
  const w = $('msgActions').offsetWidth || 280, h = $('msgActions').offsetHeight || 100;
  let left = rect.left + rect.width/2 - w/2, top = rect.top - h - 8;
  if (left < 8) left = 8;
  if (left + w > window.innerWidth - 8) left = window.innerWidth - w - 8;
  if (top < 8) top = rect.bottom + 8;
  $('msgActions').style.left = left + 'px'; $('msgActions').style.top = top + 'px';
}
function hideMsgActions() { $('msgActions').classList.remove('active'); }
document.addEventListener('click', e => { if (!$('msgActions').contains(e.target)) hideMsgActions(); });
function toggleReaction(msgId, emoji) { sendWS({ type:'toggleReaction', payload:{ messageId: msgId, emoji } }); }
function sendWS(obj) { if (ws && ws.readyState === 1) try { ws.send(JSON.stringify(obj)); return true; } catch {} return false; }

$('msgInput').addEventListener('input', () => {

});
$('msgInput').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); } });
function sendMsg() {
  const text = $('msgInput').value.trim();
  if (!text || !currentChatId || !currentUser) return;
  const clientId = 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
  const opt = { id:null, clientId, chatId:currentChatId, sender:currentUser.login, senderName:currentUser.nickname||currentUser.login, text, timestamp:new Date().toISOString(), replyTo:replyToMsg||null, deleted:0, pending:true, reactions:[] };
  if (!messages[currentChatId]) messages[currentChatId] = [];
  messages[currentChatId].push(opt);
  renderMessages();
  const payload = { chatId:currentChatId, text, clientId };
  if (replyToMsg) payload.replyTo = replyToMsg;
  $('msgInput').value = ''; replyToMsg = null; $('msgInput').placeholder = 'Сообщение...';
  if (!sendWS({ type:'newMessage', payload })) sendQueue.push(payload);
  setTimeout(() => { if (opt.pending) { opt.pending = false; opt.failed = true; if (currentChatId === opt.chatId) renderMessages(); } }, 8000);
  setTimeout(() => $('msgInput').focus(), 50);
}
let sendLock = false;
function sendTap(e) {
  if (e.type === 'touchstart') { e.preventDefault(); if (sendLock) return; sendLock = true; sendMsg(); setTimeout(() => sendLock = false, 300); }
  else { if (sendLock) return; sendMsg(); }
}
$('sendBtn').addEventListener('touchstart', sendTap, { passive:false });
$('sendBtn').addEventListener('click', sendTap);
function retryMsg(clientId) {
  const arr = messages[currentChatId]; if (!arr) return;
  const m = arr.find(x => x.clientId === clientId); if (!m) return;
  m.failed = false; m.pending = true;
  const payload = { chatId:currentChatId, text:m.text, clientId };
  if (m.replyTo) payload.replyTo = m.replyTo;
  if (!sendWS({ type:'newMessage', payload })) sendQueue.push(payload);
  renderMessages();
}

async function saveNickname() {
  const v = $('pNickname').value.trim(); if (!v) return toast('Ошибка', 'Введите ник');
  try { await api('/api/me', { method:'PUT', body: JSON.stringify({ nickname: v }) }); currentUser.nickname = v; localStorage.setItem('krista_user', JSON.stringify(currentUser)); applyUserToHeader(); renderProfile(); const acc = accounts.find(a => a.login === currentUser.login); if (acc) { acc.nickname = v; saveAccList(); } toast('Инфо', 'Ник обновлён'); }
  catch(e) { toast('Ошибка', e.message); }
}
async function saveLogin() {
  const v = $('pNewLogin').value.trim(); if (!v) return toast('Ошибка', 'Введите логин');
  try {
    const res = await api('/api/me', { method:'PUT', body: JSON.stringify({ newLogin: v }) });
    if (res.newLogin && res.newToken) {
      const oldLogin = currentUser.login;
      currentUser.login = res.newLogin; token = res.newToken;
      localStorage.setItem('krista_token', token); localStorage.setItem('krista_user', JSON.stringify(currentUser));
      const acc = accounts.find(a => a.login === oldLogin); if (acc) { acc.login = res.newLogin; acc.token = token; saveAccList(); }
      applyUserToHeader(); renderProfile();
      if (ws) { try { ws.close(); } catch {} ws = null; } connectWS(); await loadChats();
      toast('Инфо', 'Логин: @' + res.newLogin);
    }
  } catch(e) { toast('Ошибка', e.message); }
}
async function saveStatusText() {
  const v = $('pStatusText').value.trim();
  try { await api('/api/me', { method:'PUT', body: JSON.stringify({ statusText: v, status: v ? 'custom' : 'online' }) }); currentUser.statusText = v; currentUser.status = v ? 'custom' : 'online'; localStorage.setItem('krista_user', JSON.stringify(currentUser)); applyUserToHeader(); renderProfile(); toast('Инфо', 'Статус обновлён'); }
  catch(e) { toast('Ошибка', e.message); }
}
async function savePassword() {
  const o = $('pOldPw').value, n = $('pNewPw').value;
  if (!o || !n) return toast('Ошибка', 'Заполни оба');
  if (n.length < 6) return toast('Ошибка', 'Минимум 6');
  try { await api('/api/me', { method:'PUT', body: JSON.stringify({ password:o, newPassword:n }) }); $('pOldPw').value = ''; $('pNewPw').value = ''; toast('Инфо', 'Пароль изменён'); }
  catch(e) { toast('Ошибка', e.message); }
}

      <div class="tg" id="themeGrid"></div>

      <div id="accountsList"></div>
      <button onclick="addAccount()" style="align-self:flex-start;background:var(--glass-2);border:1px solid var(--glass-border);color:var(--text2);font-family:var(--font-head);font-weight:600;font-size:12px;padding:8px 14px;cursor:pointer;border-radius:12px">+ ДОБАВИТЬ</button>

    <div class="cpyr">Кухаркв Егор, ЛесГем — 2026<br>v1.14</div>
  `;
  buildThemeGrid($('themeGrid'), currentUser?.theme || 'rose', t => { saveProfileField('theme', t); applyTheme(t); });
