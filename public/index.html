<!DOCTYPE html>
<html lang="ru" data-theme="sunset">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#1a0b2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Криста">
<title>Криста.Net v5.67</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Unbounded:wght@400;600;700&family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&family=Open+Sans:wght@400;500;600;700&family=Philosopher:wght@400;700&family=Oswald:wght@400;600;700&family=Neucha&family=VT323&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  --safe-top:env(safe-area-inset-top,0);--safe-bottom:env(safe-area-inset-bottom,0);
  --sidebar-w:64px;--rad:20px;--rad-sm:14px;
  --font-head:'Comfortaa',sans-serif;--font-body:'Inter',sans-serif;--font-mono:'JetBrains Mono',monospace;
  --blur: 24px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;position:fixed;inset:0;width:100%;background:#000}
input,textarea{user-select:text !important;-webkit-user-select:text !important}

/* СТАРЫЙ ДОБРЫЙ GLASSMORPHISM */
.glass {
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(var(--blur)) saturate(150%);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(150%);
  border: 1px solid rgba(255, 255, 255, 0.15);
  box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
  position: relative; z-index: 10;
}
.shake-click:active {
  transform: scale(0.97);
  transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ТЕМЫ */
html[data-theme="sunset"] {
  --accent:#ff3b30; --accent-2:#cc2a20; --text:#fff; --text-2:rgba(255,255,255,0.7); --text-3:rgba(255,255,255,0.4);
  --bg-gradient: linear-gradient(180deg, #1a0b2e 0%, #4a1a30 40%, #ff3b30 100%);
}
html[data-theme="oldschool"] {
  --accent:#7fff2a; --accent-2:#3aaa00; --text:#d4ffb8; --text-2:rgba(212,255,184,0.7); --text-3:rgba(212,255,184,0.4);
  --bg-gradient: #1a1f16;
}
html[data-theme="classic"] {
  --accent:#000080; --accent-2:#1084d0; --text:#000; --text-2:#333; --text-3:#666;
  --bg-gradient: #008080;
}

.bg-layer { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: var(--bg-gradient); background-attachment: fixed; }
html[data-theme="sunset"] .bg-layer::after { content: ''; position: absolute; inset: 0; background-image: linear-gradient(0deg, transparent 24%, rgba(255,255,255,0.05) 25%, transparent 27%), linear-gradient(90deg, transparent 24%, rgba(255,255,255,0.05) 25%, transparent 27%); background-size: 40px 40px; transform: perspective(500px) rotateX(60deg) scale(3); transform-origin: bottom center; animation: moveGrid 10s linear infinite; opacity: 0.5; }
@keyframes moveGrid { from { background-position: 0 0; } to { background-position: 0 40px; } }
html[data-theme="oldschool"] .bg-layer::after { content: ''; position: absolute; inset: 0; background-image: repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(255,255,255,0.03) 40px, rgba(255,255,255,0.03) 80px), repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(255,255,255,0.03) 40px, rgba(255,255,255,0.03) 80px); }

/* БАЗА */
body{font-family:var(--font-body);font-size:14px;color:var(--text);-webkit-font-smoothing:antialiased;overflow:hidden}
#app{width:100%;height:100%;display:flex;position:relative;overflow:hidden;z-index:2;padding: 10px; gap: 10px;}
.main{flex:1;min-width:0;display:flex;flex-direction:row;position:relative;overflow:hidden; gap: 10px;}
#leftPane{width:340px;min-width:240px;max-width:60vw;flex-shrink:0;display:flex;flex-direction:column;overflow:hidden;border-radius: 24px;position:relative}
#rightPane{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;position:relative;border-radius: 24px; background: transparent;}
.right-placeholder{display:flex;flex:1;align-items:center;justify-content:center;color:var(--text-3);font-family:var(--font-head);font-size:14px;text-align:center;padding:20px;gap:8px;flex-direction:column; border-radius: 24px;}

.sidebar{width:var(--sidebar-w);flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:14px;border-radius: 26px;z-index:10}
.sidebar-logo{width:44px;height:44px;flex-shrink:0;position:relative;margin-bottom:4px;cursor:pointer; border-radius: 16px; display:flex; align-items:center; justify-content:center;}
.ws-dot{position:absolute;top:-2px;right:-2px;width:12px;height:12px;border-radius:50%;background:#666;transition:background .3s;border:2px solid #000;box-sizing:content-box;z-index:5}
.ws-dot.on{background:#00ff88;box-shadow:0 0 10px #00ff88}
.sb-btn{width:46px;height:46px;flex-shrink:0;border-radius:16px;color:var(--text-2);font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;position:relative;border:1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.1); transition: all .3s;}
.sb-btn.active{background:var(--accent);color:#fff;box-shadow:0 0 20px var(--accent);border-color:transparent}

@media (max-width: 768px) {
  #app { padding: 0; gap: 0; }
  .main { gap: 0; }
  .sidebar { border-radius: 0; margin: 0; width: 56px; padding-top: max(14px, var(--safe-top)); background: transparent; border: none; box-shadow: none; backdrop-filter: none; }
  #leftPane{width:100%;max-width:100%;border-radius: 0; border: none; box-shadow: none; backdrop-filter: none;}
  #rightPane{display:none; border-radius: 0; margin: 0;}
  body.chat-open #rightPane { display:flex; position:absolute; inset:0; z-index:60; }
  body.chat-open #leftPane, body.chat-open .sidebar { display:none }
  .chat-screen { border-radius: 0; border: none; }
}

/* ЭЛЕМЕНТЫ */
.profile-preview{flex-shrink:0;margin:10px 10px 0;padding:10px 14px;border-radius:20px;display:flex;align-items:center;gap:12px;cursor:pointer}
.pp-avatar{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;overflow:hidden}
.pp-avatar img{width:100%;height:100%;object-fit:cover}
.pp-info{flex:1;min-width:0}
.pp-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;line-height:1.2;font-family:var(--font-head)}
.pp-login{font-size:11px;color:var(--text-3);margin-top:2px;font-family:var(--font-mono)}
.pp-edit{width:32px;height:32px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.1);color:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center}

.view{display:none;flex:1;min-height:0;flex-direction:column;overflow:hidden}
.view.active{display:flex}
.view-header{flex-shrink:0;padding:14px 16px 8px;display:flex;align-items:center;gap:10px;}
.view-title{flex:1;min-width:0;font-size:13px;font-weight:700;font-family:var(--font-head);color:var(--accent);text-transform:uppercase;letter-spacing:1.5px;}
.folders-area{flex:1;overflow-y:auto;min-height:0;padding:10px 10px 80px;}

.chat-row{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;border-radius:16px;margin-top:6px;transition:all .2s;border:1px solid transparent;position:relative;}
.chat-row:active{transform:scale(0.97);background:rgba(255,255,255,0.1)}
.chat-row.unread-strong{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.15)}
.chat-avatar{width:44px;height:44px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;overflow:hidden}
.chat-avatar img{width:100%;height:100%;object-fit:cover}
.chat-info{flex:1;min-width:0}
.chat-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;line-height:1.2;font-family:var(--font-head);}
.chat-preview{font-size:12px;color:var(--text-2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-preview.typing { color: var(--accent); font-style: italic; font-weight: 600; }
.chat-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.chat-time{font-size:11px;color:var(--text-3);font-weight:600}
.chat-badge{background:var(--accent);color:#fff;font-size:10px;font-weight:800;padding:2px 7px;min-width:20px;text-align:center;border-radius:10px;font-family:var(--font-head);}

.chat-screen{position:absolute;inset:0;z-index:50;display:none;flex-direction:column;border-radius:24px;overflow:hidden;}
.chat-screen.open{display:flex;animation:slideIn .3s ease}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}
.chat-header{flex-shrink:0;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;gap:12px;}
.back-btn{width:40px;height:40px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:22px;border-radius:14px;display:flex;align-items:center;justify-content:center;}
.ch-avatar{width:42px;height:42px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;overflow:hidden}
.ch-avatar img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.ch-name{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--font-head); display:flex; align-items:center;}

.messages{flex:1;overflow-y:auto;min-height:0;padding:20px 16px;display:flex;flex-direction:column; position:relative;}
.msg{margin-bottom:12px;display:flex;gap:8px;align-items:flex-end;position:relative;max-width:100%; transition: transform 0.2s; touch-action: pan-y;}
.mav{width:32px;height:32px;border-radius:12px;background:rgba(0,0,0,0.2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;overflow:hidden; flex-shrink: 0;}
.mav img{width:100%;height:100%;object-fit:cover}
.msg.out{flex-direction:row-reverse}
.bub{position:relative;padding:10px 16px;max-width:80%;cursor:pointer;word-wrap:break-word;border-radius:22px 22px 22px 6px; font-size:14px; line-height:1.4; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1);}
.msg.out .bub{border-radius:22px 22px 6px 22px; background:var(--accent); border-color:transparent;}
.hd{font-size:11px;color:var(--text-2);margin-bottom:4px;display:flex;gap:6px;align-items:center; font-family:var(--font-head)}
.hd .nm{font-weight:800;color:var(--accent); display:flex; align-items:center;}
.txt{word-break:break-word;white-space:pre-wrap;color:#fff;}
.txt.huge-emoji { font-size: 64px; line-height: 1.1; padding: 4px 8px; text-shadow: none; }

/* SWIPE TO REPLY */
.reply-icon { position: absolute; left: -40px; top: 50%; transform: translateY(-50%); opacity: 0; font-size: 20px; transition: opacity 0.2s, transform 0.2s; }
.msg.swiping { transition: none !important; }
.msg.swiping .reply-icon { opacity: 1; transform: translateY(-50%) scale(1.2); }

.chat-input-bar{flex-shrink:0;padding:12px 16px;padding-bottom:calc(12px + var(--safe-bottom));border-top:1px solid rgba(255,255,255,0.1);display:flex;gap:10px;}
.chat-input-bar input{flex:1;min-width:0;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.15);color:#fff;font-size:16px;padding:12px 18px;outline:none;border-radius:18px;}
.chat-input-bar .send-btn{background:var(--accent);color:#fff;font-size:22px;padding:0 20px;border:none;border-radius:18px;}

/* МОДАЛКИ */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(10px);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal-box{width:100%;max-width:380px;border-radius:24px;background:#1a1a1a;border:1px solid rgba(255,255,255,0.1);display:flex;flex-direction:column;max-height:85vh;overflow:hidden;}
.modal-header{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:space-between;}
.modal-header h3{font-size:16px;font-weight:800;font-family:var(--font-head);color:#fff;}
.modal-close{width:34px;height:34px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.1);color:#fff;font-size:16px;border-radius:12px; display: flex; align-items: center; justify-content: center;}
.modal-body{padding:20px;overflow-y:auto;flex:1;}
.modal-actions{display:flex;gap:10px;padding:16px 20px;border-top:1px solid rgba(255,255,255,0.1);}
.modal-actions button{flex:1;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.1);color:#fff;font-family:var(--font-head);font-size:13px;font-weight:800;padding:12px;border-radius:14px;}
.modal-actions button.primary{background:var(--accent);border-color:transparent;}

.list-btn{display:flex;align-items:center;gap:10px;padding:12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;margin-bottom:8px;cursor:pointer;color:#fff;font-size:14px;width:100%; text-align:left;}
.list-btn.primary{border-color:var(--accent);background:rgba(255,59,48,0.1);}

#cropperModal .modal-box{max-width:90vw;padding:0}
#cropperModal .modal-body{display:flex;justify-content:center;align-items:center;background:#000;overflow:hidden;position:relative;height:50vh;padding:0}
#cropperCanvas{touch-action:none;max-width:100%;max-height:100%}
.cropper-controls { display: flex; justify-content: center; gap: 10px; padding: 10px; background: rgba(255,255,255,0.05); }
.cropper-controls button { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; width: 44px; height: 44px; border-radius: 12px; font-size: 20px; }

.login-screen{position:fixed;inset:0;display:none;flex-direction:column;justify-content:center;align-items:center;padding:24px;z-index:600;background:var(--bg-gradient);}
.login-screen.active{display:flex}
.login-box{width:100%;max-width:360px;padding:30px 24px;border-radius:24px;}
.login-btn{width:100%;background:var(--accent);border:none;color:#fff;font-family:var(--font-head);font-weight:800;font-size:16px;padding:14px;border-radius:16px; margin-top: 10px;}

.drag-overlay { position: fixed; inset: 0; background: rgba(255, 59, 48, 0.2); border: 4px dashed var(--accent); z-index: 9999; display: none; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; color: #fff; backdrop-filter: blur(5px); pointer-events: none; }
.drag-overlay.active { display: flex; }

.badge { display: inline-block; font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 6px; margin-left: 6px; vertical-align: middle; background: #ffcc00; color: #000; line-height: 1.2; }
.toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0; transition:0.3s; padding:12px 24px; border-radius:20px; font-weight:700; color:#fff; z-index:1000; pointer-events:none; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
</style>
</head>
<body>

<div class="bg-layer"></div>
<div class="drag-overlay" id="dragOverlay">📂 Отпусти, чтобы отправить</div>

<div class="login-screen" id="loginScreen">
  <div class="login-box glass">
    <div style="text-align:center;font-size:24px;font-weight:800;margin-bottom:20px;font-family:var(--font-head);">Криста.Net v5.67</div>
    <div id="authError" style="color:#ff6b6b;text-align:center;margin-bottom:10px;font-size:12px;"></div>
    <input type="text" id="authLogin" placeholder="Логин" style="width:100%;background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.2);color:#fff;padding:14px;border-radius:14px;margin-bottom:10px;outline:none;">
    <input type="password" id="authPassword" placeholder="Пароль" style="width:100%;background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.2);color:#fff;padding:14px;border-radius:14px;margin-bottom:10px;outline:none;">
    <button class="login-btn shake-click" id="authSubmitBtn">ВОЙТИ</button>
  </div>
</div>

<div id="app" style="display:none">
  <aside class="sidebar">
    <div class="sidebar-logo glass shake-click" id="logoBtn">
      <svg viewBox="0 0 200 200" style="color:var(--accent);padding:6px;"><use href="#krista-logo"/></svg>
      <div class="ws-dot" id="wsDot"></div>
    </div>
    <button class="sb-btn glass shake-click active" data-view="chats" title="Чаты">💬</button>
    <button class="sb-btn glass shake-click" data-view="search" title="Поиск">🔍</button>
    <button class="sb-btn glass shake-click" data-view="settings" title="Настройки">⚙️</button>
  </aside>
  
  <div class="main">
    <div id="leftPane" class="glass">
      <div class="profile-preview shake-click" id="profilePreview">
        <div class="pp-avatar-wrap" id="ppAvatarWrap"><div class="pp-avatar" id="ppAvatar">?</div></div>
        <div class="pp-info">
          <div class="pp-name" id="ppName"><span>—</span></div>
          <div class="pp-login" id="ppLogin">@—</div>
        </div>
        <button class="pp-edit">✏️</button>
      </div>

      <div class="view active" id="viewChats">
        <div class="folders-area" id="foldersArea"></div>
      </div>

      <div class="view" id="viewSearch">
        <div class="view-header"><div class="view-title">Поиск</div></div>
        <div style="padding:10px;">
          <input type="search" id="globalSearchInput" placeholder="Поиск..." style="width:100%;background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.15);color:#fff;padding:12px 16px;border-radius:14px;margin-bottom:10px;outline:none;">
          <div id="globalSearchResults"></div>
        </div>
      </div>
    </div>

    <div id="rightPane">
      <div class="right-placeholder glass">Выбери чат</div>

      <div class="chat-screen glass" id="chatScreen">
        <div id="chatCustomBg" style="position:absolute;inset:0;background-size:cover;background-position:center;opacity:0.3;pointer-events:none;z-index:1;"></div>
        <div class="chat-header">
          <button class="back-btn glass shake-click" onclick="closeChat()">‹</button>
          <div class="ch-avatar-wrap" id="chAvatarWrap"><div class="ch-avatar" id="chAvatar"></div></div>
          <div class="ch-info" style="flex:1;min-width:0;">
            <div class="ch-name" id="chName">—</div>
            <div class="ch-sub" id="chSub" style="font-size:11px;color:var(--text-2);">@—</div>
          </div>
        </div>
        
        <div class="messages" id="messagesArea"></div>

        <div class="chat-input-bar" id="chatInputBar">
          <button class="icn-btn glass shake-click" onclick="document.getElementById('fileInput').click()">📎</button>
          <input type="file" id="fileInput" style="display:none">
          <input type="text" id="msgInput" placeholder="Сообщение..." autocomplete="off" maxlength="2000">
          <button class="send-btn shake-click" onclick="sendMsg()">➤</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- МОДАЛКИ -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal-box glass">
    <div class="modal-header"><h3>Настройки</h3><button class="modal-close glass shake-click" onclick="closeModal('settingsModal')">✕</button></div>
    <div class="modal-body" id="settingsContent"></div>
  </div>
</div>

<div class="modal-overlay" id="profileModal">
  <div class="modal-box glass">
    <div class="modal-header"><h3>Профиль</h3><button class="modal-close glass shake-click" onclick="closeModal('profileModal')">✕</button></div>
    <div class="modal-body" id="profileContent"></div>
    <div class="modal-actions"><button onclick="closeModal('profileModal')">Отмена</button><button class="primary" onclick="saveProfile()">Сохранить</button></div>
  </div>
</div>

<div class="modal-overlay" id="cropperModal">
  <div class="modal-box glass" style="max-width:90vw;">
    <div class="modal-header"><h3>Обрезка</h3><button class="modal-close glass shake-click" onclick="closeModal('cropperModal')">✕</button></div>
    <div class="modal-body" style="padding:0;background:#000;height:50vh;"><canvas id="cropperCanvas" style="touch-action:none;max-width:100%;max-height:100%;"></canvas></div>
    <div class="cropper-controls"><button onclick="rotateCrop()">🔄</button><button onclick="zoomCrop(1.1)">➕</button><button onclick="zoomCrop(0.9)">➖</button></div>
    <div class="modal-actions"><button onclick="closeModal('cropperModal')">Отмена</button><button class="primary" onclick="applyCrop()">Готово</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const VERSION_STR = '5.67';
const WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;
const MAX_FILE_SIZE = 20 * 1024 * 1024;

const $ = id => document.getElementById(id);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
const getAvatarUrl = id => id ? `/api/file/${encodeURIComponent(id)}?token=${encodeURIComponent(token||'')}` : '';
const firstChar = s => { try { return Array.from(String(s||'?'))[0] || '?'; } catch { return '?'; } };
const avatarInner = u => { if (!u) return '<span>?</span>'; if (u.avatarFileId) return `<img src="${esc(getAvatarUrl(u.avatarFileId))}" alt="">`; return esc(firstChar(u.nickname || u.login).toUpperCase()); };
const fTime = iso => { try { return new Date(iso).toTimeString().slice(0,5); } catch { return ''; } };

function vibrate(type = 'light') {
    if (window.Telegram?.WebApp?.HapticFeedback) {
        if (type === 'light') window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
        else if (type === 'heavy') window.Telegram.WebApp.HapticFeedback.impactOccurred('heavy');
        else if (type === 'success') window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
    } else if (navigator.vibrate) navigator.vibrate(10);
}

let token = localStorage.getItem('krista_token') || null;
let currentUser = null;
try { currentUser = JSON.parse(localStorage.getItem('krista_user') || 'null'); } catch {}
let ws = null, wsState = 'offline', wsReconnectAttempts = 0, reconnectTimer = null;
let chats = [], currentChatId = null, currentChatMeta = null;
let messages = {}, typingState = {}, replyToMsg = null;

// CROPPER
let cropState = { img: null, type: null, scale: 1, rotation: 0, x: 0, y: 0, canvas: null, ctx: null };
function openCropper(file, type) {
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      cropState.img = img; cropState.type = type;
      cropState.scale = 1; cropState.rotation = 0; cropState.x = 0; cropState.y = 0;
      const canvas = $('cropperCanvas'); const ctx = canvas.getContext('2d');
      canvas.width = 400; canvas.height = 400;
      const scaleX = canvas.width / img.width, scaleY = canvas.height / img.height;
      cropState.scale = Math.max(scaleX, scaleY);
      cropState.x = (canvas.width - img.width * cropState.scale) / 2;
      cropState.y = (canvas.height - img.height * cropState.scale) / 2;
      cropState.canvas = canvas; cropState.ctx = ctx;
      drawCropper(); $('cropperModal').classList.add('open');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function drawCropper() {
  const { ctx, canvas, img, scale, rotation, x, y } = cropState;
  if (!ctx || !img) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save(); ctx.translate(canvas.width / 2, canvas.height / 2); ctx.rotate(rotation * Math.PI / 180); ctx.translate(-canvas.width / 2, -canvas.height / 2);
  ctx.drawImage(img, x, y, img.width * scale, img.height * scale); ctx.restore();
}
window.rotateCrop = () => { cropState.rotation = (cropState.rotation + 90) % 360; drawCropper(); };
window.zoomCrop = (f) => { cropState.scale *= f; drawCropper(); };
window.applyCrop = () => {
  cropState.canvas.toBlob(async blob => {
    closeModal('cropperModal');
    const file = new File([blob], 'image.jpg', { type: 'image/jpeg' });
    const form = new FormData(); form.append('file', file); form.append('purpose', 'avatar');
    toast('Загрузка...');
    try {
        const r = await fetch('/api/upload', { method:'POST', headers:{ Authorization:'Bearer '+token }, body: form });
        const d = await r.json(); if (!r.ok) throw new Error(d.error);
        currentUser.avatarFileId = d.fileId; localStorage.setItem('krista_user', JSON.stringify(currentUser));
        $('ppAvatar').innerHTML = avatarInner(currentUser); closeModal('profileModal'); toast('Аватар обновлен');
    } catch(e) { toast(e.message); }
  }, 'image/jpeg', 0.9);
};

// API & WS
async function api(url, opts = {}) {
  const h = { 'Content-Type':'application/json', ...(opts.headers||{}) };
  if (token) h.Authorization = 'Bearer ' + token;
  const r = await fetch(url, { ...opts, headers: h });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Ошибка');
  return d;
}
function toast(msg) { const el = $('toast'); if (!el) return; el.textContent = msg; el.style.opacity = '1'; el.style.transform = 'translateX(-50%) translateY(0)'; setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(-50%) translateY(20px)'; }, 2500); }
function connectWS() {
  if (!token || !navigator.onLine || (ws && ws.readyState < 2)) return;
  ws = new WebSocket(WS_URL);
  ws.onopen = () => { ws.send(JSON.stringify({ type:'auth', payload:{ token } })); wsState = 'online'; $('wsDot').classList.add('on'); wsReconnectAttempts = 0; };
  ws.onmessage = e => { try { const d = JSON.parse(e.data); if (d.type === 'newMessage') { if (currentChatId === d.payload.chatId) { messages[currentChatId].push(d.payload); renderMessages(); } loadChats(); vibrate('light'); } else if (d.type === 'typing') { typingState[d.payload.chatId] = d.payload.nickname; setTimeout(() => { delete typingState[d.payload.chatId]; renderChats(); }, 3000); renderChats(); } } catch {} };
  ws.onclose = () => { wsState = 'offline'; $('wsDot').classList.remove('on'); wsReconnectAttempts++; setTimeout(connectWS, Math.min(2000 * wsReconnectAttempts, 15000)); };
}

// CHATS
async function loadChats() {
  if (!token) return;
  try { chats = await api('/api/chats'); renderChats(); } catch(e) { if(e.message.includes('устарел')) logout(); }
}
function renderChats() {
  const area = $('foldersArea'); if (!area) return;
  if (!chats.length) { area.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-3);">Нет чатов</div>'; return; }
  area.innerHTML = chats.map(c => {
    const u = c.isGroup ? null : c.otherUser;
    const av = c.isGroup ? (c.avatarFileId ? `<img src="${esc(getAvatarUrl(c.avatarFileId))}">` : '#') : avatarInner(u);
    const name = c.isGroup ? c.name : (u?.nickname || c.otherLogin || '?');
    let preview = c.lastMessage ? (c.lastMessage.text || '📎 Файл') : 'Нет сообщений';
    if (typingState[c.id]) preview = '<span style="color:var(--accent);font-weight:700;">печатает...</span>';
    const badge = c.unreadCount > 0 ? `<div class="chat-badge">${c.unreadCount}</div>` : '';
    return `<div class="chat-row glass shake-click" onclick="openChat('${c.id}')"><div class="chat-avatar">${av}</div><div class="chat-info"><div class="chat-name">${esc(name)}</div><div class="chat-preview">${esc(preview)}</div></div><div class="chat-right"><div class="chat-time">${c.lastMessage ? fTime(c.lastMessage.timestamp) : ''}</div>${badge}</div></div>`;
  }).join('');
}

async function openChat(id) {
  const c = chats.find(x => x.id === id); if (!c) return;
  currentChatId = id; currentChatMeta = c;
  $('chName').textContent = c.isGroup ? c.name : (c.otherUser?.nickname || c.otherLogin || '?');
  $('chatScreen').classList.add('open'); document.body.classList.add('chat-open');
  if (window.Telegram?.WebApp?.BackButton) window.Telegram.WebApp.BackButton.show();
  try { messages[id] = await api('/api/chats/' + id + '/messages'); renderMessages(); } catch(e) { toast(e.message); }
}
window.openChat = openChat;
function closeChat() { $('chatScreen').classList.remove('open'); document.body.classList.remove('chat-open'); currentChatId = null; if (window.Telegram?.WebApp?.BackButton) window.Telegram.WebApp.BackButton.hide(); }
window.closeChat = closeChat;

// MESSAGES & SWIPE
function renderMessages() {
  const area = $('messagesArea'); const arr = messages[currentChatId] || [];
  if (!arr.length) { area.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-3);">Нет сообщений</div>'; return; }
  area.innerHTML = arr.map(m => {
    const isOut = m.sender === currentUser.login;
    const av = isOut ? avatarInner(currentUser) : avatarInner({ nickname: m.senderName, avatarFileId: m.senderAvatarFileId });
    const isEmoji = /^(\p{Emoji_Presentation}|\p{Extended_Pictographic}|\u200D|\uFE0F|\s){1,4}$/u.test(m.text || '');
    return `<div class="msg ${isOut?'out':''}" data-id="${m.id}">
      <div class="reply-icon">↩️</div>
      <div class="mav">${av}</div>
      <div class="bub">${!isOut?`<div class="hd"><span class="nm">${esc(m.senderName)}</span><span>${fTime(m.timestamp)}</span></div>`:`<div class="hd"><span style="margin-left:auto">${fTime(m.timestamp)}</span></div>`}
      ${isEmoji ? `<div class="txt huge-emoji">${m.text}</div>` : `<div class="txt">${esc(m.text)}</div>`}</div>
    </div>`;
  }).join('');
  area.scrollTop = area.scrollHeight;
  bindSwipe();
}
function bindSwipe() {
  $$('.msg').forEach(el => {
    let sx = 0, cx = 0, swiping = false;
    el.addEventListener('touchstart', e => { sx = e.touches[0].clientX; swiping = false; el.classList.add('swiping'); }, {passive:true});
    el.addEventListener('touchmove', e => { cx = e.touches[0].clientX; const diff = cx - sx; if(diff > 0 && diff < 80) { el.style.transform = `translateX(${diff}px)`; swiping = true; } }, {passive:true});
    el.addEventListener('touchend', () => { el.classList.remove('swiping'); el.style.transform = ''; if(swiping && (cx - sx) > 50) { replyToMsg = el.dataset.id; $('msgInput').placeholder = 'Ответ...'; $('msgInput').focus(); vibrate('medium'); } });
  });
}
function sendMsg() {
  const text = $('msgInput').value.trim(); if (!text || !currentChatId) return;
  const cid = 'c_' + Date.now();
  const payload = { chatId: currentChatId, text, clientId: cid };
  if (replyToMsg) payload.replyTo = replyToMsg;
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type:'newMessage', payload }));
  messages[currentChatId].push({ id: cid, clientId: cid, chatId: currentChatId, sender: currentUser.login, senderName: currentUser.nickname, text, timestamp: new Date().toISOString(), senderAvatarFileId: currentUser.avatarFileId });
  $('msgInput').value = ''; replyToMsg = null; $('msgInput').placeholder = 'Сообщение...';
  renderMessages(); vibrate('light');
}
window.sendMsg = sendMsg;

// D&D
const dropZone = $('messagesArea');
dropZone.addEventListener('dragover', e => { e.preventDefault(); $('dragOverlay').classList.add('active'); });
dropZone.addEventListener('dragleave', () => $('dragOverlay').classList.remove('active'));
dropZone.addEventListener('drop', e => { e.preventDefault(); $('dragOverlay').classList.remove('active'); if (e.dataTransfer.files.length) { /* upload logic */ toast('Файл добавлен'); } });

// SETTINGS & PROFILE
window.openSettings = () => {
  $('settingsContent').innerHTML = `
    <div style="margin-bottom:20px;">
      <div style="font-size:12px;color:#aaa;margin-bottom:8px;">Тема</div>
      <button class="list-btn" onclick="setTheme('sunset')">Sunset</button>
      <button class="list-btn" onclick="setTheme('oldschool')">Old-school</button>
      <button class="list-btn" onclick="setTheme('classic')">Classic</button>
    </div>
    <button class="list-btn" style="color:red;" onclick="logout()">🚪 Выйти из аккаунта</button>
  `;
  $('settingsModal').classList.add('open');
};
window.setTheme = (t) => { document.documentElement.setAttribute('data-theme', t); localStorage.setItem('krista_theme', t); toast('Тема изменена'); };
$('profilePreview').onclick = () => {
  $('profileContent').innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:20px;">
      <div class="pp-avatar" style="width:80px;height:80px;font-size:32px;">${avatarInner(currentUser)}</div>
      <button class="list-btn" onclick="document.getElementById('avatarFileInput').click()">🖼️ Сменить аватар</button>
      <input type="file" id="avatarFileInput" accept="image/*" style="display:none" onchange="if(this.files[0]) openCropper(this.files[0], 'avatar')">
    </div>
    <div style="font-size:12px;color:#aaa;margin-bottom:4px;">Ник</div>
    <input type="text" id="profName" value="${esc(currentUser.nickname)}" style="width:100%;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.2);background:rgba(0,0,0,0.2);color:white;outline:none;">
  `;
  $('profileModal').classList.add('open');
};
window.saveProfile = async () => {
  const name = $('profName').value.trim(); if(!name) return;
  await api('/api/me', { method:'PUT', body: JSON.stringify({ nickname: name }) });
  currentUser.nickname = name; localStorage.setItem('krista_user', JSON.stringify(currentUser));
  $('ppName').textContent = name; closeModal('profileModal'); toast('Сохранено');
};
window.closeModal = (id) => $(id).classList.remove('open');
window.logout = () => { localStorage.clear(); location.reload(); };

// INIT
(async function init() {
  const savedTheme = localStorage.getItem('krista_theme') || 'sunset';
  document.documentElement.setAttribute('data-theme', savedTheme);

  if (window.Telegram?.WebApp?.initData && !token) {
      try {
          const res = await fetch('/api/auth/telegram', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ initData: window.Telegram.WebApp.initData }) });
          const d = await res.json();
          if (d.token) { token = d.token; currentUser = d; localStorage.setItem('krista_token', token); localStorage.setItem('krista_user', JSON.stringify(currentUser)); }
      } catch(e) { console.warn("TG auth failed"); }
  }

  if (token && currentUser) {
    $('app').style.display = 'flex';
    $('ppName').textContent = currentUser.nickname;
    $('ppLogin').textContent = '@' + currentUser.login;
    $('ppAvatar').innerHTML = avatarInner(currentUser);
    connectWS(); await loadChats();
    if (window.Telegram?.WebApp?.BackButton) window.Telegram.WebApp.BackButton.onClick(() => { if(currentChatId) closeChat(); });
  } else {
    $('loginScreen').classList.add('active');
    $('authSubmitBtn').onclick = async () => {
      try {
        const d = await api('/api/login', { method:'POST', body: JSON.stringify({ login: $('authLogin').value, password: $('authPassword').value }) });
        token = d.token; currentUser = d; localStorage.setItem('krista_token', token); localStorage.setItem('krista_user', JSON.stringify(currentUser));
        location.reload();
      } catch(e) { $('authError').textContent = e.message; }
    };
  }
})();
</script>
</body>
  </html>
