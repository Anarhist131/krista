function buildThemeGrid(el, current, onPick) {
  el.innerHTML = '';
  THEMES.forEach(t => {
    const d = document.createElement('div');
    d.className = 'tw t-' + t.id + (current === t.id ? ' active' : '');
    d.dataset.theme = t.id;
    d.innerHTML = `<span class="lbl">${t.name}</span>`;
    d.onclick = () => onPick(t.id);
    el.appendChild(d);
  });
}
function renderAccounts() {
  const el = $('accountsList');
  if (!accounts.length) { el.innerHTML = '<div style="color:var(--text3);font-size:11px;font-style:italic;padding:6px 0">Нет сохранённых</div>'; return; }
  el.innerHTML = accounts.map((a, i) => {
    const active = currentUser && a.login === currentUser.login;
    return `<div class="acc ${active?'active':''}"><div class="ainfo"><div class="aname">${esc(a.nickname||a.login)}</div><div class="alogin">@${esc(a.login)}</div></div>${active?'<span class="atag">●</span>':`<button data-switch="${i}">ВОЙТИ</button>`}<button class="del" data-del="${i}">✕</button></div>`;
  }).join('');
  el.querySelectorAll('[data-switch]').forEach(b => b.onclick = () => switchAccount(+b.dataset.switch));
  el.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { const i = +b.dataset.del; if (confirm('Убрать аккаунт?')) { accounts.splice(i, 1); saveAccList(); renderAccounts(); } });
}
function saveAccount(acc) { accounts = accounts.filter(a => a.login !== acc.login); accounts.unshift(acc); if (accounts.length > 4) accounts = accounts.slice(0, 4); saveAccList(); }
function saveAccList() { localStorage.setItem('krista_accounts', JSON.stringify(accounts)); }
async function switchAccount(i) {
  const a = accounts[i]; if (!a) return;
  if (ws) { try { ws.close(); } catch {} ws = null; }
  stopHeartbeat(); if (reconnectTimer) clearTimeout(reconnectTimer);
  token = a.token; localStorage.setItem('krista_token', token);
  currentUser = { login: a.login, nickname: a.nickname || a.login };
  localStorage.setItem('krista_user', JSON.stringify(currentUser));
  messages = {}; chats = []; currentChatId = null; onlineStatus = {}; sendQueue = [];
  $('screenChat').classList.remove('active');
  applyUserToHeader(); refreshTheme();
  showScreen('main'); switchTab('Chats'); connectWS(); loadChats();
  toast('Инфо', 'Аккаунт: @' + a.login);
}
function addAccount() { closeAllOverlays(); logout(); switchAuthTab('login'); }
function openDiagnostics() {
  const items = [
    ['WebSocket', wsState === 'online' ? 'ONLINE' : wsState.toUpperCase()],
    ['Pong', wsState === 'online' ? Math.round((Date.now()-lastPongAt)/1000) + ' сек' : '—'],
    ['Очередь', sendQueue.length],
    ['Логин', currentUser?.login || '—'],
    ['Чатов', chats.length],
    ['Онлайн', Object.values(onlineStatus).filter(Boolean).length]
  ];
  $('diagList').innerHTML = items.map(([k, v]) => `<div class="dr"><span class="l">${k}</span><span class="v">${esc(String(v))}</span></div>`).join('');
  $('diagModal').classList.add('active');
}
function copyDiagnostics() { navigator.clipboard?.writeText($('diagList').innerText).then(() => toast('Инфо', 'Скопировано')); }

// СОЗДАНИЕ
async function createDialog() {
  const login = $('dialogLoginInput').value.trim().replace(/^@/, '');
  const err = $('dialogErr'); err.textContent = '';
  if (!login) return err.textContent = 'Введите логин';
  try { const d = await api('/api/chats', { method:'POST', body: JSON.stringify({ login }) }); closeModal('dialogModal'); await loadChats(); if (d.chatId) setTimeout(() => openChat(d.chatId), 100); }
  catch(e) { err.textContent = e.message; }
}
$('dialogLoginInput').addEventListener('keydown', e => { if (e.key === 'Enter') createDialog(); });
function openGroupCreate() { groupKind = 'group'; openGroupModal('НОВАЯ ГРУППА'); }
function openChannelCreate() { groupKind = 'channel'; openGroupModal('НОВЫЙ КАНАЛ'); }
function openGroupModal(title) {
  closeModal('createModal'); $('groupModalTitle').textContent = title;
  $('groupNameInput').value = ''; $('groupLoginInput').value = ''; $('groupMemberInput').value = '';
  $('groupErr').textContent = ''; groupDraft = []; renderGroupDraft();
  $('groupModal').classList.add('active');
}
function renderGroupDraft() {
  const el = $('groupMembersList');
  if (!groupDraft.length) { el.innerHTML = '<div style="color:var(--text3);font-size:11px;font-style:italic;padding:4px 0;text-align:center">Никого</div>'; return; }
  el.innerHTML = groupDraft.map((m, i) => `<div class="member"><div class="minfo"><div class="mtxt"><div class="mname">${esc(m.nickname)}</div><div class="mlogin">@${esc(m.login)}</div></div></div><button class="kick" data-i="${i}">✕</button></div>`).join('');
  el.querySelectorAll('.kick').forEach(b => b.onclick = () => { groupDraft.splice(+b.dataset.i, 1); renderGroupDraft(); });
}
async function addGroupMember() {
  const login = $('groupMemberInput').value.trim().replace(/^@/, '');
  const err = $('groupErr'); err.textContent = '';
  if (!login) return err.textContent = 'Введите логин';
  if (login.toLowerCase() === currentUser.login.toLowerCase()) return err.textContent = 'Это вы';
  if (groupDraft.find(m => m.login.toLowerCase() === login.toLowerCase())) return err.textContent = 'Уже добавлен';
  try {
    const r = await api(`/api/search?q=${encodeURIComponent(login)}`);
    const u = r.users.find(x => x.login.toLowerCase() === login.toLowerCase());
    if (!u) return err.textContent = 'Не найден';
    groupDraft.push({ login: u.login, nickname: u.nickname || u.login });
    $('groupMemberInput').value = ''; renderGroupDraft();
  } catch(e) { err.textContent = e.message; }
}
$('groupMemberInput').addEventListener('keydown', e => { if (e.key === 'Enter') addGroupMember(); });
async function createGroup() {
  const name = $('groupNameInput').value.trim(), login = $('groupLoginInput').value.trim();
  const err = $('groupErr'); err.textContent = '';
  if (!name) return err.textContent = 'Введите название';
  if (!login) return err.textContent = 'Введите логин группы';
  try {
    const d = await api('/api/groups', { method:'POST', body: JSON.stringify({ name, login, members: groupDraft.map(m => m.login), isChannel: groupKind === 'channel', isPrivate: false }) });
    closeModal('groupModal'); await loadChats();
    if (d.chatId) setTimeout(() => openChat(d.chatId), 100);
  } catch(e) { err.textContent = e.message; }
}
$('joinBtn').onclick = async () => {
  if (!currentChatId) return;
  try {
    await api(`/api/chats/${currentChatId}/join`, { method:'POST' });
    currentChatMeta.notMember = false;
    await loadChats();
    const chat = chats.find(c => c.id === currentChatId);
    if (chat) { currentChatMeta = chat; updateChatHeader(chat); updateJoinBar(chat); }
    messages[currentChatId] = await api(`/api/chats/${currentChatId}/messages`);
    renderMessages();
    toast('Инфо', 'Вы вступили');
  } catch(e) { toast('Ошибка', e.message); }
};

// ИНФО О ЧЕЛОВЕКЕ
async function openInfoUser(login) {
  if (!login) return;
  try {
    const user = await api(`/api/search?q=${encodeURIComponent(login)}`).then(r => r.users.find(u => u.login === login));
    if (!user) return toast('Ошибка', 'Пользователь не найден');
    const isOn = onlineStatus[login];
    $('infoUserContent').innerHTML = `
      <div class="iu-av" style="background:${avatarBg(user)};margin:0 auto 14px">${avatarInner(user)}</div>
      <div class="iu-name" style="color:${user.nicknameColor||'var(--text)'}">${esc(user.nickname)}</div>
      <div class="iu-login">@${esc(user.login)}</div>
      <div class="iu-status" style="color:${user.statusColor||'var(--text3)'}">${esc(user.statusText || statusLabel(user.status,''))}${isOn ? ' · онлайн' : ' · оффлайн'}</div>
      <div class="iu-actions" id="infoUserActions"></div>
    `;
    const actions = $('infoUserActions');
    if (currentUser.login === login) {
      actions.innerHTML = `<button class="primary" onclick="closeModal('infoUserModal');switchTab('Profile')">ПРОФИЛЬ</button>`;
    } else {
      actions.innerHTML = `<button class="primary" data-act="write">НАПИСАТЬ</button><button onclick="closeModal('infoUserModal')">ЗАКРЫТЬ</button>`;
      actions.querySelector('[data-act="write"]').onclick = async () => {
        closeModal('infoUserModal');
        try { const d = await api('/api/chats', { method:'POST', body: JSON.stringify({ login }) }); await loadChats(); if (d.chatId) setTimeout(() => openChat(d.chatId), 100); }
        catch(e) { toast('Ошибка', e.message); }
      };
    }
    $('infoUserModal').classList.add('active');
  } catch(e) { toast('Ошибка', e.message); }
}

// ИНФО О ЧАТЕ / КАНАЛЕ
async function openInfoChat(chat) {
  if (!chat || !chat.id) return;
  try {
    const info = await api(`/api/chats/${chat.id}/info`);
    const isGroup = info.type === 'group';
    const isChannel = info.isChannel;
    $('infoChatTitle').textContent = isChannel ? 'О КАНАЛЕ' : 'О ЧАТЕ';
    let membersHtml = '';
    if (isGroup) {
      const admins = info.membersInfo.filter(m => m.isAdmin || m.isOwner);
      const users = info.membersInfo.filter(m => !m.isAdmin && !m.isOwner);
      if (isChannel) {
        membersHtml = `<div style="font-size:11px;color:var(--text3);font-family:var(--font-head);font-weight:700;letter-spacing:1px;margin:8px 0 6px;padding-left:4px">АДМИНИСТРАТОРЫ</div>` + admins.map(renderMemberRow).join('');
      } else {
        membersHtml = (admins.length ? `<div style="font-size:11px;color:var(--text3);font-family:var(--font-head);font-weight:700;letter-spacing:1px;margin:8px 0 6px;padding-left:4px">АДМИНИСТРАТОРЫ</div>` + admins.map(renderMemberRow).join('') : '');
        membersHtml += (users.length ? `<div style="font-size:11px;color:var(--text3);font-family:var(--font-head);font-weight:700;letter-spacing:1px;margin:12px 0 6px;padding-left:4px">УЧАСТНИКИ</div>` + users.map(renderMemberRow).join('') : '');
      }
    } else {
      membersHtml = `<div class="member"><div class="minfo"><div class="mav" style="background:${avatarBg(info.membersInfo[1]||{})}">${avatarInner(info.membersInfo[1])}</div><div class="mtxt"><div class="mname">${esc(info.membersInfo[1]?.nickname||'???')}</div><div class="mlogin">@${esc(info.membersInfo[1]?.login||'')}</div></div></div></div>`;
    }
    $('infoChatContent').innerHTML = `
      <div style="text-align:center;margin-bottom:16px">
        <div style="font-family:var(--font-head);font-size:18px;font-weight:700;color:var(--accent);margin-bottom:4px">${esc(info.name || (isGroup ? '' : 'Диалог'))}</div>
        ${info.login ? `<div style="font-size:12px;color:var(--text3);font-weight:500">@${esc(info.login)}</div>` : ''}
        ${isGroup ? `<div style="font-size:11px;color:var(--text3);margin-top:4px;font-style:italic">${info.membersCount} участников</div>` : ''}
      </div>
      ${membersHtml}
    `;
    $('infoChatModal').classList.add('active');
  } catch(e) { toast('Ошибка', e.message); }
}
function renderMemberRow(m) {
  let tag = m.isOwner ? '<span class="mtag">OWNER</span>' : m.isAdmin ? '<span class="mtag">ADMIN</span>' : '';
  return `<div class="member" data-user="${esc(m.login)}"><div class="minfo"><div class="mav" style="background:${avatarBg(m)}">${avatarInner(m)}</div><div class="mtxt"><div class="mname">${esc(m.nickname)} ${tag}</div><div class="mlogin">@${esc(m.login)}</div></div></div></div>`;
}
document.addEventListener('click', e => {
  const row = e.target.closest('#infoChatContent .member[data-user]');
  if (row) { const login = row.dataset.user; if (login && login !== currentUser.login) { closeModal('infoChatModal'); setTimeout(() => openInfoUser(login), 150); } }
});

// НАСТРОЙКИ ГРУППЫ
let gsChatId = null;
async function openGroupSettings() {
  if (!currentChatMeta) return;
  gsChatId = currentChatMeta.id;
  try {
    const info = await api(`/api/chats/${gsChatId}/info`);
    $('gsErr').textContent = '';
    $('gsNameInput').value = info.name || '';
    $('gsLoginInput').value = info.login || '';
    $('gsAddInput').value = '';
    $('gsFlagPrivate').checked = !!info.isPrivate;
    $('gsFlagChannel').checked = !!info.isChannel;
    const canEdit = info.isAdmin;
    $('gsRowName').style.display = canEdit ? 'flex' : 'none';
    $('gsRowLogin').style.display = canEdit ? 'flex' : 'none';
    $('gsRowAdd').style.display = canEdit ? 'flex' : 'none';
    const isOwner = currentUser && info.owner === currentUser.login;
    $('gsRowPrivate').style.display = isOwner ? 'flex' : 'none';
    $('gsRowChannel').style.display = isOwner ? 'flex' : 'none';
    $('gsDeleteBtn').style.display = isOwner ? 'block' : 'none';
    $('gsLeaveBtn').style.display = (currentUser && info.owner !== currentUser.login) ? 'block' : 'none';
    $('gsMembersList').innerHTML = info.membersInfo.map(m => {
      const showKick = canEdit && !m.isOwner && m.login !== currentUser.login;
      return `<div class="member"><div class="minfo"><div class="mav" style="background:${avatarBg(m)}">${avatarInner(m)}</div><div class="mtxt"><div class="mname">${esc(m.nickname)} ${m.isOwner?'<span class="mtag">OWNER</span>':m.isAdmin?'<span class="mtag">ADMIN</span>':''}</div><div class="mlogin">@${esc(m.login)}</div></div></div>${showKick?`<button class="kick" data-login="${esc(m.login)}">ВЫГНАТЬ</button>`:''}</div>`;
    }).join('');
    $('gsMembersList').querySelectorAll('.kick').forEach(b => b.onclick = async () => {
      if (!confirm(`Удалить @${b.dataset.login}?`)) return;
      try { await api(`/api/chats/${gsChatId}/members/${encodeURIComponent(b.dataset.login)}`, { method:'DELETE' }); openGroupSettings(); loadChats(); }
      catch(e) { $('gsErr').textContent = e.message; }
    });
    $('gsFlagPrivate').onchange = $('gsFlagChannel').onchange = async () => {
      try { await api(`/api/chats/${gsChatId}/flags`, { method:'PUT', body: JSON.stringify({ isPrivate:$('gsFlagPrivate').checked, isChannel:$('gsFlagChannel').checked }) }); loadChats(); }
      catch(e) { $('gsErr').textContent = e.message; }
    };
    $('groupSettingsModal').classList.add('active');
  } catch(e) { toast('Ошибка', e.message); }
}
async function renameGroup() { const n = $('gsNameInput').value.trim(); if (!n) return; try { await api(`/api/chats/${gsChatId}/name`, { method:'PUT', body: JSON.stringify({ name: n }) }); $('gsErr').textContent = '✓'; setTimeout(()=>$('gsErr').textContent='',1500); loadChats(); } catch(e) { $('gsErr').textContent = e.message; } }
async function changeGroupLogin() { const l = $('gsLoginInput').value.trim(); if (!l) return; try { await api(`/api/chats/${gsChatId}/login`, { method:'PUT', body: JSON.stringify({ login: l }) }); $('gsErr').textContent = '✓'; setTimeout(()=>$('gsErr').textContent='',1500); loadChats(); } catch(e) { $('gsErr').textContent = e.message; } }
async function addMemberToGroup() { const login = $('gsAddInput').value.trim().replace(/^@/, ''); if (!login) return; try { await api(`/api/chats/${gsChatId}/members`, { method:'POST', body: JSON.stringify({ login }) }); $('gsAddInput').value = ''; openGroupSettings(); loadChats(); } catch(e) { $('gsErr').textContent = e.message; } }
async function leaveGroup() { if (!confirm('Покинуть?')) return; try { await api(`/api/chats/${gsChatId}/leave`, { method:'POST' }); closeModal('groupSettingsModal'); if (currentChatId === gsChatId) { $('screenChat').classList.remove('active'); currentChatId = null; } loadChats(); } catch(e) { $('gsErr').textContent = e.message; } }
async function deleteGroup() {
  if (!confirm('Удалить?')) return;
  if (!sendWS({ type:'deleteChat', payload:{ chatId: gsChatId } })) { try { await api(`/api/chats/${gsChatId}`, { method:'DELETE' }); } catch(e) { return $('gsErr').textContent = e.message; } }
  closeModal('groupSettingsModal');
  if (currentChatId === gsChatId) { $('screenChat').classList.remove('active'); currentChatId = null; }
  loadChats();
}

// КОНТЕКСТНОЕ МЕНЮ
function showChatCtx(x, y, chatId) {
  const chat = chats.find(c => c.id === chatId); if (!chat) return;
  const items = [];
  if (chat.isGroup) items.push({ label:'⚙ НАСТРОЙКИ', fn: () => { currentChatMeta = chat; openGroupSettings(); } });
  if (chat.isGroup && !chat.isAdmin) items.push({ label:'↩ ПОКИНУТЬ', danger:true, fn: async () => { if (confirm('Покинуть?')) { try { await api(`/api/chats/${chatId}/leave`, { method:'POST' }); loadChats(); } catch(e) { toast('Ошибка', e.message); } } } });
  const canDel = !chat.isGroup || chat.isAdmin;
  if (canDel) items.push({ label:'🗑 УДАЛИТЬ', danger:true, fn: () => {
    if (!confirm(chat.isGroup ? 'Удалить группу?' : 'Удалить чат?')) return;
    if (!sendWS({ type:'deleteChat', payload:{ chatId } })) api(`/api/chats/${chatId}`, { method:'DELETE' }).then(loadChats).catch(e => toast('Ошибка', e.message));
  }});
  if (!items.length) return;
  $('ctxMenu').innerHTML = items.map((it, i) => `<button data-i="${i}" class="${it.danger?'danger':''}">${it.label}</button>`).join('');
  $('ctxMenu').querySelectorAll('button').forEach(b => b.onclick = () => { hideCtx(); items[+b.dataset.i].fn(); });
  $('ctxMenu').style.left = Math.min(x, window.innerWidth - 200) + 'px';
  $('ctxMenu').style.top = Math.min(y, window.innerHeight - 200) + 'px';
  $('ctxMenu').classList.add('active');
}
function hideCtx() { $('ctxMenu').classList.remove('active'); }
document.addEventListener('click', e => { if (!$('ctxMenu').contains(e.target)) hideCtx(); });

function closeModal(id) { $(id).classList.remove('active'); }
function closeAllOverlays() { document.querySelectorAll('.ov').forEach(o => o.classList.remove('active')); }
document.querySelectorAll('.ov').forEach(o => o.addEventListener('click', e => { if (e.target === o) o.classList.remove('active'); }));

function showNotification(chatName, senderName, text, chatId) {
  if (currentChatId === chatId && document.visibilityState === 'visible') return;
  const title = chatName === senderName ? senderName : `${chatName} · ${senderName}`;
  addToast(title, text.length > 60 ? text.slice(0,58)+'…' : text, chatId);
  if (document.visibilityState === 'hidden' && 'Notification' in window && Notification.permission === 'granted') {
    try { const n = new Notification(title, { body: text.slice(0,60), icon:'/icon-192.png', tag:'krista_'+chatId }); n.onclick = () => { window.focus(); openChat(chatId); n.close(); }; } catch {}
  }
}
function addToast(title, text, chatId) {
  const el = document.createElement('div');
  el.className = 't';
  el.innerHTML = `<div class="ico">💬</div><div class="bd"><div class="tt">${esc(title)}</div><div class="tx">${esc(text)}</div></div>`;
  el.onclick = () => { closeToast(el); if (chatId) openChat(chatId); };
  $('toasts').appendChild(el);
  setTimeout(() => closeToast(el), 5000);
}
function closeToast(el) { if (!el.parentNode) return; el.classList.add('closing'); setTimeout(() => el.parentNode?.removeChild(el), 250); }
function toast(title, text) { addToast(title, text, null); }

if ('Notification' in window && Notification.permission === 'default') setTimeout(() => Notification.requestPermission().catch(()=>{}), 3000);

let audioCtx = null;
function beep() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.06, audioCtx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.15);
    o.start(); o.stop(audioCtx.currentTime + 0.16);
  } catch {}
}
$('logoBtn').onclick = openDiagnostics;

function logout() {
  token = null; localStorage.removeItem('krista_token'); localStorage.removeItem('krista_user');
  currentUser = null;
  if (ws) { try { ws.close(); } catch {} ws = null; }
  stopHeartbeat(); if (reconnectTimer) clearTimeout(reconnectTimer);
  chats = []; messages = {}; currentChatId = null; onlineStatus = {}; sendQueue = [];
  $('screenChat').classList.remove('active'); closeAllOverlays();
  showScreen('login');
  ['authLogin','authPassword','authConfirm','authNickname'].forEach(id => $(id).value = '');
  $('authError').textContent = '';
  switchAuthTab('login');
}
async function deleteAccount() {
  if (!confirm('Удалить аккаунт навсегда?')) return;
  try { await api('/api/me', { method:'DELETE' }); accounts = accounts.filter(a => a.login !== currentUser.login); saveAccList(); toast('Инфо', 'Удалён'); setTimeout(logout, 500); }
  catch(e) { toast('Ошибка', e.message); }
}

// ПРИВЯЗКА КЛАВИАТУРЫ
(function setupViewport() {
  if (!window.visualViewport) return;
  const vv = window.visualViewport;
  let raf = null;
  function update() {
    if (raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const kbHeight = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      if (kbHeight > 80) {
        app.style.height = vv.height + 'px';
        app.style.maxHeight = vv.height + 'px';
        if (currentChatId) setTimeout(() => { const a = $('messagesArea'); if (a) a.scrollTop = a.scrollHeight; }, 30);
      } else {
        app.style.height = ''; app.style.maxHeight = '';
      }
    });
  }
  vv.addEventListener('resize', update);
  vv.addEventListener('scroll', update);
  window.addEventListener('orientationchange', () => setTimeout(update, 200));
  $('msgInput').addEventListener('focus', () => setTimeout(update, 250));
  $('msgInput').addEventListener('blur', () => setTimeout(update, 250));
})();

(async function init() {
  if (!token) { showScreen('login'); return; }
  if (currentUser) { applyUserToHeader(); refreshTheme(); showScreen('main'); switchTab('Chats'); }
  else showScreen('loading');
  try {
    const me = await apiRetry('/api/me');
    currentUser = me;
    localStorage.setItem('krista_user', JSON.stringify(me));
    applyUserToHeader(); refreshTheme();
    showScreen('main'); switchTab('Chats');
    connectWS();
    await loadChats();
  } catch(e) {
    if (e.status === 401 || e.status === 404) logout();
    else if (currentUser) { showScreen('main'); connectWS(); loadChats().catch(()=>{}); }
    else showScreen('login');
  }
})();
