<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1a1020" />
<title>Криста.Мессенджер</title>
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Inter:wght@400;500;600;700&family=Unbounded:wght@400;600;700&family=Manrope:wght@400;500;600;700&family=Raleway:wght@400;600;700&family=Nunito:wght@400;600;700&family=Playfair+Display:wght@400;600;700&family=Open+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg-1:#1a1020;--bg-2:#2a1a30;
  --glass:rgba(255,255,255,.05);--glass-2:rgba(255,255,255,.09);--glass-3:rgba(255,255,255,.14);
  --glass-border:rgba(255,255,255,.14);
  --text:#f5e8f0;--text2:rgba(245,232,240,.72);--text3:rgba(245,232,240,.42);
  --accent:#f0a0c8;--accent-2:#d67aa8;--on-accent:#2a1020;
  --ok:#8ee0a8;--warn:#ffd06a;--danger:#ff8aa0;
  --font-head:'Comfortaa',sans-serif;--font-body:'Inter',sans-serif;
  --fs-scale:1;--blur:18px;--radius-scale:1;--anim:1;
  --rad:calc(16px * var(--radius-scale));
  --rad-sm:calc(10px * var(--radius-scale));
  --rad-lg:calc(22px * var(--radius-scale));
}
body.theme-light{
  --bg-1:#f5f0f5;--bg-2:#e8e0ec;
  --glass:rgba(255,255,255,.5);--glass-2:rgba(255,255,255,.65);--glass-3:rgba(255,255,255,.85);
  --glass-border:rgba(80,60,100,.15);
  --text:#2a1e30;--text2:rgba(42,30,48,.72);--text3:rgba(42,30,48,.42);
  --on-accent:#fff;
}
body.blur-off{--blur:0px}
body.anim-off *{animation-duration:0s!important;transition-duration:0s!important}
body.size-sm{--fs-scale:.9}
body.size-md{--fs-scale:1}
body.size-lg{--fs-scale:1.1}
body.shape-square{--radius-scale:.35}

html,body{height:100%;overflow:hidden;position:fixed;inset:0;width:100%;font-family:var(--font-body);font-size:calc(14px * var(--fs-scale));color:var(--text);user-select:none;-webkit-user-select:none;transition:color .3s,background .5s}
body{background:linear-gradient(135deg,var(--bg-1),var(--bg-2));background-attachment:fixed}
body::before,body::after{content:'';position:fixed;border-radius:50%;pointer-events:none;z-index:0;opacity:.32;transition:background .4s}
body::before{width:70vw;height:70vw;background:radial-gradient(circle,var(--accent),transparent 70%);top:-25vw;left:-25vw;filter:blur(60px)}
body::after{width:60vw;height:60vw;background:radial-gradient(circle,var(--accent-2),transparent 70%);bottom:-20vw;right:-20vw;filter:blur(60px)}

#app{width:100%;max-width:460px;height:100%;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden;z-index:1}

/* Офлайн-полоска */
.offline-bar{display:none;padding:4px 14px;text-align:center;font-size:10px;font-family:var(--font-head);font-weight:700;letter-spacing:2px;color:#fff;background:linear-gradient(90deg,var(--danger),#ff6a8a);flex-shrink:0}
.offline-bar.show{display:block}

/* ШАПКА — большая, с поиском и + */
.hdr{padding:14px 14px 12px;padding-top:max(14px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;flex-shrink:0;background:var(--glass-2);backdrop-filter:blur(var(--blur)) saturate(1.3);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.3);border-bottom:1px solid var(--glass-border);border-radius:0 0 var(--rad-lg) var(--rad-lg);position:relative;z-index:3}
.hdr svg{width:30px;height:30px;flex-shrink:0;cursor:pointer}
.hdr svg circle{fill:var(--accent)}
.hdr svg .c{fill:var(--bg-1)}
.hdr-title{font-family:var(--font-head);font-size:calc(20px * var(--fs-scale));font-weight:700;color:var(--accent);letter-spacing:.4px;line-height:1;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-btn{background:var(--glass-2);border:1px solid var(--glass-border);color:var(--text2);font-size:18px;width:40px;height:40px;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;transition:all .15s;line-height:1}
.hdr-btn:active{background:var(--glass-3);color:var(--accent);transform:scale(.94)}

.content{flex:1;overflow-y:auto;min-height:0;position:relative;z-index:1;padding-top:8px;overscroll-behavior:contain}
.content::-webkit-scrollbar{width:4px}
.content::-webkit-scrollbar-thumb{background:var(--glass-border);border-radius:2px}
.screen{display:none;flex-direction:column;height:100%}
.screen.active{display:flex}

.section{margin:10px 10px 6px;padding:6px 14px;font-family:var(--font-head);font-size:calc(12px * var(--fs-scale));font-weight:700;color:var(--accent);letter-spacing:1.2px;display:flex;align-items:center;gap:6px;border-radius:var(--rad-sm);background:var(--glass);backdrop-filter:blur(calc(var(--blur) * .5));-webkit-backdrop-filter:blur(calc(var(--blur) * .5))}
.section .cnt{margin-left:auto;font-size:11px;color:var(--text3);font-weight:500;letter-spacing:0}

.contact{margin:0 10px 6px;padding:10px 12px;display:flex;align-items:center;gap:10px;cursor:pointer;border-radius:var(--rad);background:var(--glass);backdrop-filter:blur(calc(var(--blur) * .8));-webkit-backdrop-filter:blur(calc(var(--blur) * .8));border:1px solid var(--glass-border);transition:background .15s,transform .1s}
.contact:active{background:var(--glass-2);transform:scale(.985)}
.contact.pinned{border-color:var(--accent);background:var(--glass-2)}
.contact.published::after{content:'🌐';position:absolute;top:6px;right:6px;font-size:11px;opacity:.7}
.av{width:40px;height:40px;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-size:16px;font-weight:700;overflow:hidden;border-radius:50%;border:1px solid var(--glass-border)}
body.shape-square .av{border-radius:12px}
.av .emoji{font-size:22px;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.av .dot{position:absolute;bottom:1px;right:1px;width:11px;height:11px;border-radius:50%;border:2px solid var(--bg-1);background:var(--text3);box-sizing:content-box}
.av .dot.on{background:var(--dot-c,var(--ok))}
.ci{flex:1;min-width:0}
.cn{font-family:var(--font-head);font-size:calc(14px * var(--fs-scale));font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:4px;align-items:baseline}
.cn .emj{font-size:14px;display:inline-block}
.cn .lg{font-size:10px;font-weight:500;color:var(--text3);flex-shrink:0;font-family:var(--font-body);margin-left:2px}
.cs{font-size:11px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:italic}
.cs.st-online{color:var(--ok)}.cs.st-away{color:var(--warn)}.cs.st-dnd{color:var(--danger)}
.cp{font-size:11px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.cp .draft{color:var(--danger);font-weight:600;font-style:italic}
.bdg{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);font-family:var(--font-head);font-size:11px;font-weight:700;padding:3px 8px;min-width:22px;text-align:center;border-radius:10px;flex-shrink:0}
.empty{color:var(--text3);text-align:center;padding:40px 20px;font-size:12px;line-height:1.6;font-style:italic}

.tabs{margin:0 10px;padding:6px;padding-bottom:max(6px,env(safe-area-inset-bottom));display:flex;gap:3px;flex-shrink:0;border-radius:var(--rad-lg) var(--rad-lg) 0 0;background:var(--glass-2);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--glass-border);border-bottom:none;position:relative;z-index:2}
.tabs button{flex:1;background:none;border:none;color:var(--text3);font-family:var(--font-body);font-size:10px;padding:8px 4px;cursor:pointer;border-radius:var(--rad-sm);line-height:1.3;transition:all .15s;font-weight:500}
.tabs button .i{font-size:18px;display:block;margin-bottom:2px;opacity:.7}
.tabs button.active{color:var(--accent);background:var(--glass-3);font-weight:600}
.tabs button.active .i{opacity:1}

/* ЧАТ — блюренный фон */
.chat-wrap{position:absolute;inset:0;z-index:10;display:none;flex-direction:column;background:var(--glass);backdrop-filter:blur(calc(var(--blur) * 1.5)) saturate(1.3);-webkit-backdrop-filter:blur(calc(var(--blur) * 1.5)) saturate(1.3)}
.chat-wrap.active{display:flex}
.chat-hdr{padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;flex-shrink:0;background:var(--glass-2);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border-bottom:1px solid var(--glass-border);border-radius:0 0 var(--rad) var(--rad);position:relative;z-index:3}
.chat-hdr .bk{background:var(--glass-2);border:1px solid var(--glass-border);color:var(--accent);font-size:18px;padding:6px 10px;border-radius:12px;cursor:pointer;flex-shrink:0;font-weight:600;line-height:1;font-family:var(--font-head)}
.chat-hdr .bk:active{background:var(--glass-3)}
.chat-hdr .av2{width:38px;height:38px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-size:16px;font-weight:700;position:relative;overflow:hidden;border-radius:50%;border:1px solid var(--glass-border)}
body.shape-square .chat-hdr .av2{border-radius:12px}
.chat-hdr .av2 .emoji{font-size:18px;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.chat-hdr .av2 .dot{position:absolute;bottom:0;right:0;width:10px;height:10px;border-radius:50%;border:2px solid var(--bg-1);background:var(--text3);box-sizing:content-box}
.chat-hdr .av2 .dot.on{background:var(--dot-c,var(--ok))}
.chat-hdr .ci2{flex:1;min-width:0;cursor:pointer}
.chat-hdr .cn2{font-family:var(--font-head);font-size:calc(14px * var(--fs-scale));font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-hdr .cn2 .emj{font-size:14px}
.chat-hdr .cs2{font-size:10px;color:var(--text3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:italic}
.chat-hdr .cs2.st-online{color:var(--ok)}.chat-hdr .cs2.st-away{color:var(--warn)}.chat-hdr .cs2.st-dnd{color:var(--danger)}
.chat-hdr .mn{background:var(--glass-2);border:1px solid var(--glass-border);color:var(--text2);font-size:18px;width:34px;height:34px;cursor:pointer;flex-shrink:0;border-radius:12px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center}
.chat-hdr .mn:active{background:var(--glass-3)}

.messages{flex:1;overflow-y:auto;padding:12px 10px 4px;min-height:0;position:relative;overscroll-behavior:contain}
.messages::-webkit-scrollbar{width:4px}
.messages::-webkit-scrollbar-thumb{background:var(--glass-border);border-radius:2px}

.scroll-down-btn{position:absolute;right:16px;bottom:120px;width:42px;height:42px;border-radius:50%;background:var(--glass-3);backdrop-filter:blur(var(--blur));border:1px solid var(--glass-border);color:var(--accent);font-size:20px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:5;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.scroll-down-btn.show{display:flex}
.scroll-down-btn .cnt{position:absolute;top:-6px;right:-6px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);font-size:10px;font-weight:700;padding:2px 6px;border-radius:8px;font-family:var(--font-head);min-width:18px;text-align:center}

.pull-indicator{position:absolute;top:0;left:50%;transform:translateX(-50%) translateY(-100%);padding:8px 16px;background:var(--glass-3);backdrop-filter:blur(var(--blur));border-radius:0 0 var(--rad) var(--rad);font-size:12px;color:var(--accent);font-weight:600;transition:transform .25s;z-index:20;pointer-events:none;border:1px solid var(--glass-border);border-top:none}
.pull-indicator.show{transform:translateX(-50%) translateY(0)}

.dsep-wrap{text-align:center;margin:14px 0 8px}
.dsep{display:inline-block;font-family:var(--font-head);font-size:11px;font-weight:600;color:var(--text2);letter-spacing:1.2px;padding:5px 12px;border-radius:12px;background:var(--glass-2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--glass-border)}

.msg{margin-bottom:6px;display:flex;gap:6px;align-items:flex-end;position:relative;transition:transform .2s}
.msg.out{flex-direction:row-reverse}
.msg.pending .bub{opacity:.6}
.msg.failed .bub{border-color:var(--danger)}
.msg.flash .bub{animation:fa 1.5s ease}
@keyframes fa{0%,50%{box-shadow:0 0 0 2px var(--accent)}100%{}}

.mav{width:26px;height:26px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-size:11px;font-weight:700;overflow:hidden;border-radius:50%;border:1px solid var(--glass-border);background:var(--glass-3);cursor:pointer}
body.shape-square .mav{border-radius:8px}
.mav:active{transform:scale(.92)}
.mav .emoji{font-size:14px;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}

.bub{background:var(--glass-3);backdrop-filter:blur(calc(var(--blur) * .8)) saturate(1.2);-webkit-backdrop-filter:blur(calc(var(--blur) * .8)) saturate(1.2);border:1px solid var(--glass-border);padding:8px 12px;max-width:78%;cursor:pointer;border-radius:var(--rad) var(--rad) var(--rad) 4px;position:relative;word-wrap:break-word;overflow-wrap:break-word;transition:transform .1s}
.bub:active{transform:scale(.98)}
.msg.out .bub{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);border-radius:var(--rad) var(--rad) 4px var(--rad);border-color:transparent}
.msg.out .bub .hd,.msg.out .bub .txt{color:var(--on-accent)}
.hd{font-size:10px;color:var(--text3);margin-bottom:3px;display:flex;gap:6px;align-items:baseline}
.hd .nm{font-weight:700;font-family:var(--font-head);font-size:calc(12px * var(--fs-scale));letter-spacing:.2px;cursor:pointer;display:inline-flex;gap:3px;align-items:center}
.hd .nm:active{opacity:.7}
.hd .nm .emj{font-size:12px}
.msg.out .hd .nm{color:var(--on-accent)}
.txt{font-size:calc(13px * var(--fs-scale));line-height:1.45;word-break:break-word;white-space:pre-wrap;color:var(--text)}
.txt .link{color:var(--accent);text-decoration:underline;cursor:pointer;word-break:break-all;font-weight:500}
.msg.out .txt .link{color:var(--on-accent)}
.txt .mention{color:var(--accent);font-weight:600;background:var(--glass-3);padding:1px 5px;border-radius:6px}
.edt{font-size:10px;color:var(--text3);font-style:italic;margin-left:4px}
.msg.out .edt{color:rgba(255,255,255,.6)}
.rq{background:var(--glass-2);border-left:2px solid var(--accent);padding:4px 8px;margin-bottom:5px;font-size:11px;color:var(--text2);display:flex;gap:6px;cursor:pointer;border-radius:8px}
.msg.out .rq{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.5);color:var(--on-accent)}
.rq .jm{color:var(--accent);font-size:10px;margin-left:auto;font-weight:600}
.msg.out .rq .jm{color:var(--on-accent);text-decoration:underline}
.rxs{margin-top:5px;display:flex;gap:4px;flex-wrap:wrap}
.rxs .rx{background:var(--glass-3);border:1px solid var(--glass-border);padding:2px 8px;font-size:12px;color:var(--text2);cursor:pointer;display:flex;gap:3px;border-radius:10px;transition:transform .1s}
.rxs .rx:active{transform:scale(.94)}
.rxs .rx.mine{border-color:var(--accent);color:var(--accent);background:var(--glass-3)}
.msg.out .rxs .rx{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.3);color:var(--on-accent)}
.msg.out .rxs .rx.mine{background:rgba(255,255,255,.3);border-color:var(--on-accent);color:var(--on-accent)}
.stt{font-size:10px;margin-left:4px;font-family:var(--font-head);font-weight:600;opacity:.7}
.msg.failed .stt{color:var(--danger);cursor:pointer;text-decoration:underline;opacity:1}
.fav{position:absolute;top:-4px;right:-4px;font-size:14px;z-index:2}

.typing{min-height:16px;padding:2px 14px 4px;font-size:11px;color:var(--accent);font-style:italic;flex-shrink:0;opacity:0;transition:opacity .2s;font-weight:500}
.typing.vis{opacity:1}
.typing .dots::after{content:'';animation:td 1.4s steps(4,end) infinite}
@keyframes td{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}

.ib{margin:0 10px 10px;padding:6px;display:flex;align-items:center;gap:6px;flex-shrink:0;border-radius:var(--rad);background:var(--glass-2);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--glass-border)}
.ib .icn{background:var(--glass-2);border:1px solid var(--glass-border);color:var(--text2);font-size:16px;width:34px;height:34px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;border-radius:50%;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;transition:background .15s}
.ib .icn:active,.ib .icn.active{background:var(--glass-3);border-color:var(--accent)}
.ib input{flex:1;background:transparent;border:none;color:var(--text);font-family:var(--font-body);font-size:calc(13px * var(--fs-scale));padding:8px 4px;outline:none;min-width:0;caret-color:var(--accent)}
.ib input::placeholder{color:var(--text3)}
.ib .snd{background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none;color:var(--on-accent);font-family:var(--font-head);font-weight:700;font-size:13px;padding:0 14px;height:34px;cursor:pointer;letter-spacing:.5px;flex-shrink:0;border-radius:17px;transition:transform .1s}
.ib .snd:active{transform:scale(.94)}

.emoji-panel{display:none;margin:0 10px 6px;background:var(--glass-2);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--glass-border);padding:8px;flex-shrink:0;max-height:180px;overflow-y:auto;border-radius:var(--rad)}
.emoji-panel.active{display:block}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.emoji-grid button{background:var(--glass);border:1px solid transparent;font-size:18px;padding:6px 0;cursor:pointer;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;line-height:1;border-radius:10px;transition:background .15s}
.emoji-grid button:active{background:var(--glass-3);border-color:var(--accent)}

.join-bar{margin:0 10px 10px;padding:12px;display:flex;align-items:center;justify-content:center;gap:12px;flex-shrink:0;border-radius:var(--rad);background:var(--glass-2);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--glass-border)}
.join-bar .info{font-size:12px;color:var(--text3);font-style:italic}
.join-bar button{background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none;color:var(--on-accent);font-family:var(--font-head);font-weight:700;font-size:13px;padding:9px 22px;cursor:pointer;letter-spacing:.5px;border-radius:14px}

/* МОДАЛКИ */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);align-items:center;justify-content:center;z-index:100;padding:20px;animation:fade .25s ease}
.ov.active{display:flex}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mod{width:100%;max-width:400px;max-height:88vh;overflow-y:auto;padding:22px 18px 18px;border-radius:var(--rad-lg);background:var(--glass-3);backdrop-filter:blur(calc(var(--blur) * 1.5)) saturate(1.4);-webkit-backdrop-filter:blur(calc(var(--blur) * 1.5)) saturate(1.4);border:1px solid var(--glass-border);box-shadow:0 20px 60px rgba(0,0,0,.4);position:relative;animation:scale .25s ease}
@keyframes scale{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.mod h3{font-family:var(--font-head);font-size:calc(16px * var(--fs-scale));font-weight:700;color:var(--accent);letter-spacing:.5px;margin-bottom:16px;text-align:center;padding-bottom:10px;border-bottom:1px solid var(--glass-border)}
.mod input,.mod textarea{width:100%;background:var(--glass-2);border:1px solid var(--glass-border);color:var(--text);font-family:var(--font-body);font-size:13px;padding:10px 14px;outline:none;margin-bottom:8px;caret-color:var(--accent);resize:none;border-radius:14px;transition:border-color .15s}

const IDB_NAME = 'krista_cache', IDB_VER = 2;
let db = null;
function openIDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, IDB_VER);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv', { keyPath: 'k' });
      if (!d.objectStoreNames.contains('messages')) d.createObjectStore('messages', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('chats')) d.createObjectStore('chats', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('outbox')) d.createObjectStore('outbox', { keyPath: 'clientId' });
      if (!d.objectStoreNames.contains('drafts')) d.createObjectStore('drafts', { keyPath: 'chatId' });
      if (!d.objectStoreNames.contains('favorites')) d.createObjectStore('favorites', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('search_history')) d.createObjectStore('search_history', { keyPath: 'q' });
      if (!d.objectStoreNames.contains('muted')) d.createObjectStore('muted', { keyPath: 'chatId' });
    };
    req.onsuccess = () => { db = req.result; resolve(db); };
    req.onerror = () => reject(req.error);
  });
}
const idb = {
  put: (store, v) => new Promise(res => { if (!db) return res(); const tx = db.transaction(store, 'readwrite'); tx.objectStore(store).put(v); tx.oncomplete = res; tx.onerror = res; }),
  get: (store, k) => new Promise(res => { if (!db) return res(null); const tx = db.transaction(store, 'readonly'); const r = tx.objectStore(store).get(k); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); }),
  all: (store) => new Promise(res => { if (!db) return res([]); const tx = db.transaction(store, 'readonly'); const r = tx.objectStore(store).getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => res([]); }),
  del: (store, k) => new Promise(res => { if (!db) return res(); const tx = db.transaction(store, 'readwrite'); tx.objectStore(store).delete(k); tx.oncomplete = res; tx.onerror = res; }),
  clear: (store) => new Promise(res => { if (!db) return res(); const tx = db.transaction(store, 'readwrite'); tx.objectStore(store).clear(); tx.oncomplete = res; tx.onerror = res; })
};

function applyUI() {

  if (ui.size === 'lg') document.body.classList.add('size-lg');

  if (ui.avatarShape === 'rounded') document.body.classList.add('shape-square');
  document.body.style.setProperty('--accent', ui.accentColor);
  document.body.style.setProperty('--accent-2', shade(ui.accentColor, -25));
  document.body.style.setProperty('--blur', ui.blur + 'px');
  const f = FONTS[ui.font] || FONTS.classic;
  document.body.style.setProperty('--font-head', `'${f.head}',sans-serif`);
  document.body.style.setProperty('--font-body', `'${f.body}',sans-serif`);
  const bg1 = getComputedStyle(document.body).getPropertyValue('--bg-1').trim();
  const bg2 = getComputedStyle(document.body).getPropertyValue('--bg-2').trim();
  let bgStyle = '';
  switch (ui.gradient) {
    case 'linear': bgStyle = `linear-gradient(135deg,${bg1},${bg2})`; break;
    case 'radial': bgStyle = `radial-gradient(circle at center,${bg2} 0%,${bg1} 80%)`; break;
    case 'corner': bgStyle = `radial-gradient(circle at 0% 0%,${bg2} 0%,${bg1} 70%)`; break;
    case 'diag': bgStyle = `linear-gradient(45deg,${bg1} 0%,${bg2} 50%,${bg1} 100%)`; break;
    case 'conic': bgStyle = `conic-gradient(from 180deg,${bg1},${bg2},${bg1})`; break;
    case 'flat': bgStyle = bg1; break;
  }
  document.body.style.background = bgStyle;
  document.body.style.backgroundAttachment = 'fixed';
}
function shade(hex, pct) { try { const n = parseInt(hex.replace('#',''),16); const r = Math.max(0,Math.min(255,(n>>16)+pct)); const g = Math.max(0,Math.min(255,((n>>8)&0xff)+pct)); const b = Math.max(0,Math.min(255,(n&0xff)+pct)); return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0'); } catch { return hex; } }

async function api(url, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (token) headers.Authorization = 'Bearer ' + token;
  const res = await fetch(url, { ...opts, headers });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(data.error || 'server_error'); e.status = res.status; e.code = data.error; e.extra = data.login || data.hours; throw e; }
  return data;
}
async function apiRetry(url, opts = {}, n = 3) {
  let last;
  for (let i = 0; i < n; i++) { try { return await api(url, opts); } catch (e) { last = e; if (e.status === 401 || e.status === 403 || e.status === 404) throw e; await new Promise(r => setTimeout(r, 1500)); } }
  throw last;
}

function connectWS() {
  if (!isOnline) return;
  if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;
  try { if (ws) ws.close(); } catch {}
  wsState = 'connecting';
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    ws.send(JSON.stringify({ type:'auth', payload:{ token } }));
    lastPongAt = Date.now();
    try { ws.send(JSON.stringify({ type:'ping' })); } catch {}
    wsState = 'online'; startHeartbeat(); flushQueue(); flushOutbox();
  };
  ws.onmessage = e => { try { const d = JSON.parse(e.data); if (d.type === 'pong') { lastPongAt = Date.now(); return; } if (d.type === 'ping') { try { ws.send(JSON.stringify({ type:'pong' })); } catch {} return; } handleWS(d); } catch {} };
  ws.onclose = () => { ws = null; stopHeartbeat(); wsState = 'offline'; if (token) { if (reconnectTimer) clearTimeout(reconnectTimer); wsState = 'connecting'; reconnectTimer = setTimeout(connectWS, 2000); } };
  ws.onerror = () => {};
}
function startHeartbeat() {
  stopHeartbeat();
  pingInt = setInterval(() => { if (ws?.readyState === 1) try { ws.send(JSON.stringify({ type:'ping' })); } catch {} }, 10000);
  wdInt = setInterval(() => { if (ws?.readyState === 1 && Date.now() - lastPongAt > 25000) try { ws.close(); } catch {} }, 5000);
}
function stopHeartbeat() { if (pingInt) clearInterval(pingInt), pingInt = null; if (wdInt) clearInterval(wdInt), wdInt = null; }
function flushQueue() { if (!sendQueue.length || !ws || ws.readyState !== 1) return; const q = [...sendQueue]; sendQueue = []; q.forEach(p => { try { ws.send(JSON.stringify({ type:'newMessage', payload: p })); } catch { sendQueue.push(p); } }); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && token) { if (!ws || ws.readyState !== 1) connectWS(); else try { ws.send(JSON.stringify({ type:'ping' })); } catch {} } });

async function handleWS(data) {
  const { type, payload } = data;
  if (type === 'newMessage') {
    if (!messages[payload.chatId]) messages[payload.chatId] = [];
    if (messages[payload.chatId].some(m => m.id === payload.id || (payload.clientId && m.clientId === payload.clientId))) {
      const i = messages[payload.chatId].findIndex(m => m.clientId && m.clientId === payload.clientId);
      if (i !== -1) messages[payload.chatId][i] = payload;
      if (currentChatId === payload.chatId) renderMessages();
      await idb.put('messages', payload);
      if (payload.clientId) await idb.del('outbox', payload.clientId);
      return;
    }
    messages[payload.chatId].push(payload);
    await idb.put('messages', payload);
    if (payload.clientId) await idb.del('outbox', payload.clientId);
    if (currentChatId === payload.chatId) {
      const mEl = $('messagesArea');
      const atBottom = mEl.scrollHeight - mEl.scrollTop - mEl.clientHeight < 100;
      renderMessages();
      if (!atBottom && payload.sender !== currentUser.login) {
        unreadBelow++;
        const b = $('scrollDownBtn');
        b.classList.add('show');
        $('scrollDownCnt').textContent = unreadBelow;
      }
    }
    if (payload.sender !== currentUser.login) {
      const muted = await idb.get('muted', payload.chatId);
      if (!muted) {
        const chat = chats.find(c => c.id === payload.chatId);
        showNotification(chat?.name || t('new_message_from'), payload.senderName, payload.text, payload.chatId);
        beep();
      }
    }
    loadChats();
  } else if (type === 'messageAck') {
    if (payload.clientId && messages[currentChatId]) {
      const i = messages[currentChatId].findIndex(m => m.clientId === payload.clientId);
      if (i !== -1) { messages[currentChatId][i].pending = false; messages[currentChatId][i].id = payload.id; renderMessages(); }
    }
    await idb.del('outbox', payload.clientId);
  } else if (type === 'messageEdited' || type === 'messageReaction') {
    if (messages[payload.chatId]) { const i = messages[payload.chatId].findIndex(m => m.id === payload.id); if (i !== -1) { messages[payload.chatId][i] = payload; if (currentChatId === payload.chatId) renderMessages(); } }
    await idb.put('messages', payload);
  } else if (type === 'deleteMessage') {
    if (messages[payload.chatId]) { const i = messages[payload.chatId].findIndex(m => m.id === payload.messageId); if (i !== -1) messages[payload.chatId][i].deleted = 1; if (currentChatId === payload.chatId) renderMessages(); }
    loadChats();
  } else if (type === 'chatDeleted') {
    chats = chats.filter(c => c.id !== payload.chatId);
    delete messages[payload.chatId];
    await idb.del('chats', payload.chatId);
    if (currentChatId === payload.chatId) { currentChatId = null; $('screenChat').classList.remove('active'); }
    renderChats();
  } else if (type === 'status') {
    onlineStatus[payload.login] = payload.status === 'online';
    renderChats(); if (currentChatMeta && !currentChatMeta.isGroup) updateChatHeader(currentChatMeta);
  } else if (type === 'userUpdated') {
    if (currentChatMeta?.otherLogin === payload.login) { currentChatMeta.otherUser = payload; updateChatHeader(currentChatMeta); }
    renderChats();
  } else if (type === 'typing') {
    if (payload.chatId === currentChatId) showTyping(`${payload.nickname} ${t('typing')}`);
  } else if (['chatCreated','chatRenamed','memberAdded','memberRemoved'].includes(type)) {
    loadChats();
  } else if (type === 'error') {
    if (payload?.clientId) { const arr = messages[currentChatId]; if (arr) { const i = arr.findIndex(m => m.clientId === payload.clientId); if (i !== -1) { arr[i].pending = false; arr[i].failed = true; renderMessages(); } } }
    toast('', errText(typeof payload === 'object' ? payload.error : payload));
  }
}

// ============================================================
//  Загрузка чатов
// ============================================================
async function loadChats() {
  try { const cached = await idb.all('chats'); if (cached.length && !chats.length) { chats = cached; renderChats(); } } catch {}
  if (!isOnline) return;
  try {
    chats = await apiRetry('/api/chats');
    await idb.clear('chats');
    for (const c of chats) await idb.put('chats', c);
    renderChats();
  } catch (e) {
    if (e.status === 401) logout();
    else if (!chats.length) $('chatListContainer').innerHTML = `<div class="empty">${t('error_loading')}</div>`;
  }
}

function renderChats() {
  if (!chats.length) { $('chatListContainer').innerHTML = `<div class="empty">${t('no_chats')}<br>${t('no_chats_hint')}</div>`; return; }
  const pinned = chats.filter(c => c.pinned);
  const dialogs = chats.filter(c => !c.isGroup && !c.pinned);
  const groups = chats.filter(c => c.isGroup && !c.pinned);
  const onlines = dialogs.filter(c => c.online || onlineStatus[c.otherLogin]);
  const offlines = dialogs.filter(c => !(c.online || onlineStatus[c.otherLogin]));
  let html = '';
  if (pinned.length) html += `<div class="section">📌 ${t('section_pinned')}<span class="cnt">${pinned.length}</span></div>` + pinned.map(renderContact).join('');
  if (onlines.length) html += `<div class="section">● ${t('section_online')}<span class="cnt">${onlines.length}</span></div>` + onlines.map(renderContact).join('');
  if (offlines.length) html += `<div class="section">○ ${t('section_offline')}<span class="cnt">${offlines.length}</span></div>` + offlines.map(renderContact).join('');
  if (groups.length) html += `<div class="section"># ${t('section_groups')}<span class="cnt">${groups.length}</span></div>` + groups.map(renderContact).join('');
  $('chatListContainer').innerHTML = html;
  $('chatListContainer').querySelectorAll('.contact').forEach(el => {
    const id = el.dataset.id;
    el.addEventListener('click', () => openChat(id));
    el.addEventListener('contextmenu', e => { e.preventDefault(); showChatCtx(e.clientX, e.clientY, id); });
    let touchT;
    el.addEventListener('touchstart', e => { touchT = setTimeout(() => { const p = e.touches[0]; showChatCtx(p.clientX, p.clientY, id); }, 550); });
    el.addEventListener('touchend', () => clearTimeout(touchT));
    el.addEventListener('touchmove', () => clearTimeout(touchT));
  });
  // Обновить черновики
  refreshDrafts();
}
async function refreshDrafts() {
  const drafts = await idb.all('drafts');
  for (const d of drafts) {
    if (!d.text || !d.text.trim()) continue;
    const item = $('chatListContainer').querySelector(`.contact[data-id="${d.chatId}"]`);
    if (item) {
      const cp = item.querySelector('.cp');
      if (cp) cp.innerHTML = `<span class="draft">${t('draft')}: ${esc(d.text.slice(0,30))}</span>`;
    }
  }
}

function renderContact(c) {
  const isOn = c.isGroup ? false : (c.online || onlineStatus[c.otherLogin] || false);
  const u = c.isGroup ? null : c.otherUser;
  const initial = c.isGroup ? '#' : (u?.nickname || u?.login || '?')[0].toUpperCase();
  const isE = u?.avatarType === 'emoji' && u.avatarEmoji;
  const avInner = isE ? `<span class="emoji">${esc(u.avatarEmoji)}</span>` : `<span style="color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3)">${esc(initial)}</span>`;
  const dot = c.isGroup ? '' : statusDot(u, isOn);
  const nameColor = u?.nicknameColor || 'var(--text)';
  const statusColor = u?.statusColor || 'var(--text3)';
  const statusText = c.isGroup ? c.subtitle : (u?.statusText || statusLabel(u?.status, ''));
  let preview = '';
  if (c.lastMessage) { const m = c.lastMessage; const tx = m.text.length > 40 ? m.text.slice(0,38) + '…' : m.text; preview = `<div class="cp">${esc(m.senderName)}: ${esc(tx)}</div>`; }
  const badge = c.unreadCount > 0 ? `<div class="bdg">${c.unreadCount}</div>` : '';
  const loginLabel = c.isGroup ? (c.login ? '@' + c.login : '') : '@' + (c.otherLogin || '');
  const avBg = c.isGroup ? 'background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff' : 'background:' + avatarBg(u);
  const cls = 'contact' + (c.pinned ? ' pinned' : '') + (c.published ? ' published' : '');
  return `<div class="${cls}" data-id="${c.id}">
    <div class="av" style="${avBg}">${avInner}${dot}</div>
    <div class="ci"><div class="cn" style="color:${nameColor}">${c.isGroup ? '' : (u?.nicknameEmoji ? `<span class="emj" style="color:${u.nicknameEmojiColor||ui.accentColor}">${esc(u.nicknameEmoji)}</span>` : '')}${esc(c.name)} <span class="lg">${esc(loginLabel)}</span></div><div class="cs ${statusClass(u?.status)}" style="color:${statusColor}">${esc(statusText)}</div>${preview}</div>
    ${badge}</div>`;
}

// ============================================================
//  Открытие чата
// ============================================================
async function openChat(chatId) {
  currentChatId = chatId;
  const chat = chats.find(c => c.id === chatId);
  if (!chat) { toast('', t('chat_not_found')); return; }
  currentChatMeta = chat;
  updateChatHeader(chat);
  updateJoinBar(chat);
  $('screenChat').classList.add('active');
  $('emojiPanel').classList.remove('active');
  $('emojiToggle').classList.remove('active');
  replyToMsg = null;
  // Черновик
  const draft = await idb.get('drafts', chatId);
  $('msgInput').value = draft?.text || '';
  replyToMsg = draft?.replyTo || null;
  if (replyToMsg) $('msgInput').placeholder = '↪ _';
  hideTyping();
  unreadBelow = 0; $('scrollDownBtn').classList.remove('show');
  const cached = (await idb.all('messages')).filter(m => m.chatId === chatId).sort((a,b) => new Date(a.timestamp) - new Date(b.timestamp));
  if (cached.length) { messages[chatId] = cached; renderMessages(); }
  else $('messagesArea').innerHTML = `<div class="empty">${t('loading_msgs')}</div>`;
  if (!isOnline) return;
  try {
    const fresh = await apiRetry(`/api/chats/${chatId}/messages`);
    const pending = (messages[chatId] || []).filter(m => m.pending || m.failed);
    messages[chatId] = [...fresh, ...pending];
    for (const m of fresh) await idb.put('messages', m);
    renderMessages();
  } catch (e) { if (!messages[chatId]) $('messagesArea').innerHTML = `<div class="empty">${t('error_loading')}</div>`; }
}

function updateChatHeader(chat) {
  if (!chat) return;
  const isG = chat.isGroup;
  $('chatName').innerHTML = (chat.name || '—').toUpperCase();
  const color = isG ? 'var(--accent)' : (chat.otherUser?.nicknameColor || 'var(--text)');
  $('chatName').style.color = color;
  if (isG) {
    $('chatSub').textContent = `${chat.membersCount} ${t('members_short')}${chat.isChannel ? ' · ' + t('gs_channel').toLowerCase() : ''} · @${chat.login || ''}`;
    $('chatSub').className = 'cs2';
  } else {
    const u = chat.otherUser;
    const st = u?.statusText || statusLabel(u?.status, '');
    const emj = u?.nicknameEmoji ? `<span class="emj" style="color:${u.nicknameEmojiColor||ui.accentColor}">${esc(u.nicknameEmoji)}</span>` : '';
    $('chatName').innerHTML = emj + (chat.name || '—').toUpperCase();
    $('chatSub').textContent = `@${chat.otherLogin} · ${st}`;
    $('chatSub').className = 'cs2 ' + statusClass(u?.status);
  }
  const av = $('chatAvatar');
  if (isG) { av.innerHTML = `<span style="color:#fff">#</span>`; av.style.background = 'linear-gradient(135deg,var(--accent),var(--accent-2))'; }
  else { const u = chat.otherUser; av.innerHTML = avatarInner(u) + statusDot(u, chat.online || onlineStatus[chat.otherLogin]); av.style.background = avatarBg(u); }
}
function updateJoinBar(chat) {
  if (!chat) return;
  const notM = chat.notMember === true;
  const isCh = chat.isChannel, isAdm = chat.isAdmin;
  if (notM) { $('inputBar').style.display = 'none'; $('emojiPanel').classList.remove('active'); $('joinBar').style.display = 'flex'; $('joinInfo').textContent = chat.isPrivate ? t('err_private_chat') : `${chat.membersCount} ${t('participants')}`; $('joinBtn').style.display = chat.isPrivate ? 'none' : 'inline-block'; }
  else if (isCh && !isAdm) { $('inputBar').style.display = 'none'; $('joinBar').style.display = 'flex'; $('joinInfo').textContent = t('err_channel_readonly'); $('joinBtn').style.display = 'none'; }
  else { $('inputBar').style.display = 'flex'; $('joinBar').style.display = 'none'; }
}
$('backBtn').onclick = async () => {
  // Сохранить черновик
  const txt = $('msgInput').value.trim();
  if (currentChatId) {
    if (txt) await idb.put('drafts', { chatId: currentChatId, text: txt, replyTo: replyToMsg });
    else await idb.del('drafts', currentChatId);
  }
  $('screenChat').classList.remove('active'); currentChatId = null; currentChatMeta = null; loadChats();
};
$('chatHeaderInfo').onclick = () => { if (currentChatMeta) openInfoChat(currentChatMeta); };
$('chatMenuBtn').onclick = e => { e.stopPropagation(); const r = e.target.getBoundingClientRect(); showChatCtx(r.left - 100, r.bottom + 6, currentChatId); };

// ============================================================
//  Сообщения
// ============================================================
function renderMessages() {
  const arr = messages[currentChatId] || [];
  if (!arr.length) { $('messagesArea').innerHTML = `<div class="empty">${t('no_messages')}</div>`; return; }
  let html = '', lastDate = null;
  for (const m of arr) {
    if (m.deleted) continue;
    const d = fDate(m.timestamp);
    if (d !== lastDate) { html += `<div class="dsep-wrap"><span class="dsep">${esc(d.toUpperCase())}</span></div>`; lastDate = d; }
    html += renderMsg(m, arr);
  }
  $('messagesArea').innerHTML = html;
  $('messagesArea').scrollTop = $('messagesArea').scrollHeight;
  bindMsgEvents(arr);
}
function renderMsg(m, arr) {
  const isOut = m.sender === currentUser.login;
  let replyHtml = '';
  if (m.replyTo) {
    const p = arr.find(x => x.id === m.replyTo);
    if (p && !p.deleted) { const short = p.text.length > 22 ? p.text.slice(0,20) + '…' : p.text; replyHtml = `<div class="rq" data-jump="${p.id}">↪ ${esc(p.senderName)}: ${esc(short)} <span class="jm">→</span></div>`; }
    else replyHtml = `<div class="rq">↪ [—]</div>`;
  }
  let txt = esc(m.text);
  txt = txt.replace(/(https?:\/\/[^\s]+|www\.[^\s]+)/gi, match => { const url = match.startsWith('www.') ? 'http://' + match : match; return `<span class="link" data-url="${esc(url)}">${esc(match)}</span>`; });
  txt = txt.replace(/@([a-zA-Z0-9_-]{3,32})/g, (_, name) => `<span class="mention">@${esc(name)}</span>`);
  const edited = m.editedAt ? `<span class="edt">(изм.)</span>` : '';
  let state = '';
  if (m.pending) state = '<span class="stt">⏳</span>';
  else if (m.failed) state = `<span class="stt" data-retry="${m.clientId}">↻</span>`;
  let rxs = '';
  const rlist = m.reactions || [];
  if (rlist.length) rxs = '<div class="rxs">' + rlist.map(r => { const mine = r.logins.includes(currentUser.login); return `<span class="rx ${mine?'mine':''}" data-react="${esc(r.emoji)}" data-msg="${m.id}">${r.emoji} ${r.logins.length}</span>`; }).join('') + '</div>';
  const msgId = m.id || m.clientId;
  const senderColor = isOut ? 'var(--on-accent)' : 'var(--accent)';
  const avInner = isOut ? avatarInner(currentUser) : `<span>${esc((m.senderName || '?')[0].toUpperCase())}</span>`;
  const avStyle = isOut ? `background:${avatarBg(currentUser)}` : '';
  const senderEmj = !isOut && m.senderEmoji ? `<span class="emj" style="color:${m.senderEmojiColor||ui.accentColor}">${esc(m.senderEmoji)}</span>` : '';
  return `<div class="msg ${isOut?'out':''} ${m.pending?'pending':''} ${m.failed?'failed':''}" data-id="${msgId}" data-client="${m.clientId||''}" data-sender="${m.sender}">
    <div class="mav" data-user="${m.sender}" style="${avStyle}">${avInner}</div>
    <div class="bub"><div class="hd"><span class="nm" data-user="${m.sender}" style="color:${senderColor}">${senderEmj}${esc(m.senderName)}</span><span>${fTime(m.timestamp)}</span>${edited}</div>${replyHtml}<div class="txt">${txt}${state}</div>${rxs}</div></div>`;
}
function bindMsgEvents(arr) {
  $('messagesArea').querySelectorAll('.rq[data-jump]').forEach(el => el.addEventListener('click', e => { e.stopPropagation(); const tEl = $('messagesArea').querySelector(`.msg[data-id="${el.dataset.jump}"]`); if (tEl) { tEl.scrollIntoView({ behavior:'smooth', block:'center' }); tEl.classList.add('flash'); setTimeout(() => tEl.classList.remove('flash'), 1500); } }));
  $('messagesArea').querySelectorAll('.link').forEach(el => el.addEventListener('click', e => { e.stopPropagation(); window.open(el.dataset.url, '_blank', 'noopener'); }));
  $('messagesArea').querySelectorAll('[data-retry]').forEach(el => el.addEventListener('click', e => { e.stopPropagation(); retryMsg(el.dataset.retry); }));
  $('messagesArea').querySelectorAll('.rx').forEach(el => el.addEventListener('click', e => { e.stopPropagation(); toggleReaction(el.dataset.msg, el.dataset.react); }));
  $('messagesArea').querySelectorAll('[data-user]').forEach(el => { if (el.classList.contains('msg')) return; el.addEventListener('click', e => { e.stopPropagation(); const login = el.dataset.user; if (login) openInfoUser(login); }); });
  $('messagesArea').querySelectorAll('.msg').forEach(el => {
    let t = null, moved = false, startX = 0;
    el.addEventListener('touchstart', e => { moved = false; startX = e.touches[0].clientX; t = setTimeout(() => { if (!moved) showMsgActions(el); }, 450); }, { passive:true });
    el.addEventListener('touchmove', e => {
      const dx = e.touches[0].clientX - startX;
      if (Math.abs(dx) > 8) { moved = true; if (t) clearTimeout(t); }
      if (dx > 40 && Math.abs(dx) < 120) { el.style.transform = `translateX(${Math.min(dx, 60)}px)`; }
    });
    el.addEventListener('touchend', e => {
      if (t) clearTimeout(t);
      el.style.transform = '';
      const dx = (e.changedTouches[0]?.clientX || 0) - startX;
      if (dx > 60) { const m = arr.find(x => (x.id === el.dataset.id) || (x.clientId === el.dataset.id)); if (m) { replyToMsg = m.id; $('msgInput').placeholder = `↪ ${m.senderName}: _`; $('msgInput').focus(); } }
    });
    el.addEventListener('contextmenu', e => { e.preventDefault(); showMsgActions(el); });
    el.addEventListener('click', e => { if (e.target.closest('.link') || e.target.closest('.jm') || e.target.closest('.rx') || e.target.closest('[data-retry]') || e.target.closest('[data-user]')) return; showMsgActions(el); });
  });
}
async function showMsgActions(el) {
  const msgId = el.dataset.id, sender = el.dataset.sender;
  const arr = messages[currentChatId] || [];
  const m = arr.find(x => x.id === msgId || x.clientId === msgId);
  if (!m) return;
  const isMine = sender === currentUser.login;
  const isAdmin = currentChatMeta?.isAdmin;
  const canDel = isMine || isAdmin;
  const canEdit = isMine && m.id && (!m.editedAt || Date.now() - new Date(m.timestamp).getTime() < 5 * 86400000);
  const rxRow = $('rxRow'); rxRow.innerHTML = '';
  REACTIONS.forEach(r => { const b = document.createElement('button'); b.className = 'rx-btn'; b.textContent = r; b.onclick = e => { e.stopPropagation(); toggleReaction(m.id, r); hideMsgActions(); }; rxRow.appendChild(b); });
  const actRow = $('actRow'); actRow.innerHTML = '';
  const add = (label, cls, fn) => { const b = document.createElement('button'); b.className = 'act-btn' + (cls ? ' ' + cls : ''); b.textContent = label; b.onclick = e => { e.stopPropagation(); fn(); hideMsgActions(); }; actRow.appendChild(b); };
  add('📋','',()=>navigator.clipboard?.writeText(m.text).then(()=>toast('',t('info_copied'))));
  add('↩','',()=>{ replyToMsg = m.id; $('msgInput').placeholder = `↪ ${m.senderName}: _`; $('msgInput').focus(); });
  const fav = await idb.get('favorites', m.id);
  add(fav ? '★' : '☆','',async()=>{ if (fav) { await idb.del('favorites', m.id); toast('',t('fav_removed')); } else { await idb.put('favorites', { ...m, savedAt: new Date().toISOString() }); toast('',t('fav_added')); } });
  if (canEdit) add('✏','',()=>openEdit(m));
  if (canDel) add('🗑','danger',()=>{ if (confirm(t('confirm_delete'))) sendWS({ type:'deleteMessage', payload:{ messageId: m.id } }); });
  const rect = el.getBoundingClientRect();
  $('msgActions').classList.add('active');
  const w = $('msgActions').offsetWidth || 210, h = $('msgActions').offsetHeight || 100;
  let left = rect.left + rect.width / 2 - w / 2, top = rect.top - h - 8;
  if (left < 8) left = 8; if (left + w > window.innerWidth - 8) left = window.innerWidth - w - 8; if (top < 8) top = rect.bottom + 8;
  $('msgActions').style.left = left + 'px'; $('msgActions').style.top = top + 'px';
}
function hideMsgActions() { $('msgActions').classList.remove('active'); }
document.addEventListener('click', e => { if (!$('msgActions').contains(e.target)) hideMsgActions(); });
function toggleReaction(msgId, emoji) { sendWS({ type:'toggleReaction', payload:{ messageId: msgId, emoji } }); }
function sendWS(obj) { if (ws && ws.readyState === 1) try { ws.send(JSON.stringify(obj)); return true; } catch {} return false; }

$('msgInput').addEventListener('input', async () => {
  const now = Date.now();
  if (now - lastTypingSent > 1500 && currentChatId) { lastTypingSent = now; sendWS({ type:'typing', payload:{ chatId: currentChatId } }); }
  // Автосохранение черновика
  if (currentChatId) {
    const txt = $('msgInput').value;
    if (txt.trim()) await idb.put('drafts', { chatId: currentChatId, text: txt, replyTo: replyToMsg });
    else await idb.del('drafts', currentChatId);
  }
});
$('msgInput').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); } });

async function sendMsg() {
  const text = $('msgInput').value.trim();
  if (!text || !currentChatId || !currentUser) return;
  const clientId = 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
  const opt = { id: null, clientId, chatId: currentChatId, sender: currentUser.login, senderName: currentUser.nickname || currentUser.login, text, timestamp: new Date().toISOString(), replyTo: replyToMsg || null, deleted: 0, pending: true, reactions: [] };
  if (!messages[currentChatId]) messages[currentChatId] = [];
  messages[currentChatId].push(opt);
  renderMessages();
  const payload = { chatId: currentChatId, text, clientId };
  if (replyToMsg) payload.replyTo = replyToMsg;
  await idb.put('outbox', { clientId, chatId: currentChatId, text, replyTo: opt.replyTo, timestamp: opt.timestamp });
  $('msgInput').value = ''; await idb.del('drafts', currentChatId); replyToMsg = null; $('msgInput').placeholder = t('msg_ph');
  if (!sendWS({ type:'newMessage', payload })) sendQueue.push(payload);
  setTimeout(() => { if (opt.pending) { opt.pending = false; opt.failed = !isOnline; if (currentChatId === opt.chatId) renderMessages(); } }, 8000);
  setTimeout(() => $('msgInput').focus(), 50);
}
let sendLock = false;
function sendTap(e) { if (e.type === 'touchstart') { e.preventDefault(); if (sendLock) return; sendLock = true; sendMsg(); setTimeout(() => sendLock = false, 300); } else { if (sendLock) return; sendMsg(); } }
$('sendBtn').addEventListener('touchstart', sendTap, { passive:false });
$('sendBtn').addEventListener('click', sendTap);
function retryMsg(clientId) {
  const arr = messages[currentChatId]; if (!arr) return;
  const m = arr.find(x => x.clientId === clientId); if (!m) return;
  m.failed = false; m.pending = true;
  const payload = { chatId: currentChatId, text: m.text, clientId };
  if (m.replyTo) payload.replyTo = m.replyTo;
  if (!sendWS({ type:'newMessage', payload })) sendQueue.push(payload);
  renderMessages();
}
async function flushOutbox() {
  if (!isOnline || !ws || ws.readyState !== 1) return;
  const list = await idb.all('outbox');
  for (const item of list) { try { ws.send(JSON.stringify({ type:'newMessage', payload: { chatId: item.chatId, text: item.text, clientId: item.clientId, replyTo: item.replyTo } })); } catch {} }
  if (list.length) toast('', t('info_sent_from_queue'));
}

// Pull-to-refresh
(function setupPullToRefresh() {
  let startY = 0, pulling = false;
  const content = $('mainContent');
  content.addEventListener('touchstart', e => { if (content.scrollTop === 0) { startY = e.touches[0].clientY; pulling = true; } }, { passive:true });
  content.addEventListener('touchmove', e => {
    if (!pulling) return;
    const dy = e.touches[0].clientY - startY;
    if (dy > 0 && dy < 120) { $('pullIndicator').classList.add('show'); $('pullIndicator').textContent = dy > 60 ? t('release') : t('drag_down'); }
  });
  content.addEventListener('touchend', async e => {
    if (!pulling) return;
    const dy = (e.changedTouches[0]?.clientY || 0) - startY;
    $('pullIndicator').classList.remove('show');
    if (dy > 60) { $('pullIndicator').textContent = t('updating'); $('pullIndicator').classList.add('show'); await loadChats(); setTimeout(() => $('pullIndicator').classList.remove('show'), 600); }
    pulling = false;
  });
})();

async function doSearch() {
  const q = $('searchInput').value.trim();
  if (!q) { showSearchHistory(); return; }
  if (q.length < 2) { $('searchResults').innerHTML = `<div class="empty">${t('search_start')}</div>`; return; }
  if (!isOnline) { $('searchResults').innerHTML = `<div class="empty">${t('info_you_offline')}</div>`; return; }
  try {
    const r = await api(`/api/search?q=${encodeURIComponent(q)}`);
    await idb.put('search_history', { q, time: new Date().toISOString() });
    const { users, chats: groups } = r;
    let html = '';
    if (users.length) {
      html += `<div class="info-section-title">${t('section_users')}</div>`;
      users.forEach(u => { html += `<div class="member" data-type="user" data-login="${esc(u.login)}"><div class="minfo"><div class="mav" style="background:${avatarBg(u)}">${avatarInner(u)}</div><div class="mtxt"><div class="mname">${u.nicknameEmoji ? `<span class="emj" style="color:${u.nicknameEmojiColor||ui.accentColor}">${esc(u.nicknameEmoji)}</span>` : ''}${esc(u.nickname)}</div><div class="mlogin">@${esc(u.login)}</div></div></div></div>`; });
    }
    if (groups.length) {
      html += `<div class="info-section-title">${t('section_groups')}</div>`;
      groups.forEach(g => { html += `<div class="member" data-type="group" data-id="${g.id}" data-login="${esc(g.login||'')}"><div class="minfo"><div class="mav" style="background:linear-gradient(135deg,var(--accent),var(--accent-2))"><span style="color:#fff">#</span></div><div class="mtxt"><div class="mname">${esc(g.name)}</div><div class="mlogin">@${esc(g.login||'')} · ${g.membersCount} ${t('members_short')}</div></div></div></div>`; });
    }
    if (!html) html = `<div class="empty">${t('search_empty')}</div>`;
    $('searchResults').innerHTML = html;
    $('searchResults').querySelectorAll('.member').forEach(el => {
      el.onclick = () => {
        closeModal('searchModal');
        if (el.dataset.type === 'user') { $('dialogLoginInput').value = el.dataset.login; $('dialogErr').textContent = ''; $('dialogModal').classList.add('active'); }
        else {
          const found = chats.find(c => c.id === el.dataset.id);
          if (found) openChat(el.dataset.id);
          else api(`/api/chats/find/${encodeURIComponent(el.dataset.login)}`).then(c => {
            currentChatId = c.id; currentChatMeta = { ...c, isGroup: true, isAdmin: false, notMember: !c.isMember };
            $('chatName').textContent = (c.name || '?').toUpperCase();
            $('chatSub').textContent = `${c.membersCount} ${t('participants')} · @${c.login}`;
            updateJoinBar(currentChatMeta); $('messagesArea').innerHTML = ''; $('screenChat').classList.add('active');
          }).catch(e => toast('', errText(e.code || 'server_error')));
        }
      };
    });
  } catch (e) { $('searchResults').innerHTML = `<div class="empty">${errText(e.code || 'server_error')}</div>`; }
}

async function createDialog() {

  const err = $('dialogErr'); err.textContent = '';
  if (!login) return err.textContent = t('err_login_required');
  try { const d = await api('/api/chats', { method:'POST', body: JSON.stringify({ login }) }); closeModal('dialogModal'); await loadChats(); if (d.chatId) setTimeout(() => openChat(d.chatId), 100); }
  catch (e) { err.textContent = errText(e.code || 'server_error'); }
}
$('dialogLoginInput').addEventListener('keydown', e => { if (e.key === 'Enter') createDialog(); });
$('addBtn').onclick = () => $('createModal').classList.add('active');
function openGroupCreate() { groupKind = 'group'; openGroupModal(t('group_title')); }
function openChannelCreate() { groupKind = 'channel'; openGroupModal(t('channel_title')); }
function openGroupModal(title) {
  closeModal('createModal');
  $('groupModalTitle').textContent = title;
  $('groupNameInput').value = ''; $('groupLoginInput').value = ''; $('groupMemberInput').value = '';
  $('groupErr').textContent = ''; $('groupPublish').checked = false; groupDraft = []; renderGroupDraft();
  $('groupModal').classList.add('active');
}
function renderGroupDraft() {
  const el = $('groupMembersList');
  if (!groupDraft.length) { el.innerHTML = `<div style="color:var(--text3);font-size:11px;font-style:italic;padding:4px 0;text-align:center">${t('no_saved')}</div>`; return; }
  el.innerHTML = groupDraft.map((m, i) => `<div class="member"><div class="minfo"><div class="mav" style="background:var(--glass-3)">${esc((m.nickname||'?')[0])}</div><div class="mtxt"><div class="mname">${esc(m.nickname)}</div><div class="mlogin">@${esc(m.login)}</div></div></div><button class="kick" data-i="${i}">✕</button></div>`).join('');
  el.querySelectorAll('.kick').forEach(b => b.onclick = () => { groupDraft.splice(+b.dataset.i, 1); renderGroupDraft(); });
}
async function addGroupMember() {
  const login = $('groupMemberInput').value.trim().replace(/^@/, '');
  const err = $('groupErr'); err.textContent = '';
  if (!login) return err.textContent = t('err_login_required');
  if (login.toLowerCase() === currentUser.login.toLowerCase()) return err.textContent = t('err_cant_add_self');
  if (groupDraft.find(m => m.login.toLowerCase() === login.toLowerCase())) return err.textContent = t('err_already_member');
  try {
    const r = await api(`/api/search?q=${encodeURIComponent(login)}`);
    const u = r.users.find(x => x.login.toLowerCase() === login.toLowerCase());
    if (!u) return err.textContent = t('err_user_not_found');
    groupDraft.push({ login: u.login, nickname: u.nickname || u.login });
    $('groupMemberInput').value = ''; renderGroupDraft();
  } catch (e) { err.textContent = errText(e.code || 'server_error'); }
}
$('groupMemberInput').addEventListener('keydown', e => { if (e.key === 'Enter') addGroupMember(); });
async function createGroup() {
  const name = $('groupNameInput').value.trim(), login = $('groupLoginInput').value.trim();
  const published = $('groupPublish').checked;
  const err = $('groupErr'); err.textContent = '';
  if (!name) return err.textContent = t('err_name_length');
  if (!login) return err.textContent = t('err_login_required');
  try {
    const d = await api('/api/groups', { method:'POST', body: JSON.stringify({ name, login, members: groupDraft.map(m => m.login), isChannel: groupKind === 'channel', isPrivate: false, published }) });
    closeModal('groupModal'); await loadChats();
    if (d.chatId) setTimeout(() => openChat(d.chatId), 100);
  } catch (e) { err.textContent = errText(e.code || 'server_error', e.extra); }
}
$('joinBtn').onclick = async () => {
  if (!currentChatId) return;
  try {
    await api(`/api/chats/${currentChatId}/join`, { method:'POST' });
    currentChatMeta.notMember = false;
    await loadChats();
    const chat = chats.find(c => c.id === currentChatId);
    if (chat) { currentChatMeta = chat; updateChatHeader(chat); updateJoinBar(chat); }
    messages[currentChatId] = await api(`/api/chats/${currentChatId}/messages`);
    renderMessages();
  } catch (e) { toast('', errText(e.code || 'server_error')); }
};

async function openInfoChat(chat) {
  if (!chat || !chat.id) return;
  if (!isOnline) return toast('', t('info_you_offline'));
  try {
    const info = await api(`/api/chats/${chat.id}/info`);
    const isGroup = info.type === 'group';
    const isChannel = info.isChannel;
    $('infoChatTitle').textContent = isChannel ? t('info_channel_title') : t('info_chat_title');
    let membersHtml = '';
    if (isGroup) {
      const admins = info.membersInfo.filter(m => m.isAdmin || m.isOwner);
      const users = info.membersInfo.filter(m => !m.isAdmin && !m.isOwner);
      if (isChannel) membersHtml = `<div class="info-section-title">${t('section_admins')}</div>` + admins.map(renderMemberRow).join('');
      else { membersHtml = admins.length ? `<div class="info-section-title">${t('section_admins')}</div>` + admins.map(renderMemberRow).join('') : ''; membersHtml += users.length ? `<div class="info-section-title">${t('section_members')}</div>` + users.map(renderMemberRow).join('') : ''; }
    } else {
      const other = info.membersInfo.find(m => m.login !== currentUser.login);
      membersHtml = `<div class="info-section-title">${t('section_members')}</div>`;
      if (other) membersHtml += renderMemberRow(other);
    }
    $('infoChatContent').innerHTML = `
      <div style="text-align:center;margin-bottom:16px">
        <div style="font-family:var(--font-head);font-size:18px;font-weight:700;color:var(--accent);margin-bottom:4px">${esc(info.name || '')}</div>
        ${info.login ? `<div style="font-size:12px;color:var(--text3);font-weight:500">@${esc(info.login)}</div>` : ''}
        ${isGroup ? `<div style="font-size:11px;color:var(--text3);margin-top:4px;font-style:italic">${info.membersCount} ${t('participants')}${info.published ? ' · 🌐' : ''}</div>` : ''}
      </div>
      ${membersHtml}
    `;
    $('infoChatModal').classList.add('active');
  } catch (e) { toast('', errText(e.code || 'server_error')); }
}
function renderMemberRow(m) {
  const tag = m.isOwner ? `<span class="mtag">OWNER</span>` : m.isAdmin ? `<span class="mtag">ADMIN</span>` : '';
  const emj = m.nicknameEmoji ? `<span class="emj" style="color:${m.nicknameEmojiColor||ui.accentColor}">${esc(m.nicknameEmoji)}</span>` : '';
  return `<div class="member" data-user="${esc(m.login)}"><div class="minfo"><div class="mav" style="background:${avatarBg(m)}">${avatarInner(m)}</div><div class="mtxt"><div class="mname">${emj}${esc(m.nickname)} ${tag}</div><div class="mlogin">@${esc(m.login)}</div></div></div></div>`;

    }).join('');
    $('gsMembersList').querySelectorAll('.kick').forEach(b => b.onclick = async () => { if (!confirm('?')) return; try { await api(`/api/chats/${gsChatId}/members/${encodeURIComponent(b.dataset.login)}`, { method:'DELETE' }); openGroupSettings(); loadChats(); } catch (e) { $('gsErr').textContent = errText(e.code || 'server_error'); } });
    const saveFlags = async () => { try { await api(`/api/chats/${gsChatId}/flags`, { method:'PUT', body: JSON.stringify({ isPrivate: $('gsFlagPrivate').checked, isChannel: $('gsFlagChannel').checked, published: $('gsFlagPublish').checked }) }); loadChats(); toast('', $('gsFlagPublish').checked ? t('published') : t('unpublished')); } catch (e) { $('gsErr').textContent = errText(e.code || 'server_error'); } };
    $('gsFlagPrivate').onchange = $('gsFlagChannel').onchange = $('gsFlagPublish').onchange = saveFlags;
    $('groupSettingsModal').classList.add('active');
  } catch (e) { toast('', errText(e.code || 'server_error')); }
}
async function renameGroup() { const n = $('gsNameInput').value.trim(); if (!n) return; try { await api(`/api/chats/${gsChatId}/name`, { method:'PUT', body: JSON.stringify({ name: n }) }); $('gsErr').textContent = '✓'; setTimeout(() => $('gsErr').textContent = '', 1500); loadChats(); } catch (e) { $('gsErr').textContent = errText(e.code || 'server_error'); } }
async function changeGroupLogin() { const l = $('gsLoginInput').value.trim(); if (!l) return; try { await api(`/api/chats/${gsChatId}/login`, { method:'PUT', body: JSON.stringify({ login: l }) }); $('gsErr').textContent = '✓'; setTimeout(() => $('gsErr').textContent = '', 1500); loadChats(); } catch (e) { $('gsErr').textContent = errText(e.code || 'server_error'); } }
async function addMemberToGroup() { const login = $('gsAddInput').value.trim().replace(/^@/, ''); if (!login) return; try { await api(`/api/chats/${gsChatId}/members`, { method:'POST', body: JSON.stringify({ login }) }); $('gsAddInput').value = ''; openGroupSettings(); loadChats(); } catch (e) { $('gsErr').textContent = errText(e.code || 'server_error'); } }
async function leaveGroup() { if (!confirm(t('confirm_leave'))) return; try { await api(`/api/chats/${gsChatId}/leave`, { method:'POST' }); closeModal('groupSettingsModal'); if (currentChatId === gsChatId) { $('screenChat').classList.remove('active'); currentChatId = null; } loadChats(); } catch (e) { $('gsErr').textContent = errText(e.code || 'server_error'); } }
async function deleteGroup() {
  if (!confirm(t('confirm_delete_chat'))) return;
  if (!sendWS({ type:'deleteChat', payload:{ chatId: gsChatId } })) { try { await api(`/api/chats/${gsChatId}`, { method:'DELETE' }); } catch (e) { return $('gsErr').textContent = errText(e.code || 'server_error'); } }
  closeModal('groupSettingsModal');
  if (currentChatId === gsChatId) { $('screenChat').classList.remove('active'); currentChatId = null; }
  loadChats();
}

// ============================================================
//  Контекст чата
// ============================================================
async function showChatCtx(x, y, chatId) {
  const chat = chats.find(c => c.id === chatId); if (!chat) return;
  const muted = await idb.get('muted', chatId);
  const items = [];
  if (chat.isGroup) items.push({ label: '⚙ ' + t('gs_title'), fn: () => { currentChatMeta = chat; openGroupSettings(); } });
  items.push({ label: (muted ? '🔔 ' + t('notif_on') : '🔕 ' + t('notif_off')), fn: async () => { if (muted) await idb.del('muted', chatId); else await idb.put('muted', { chatId }); toast('', muted ? t('notif_on') : t('notif_off')); } });
  if (chat.isGroup && !chat.isAdmin) items.push({ label: '↩ ' + t('btn_leave'), danger:true, fn: async () => { if (confirm(t('confirm_leave'))) { try { await api(`/api/chats/${chatId}/leave`, { method:'POST' }); loadChats(); } catch (e) { toast('', errText(e.code || 'server_error')); } } } });
  const canDel = !chat.isGroup || chat.isAdmin;
  if (canDel) items.push({ label: '🗑 ' + t('btn_delete'), danger:true, fn: () => { if (!confirm(t('confirm_delete'))) return; if (!sendWS({ type:'deleteChat', payload:{ chatId } })) api(`/api/chats/${chatId}`, { method:'DELETE' }).then(loadChats).catch(e => toast('', errText(e.code || 'server_error'))); } });
  if (!items.length) return;
  $('ctxMenu').innerHTML = items.map((it, i) => `<button data-i="${i}" class="${it.danger ? 'danger' : ''}">${it.label}</button>`).join('');
  $('ctxMenu').querySelectorAll('button').forEach(b => b.onclick = () => { hideCtx(); items[+b.dataset.i].fn(); });
  $('ctxMenu').style.left = Math.min(x, window.innerWidth - 200) + 'px';
  $('ctxMenu').style.top = Math.min(y, window.innerHeight - 200) + 'px';
  $('ctxMenu').classList.add('active');
}
function hideCtx() { $('ctxMenu').classList.remove('active'); }
document.addEventListener('click', e => { if (!$('ctxMenu').contains(e.target)) hideCtx(); });

function closeModal(id) { $(id).classList.remove('active'); }
function closeAllOverlays() { document.querySelectorAll('.ov').forEach(o => o.classList.remove('active')); }
document.querySelectorAll('.ov').forEach(o => o.addEventListener('click', e => { if (e.target === o) o.classList.remove('active'); }));

// ============================================================
//  Уведомления
// ============================================================
function showNotification(chatName, senderName, text, chatId) {
  if (currentChatId === chatId && document.visibilityState === 'visible') return;
  const title = chatName === senderName ? senderName : `${chatName} · ${senderName}`;
  addToast(title, text.length > 60 ? text.slice(0,58) + '…' : text, chatId);
  if (document.visibilityState === 'hidden' && 'Notification' in window && Notification.permission === 'granted') {
    try { const n = new Notification(title, { body: text.slice(0,60), icon: '/icon-192.png', tag: 'krista_' + chatId }); n.onclick = () => { window.focus(); openChat(chatId); n.close(); }; } catch {}
  }
}
function addToast(title, text, chatId) {
  const el = document.createElement('div'); el.className = 't';
  el.innerHTML = `<div class="ico">💬</div><div class="bd">${title ? `<div class="tt">${esc(title)}</div>` : ''}<div class="tx">${esc(text)}</div></div>`;
  el.onclick = () => { closeToast(el); if (chatId) openChat(chatId); };
  $('toasts').appendChild(el);
  setTimeout(() => closeToast(el), 5000);
}
function closeToast(el) { if (!el.parentNode) return; el.classList.add('closing'); setTimeout(() => el.parentNode?.removeChild(el), 250); }
function toast(title, text) { addToast(title, text, null); }
if ('Notification' in window && Notification.permission === 'default') setTimeout(() => Notification.requestPermission().catch(() => {}), 3000);
let audioCtx = null;
function beep() { try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.type = 'sine'; o.frequency.value = 880; g.gain.setValueAtTime(0.0001, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.06, audioCtx.currentTime + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.15); o.start(); o.stop(audioCtx.currentTime + 0.16); } catch {} }
$('logoBtn').onclick = openDiagnostics;

// ============================================================
//  Аккаунты
// ============================================================
function saveAccount(acc) { accounts = accounts.filter(a => a.login !== acc.login); accounts.unshift(acc); if (accounts.length > 4) accounts = accounts.slice(0, 4); saveAccList(); }
function saveAccList() { localStorage.setItem('krista_accounts', JSON.stringify(accounts)); }
async function switchAccount(i) {
  const a = accounts[i]; if (!a) return;
  if (ws) { try { ws.close(); } catch {} ws = null; }
  stopHeartbeat(); if (reconnectTimer) clearTimeout(reconnectTimer);
  token = a.token; localStorage.setItem('krista_token', token);
  currentUser = { login: a.login, nickname: a.nickname || a.login };
  localStorage.setItem('krista_user', JSON.stringify(currentUser));
  messages = {}; chats = []; currentChatId = null; onlineStatus = {}; sendQueue = [];
  $('screenChat').classList.remove('active');
  applyUI(); showScreen('main'); switchTab('Chats'); connectWS(); loadChats();
  toast('', '@' + a.login);
}
function addAccount() { closeAllOverlays(); logout(); switchAuthTab('login'); }
function openDiagnostics() {
  const items = [['WS', wsState === 'online' ? 'ONLINE' : wsState.toUpperCase()],['Online', isOnline ? 'yes' : 'no'],['Queue', sendQueue.length],['Login', currentUser?.login || '—'],['Chats', chats.length]];
  $('diagList').innerHTML = items.map(([k, v]) => `<div class="dr"><span class="l">${k}</span><span class="v">${esc(String(v))}</span></div>`).join('');
  $('diagModal').classList.add('active');
}
function copyDiagnostics() { navigator.clipboard?.writeText($('diagList').innerText).then(() => toast('', t('info_copied'))); }

// ============================================================
//  Logout / Delete
// ============================================================
async function logout() {
  token = null; localStorage.removeItem('krista_token'); localStorage.removeItem('krista_user');
  currentUser = null;
  if (ws) { try { ws.close(); } catch {} ws = null; }
  stopHeartbeat(); if (reconnectTimer) clearTimeout(reconnectTimer);
  chats = []; messages = {}; currentChatId = null; onlineStatus = {}; sendQueue = [];
  $('screenChat').classList.remove('active'); closeAllOverlays();
  showScreen('login');
  ['authLogin','authPassword','authConfirm','authNickname'].forEach(id => $(id).value = '');
  $('authError').textContent = '';
  switchAuthTab('login');
}
async function deleteAccount() {
  if (!confirm(t('confirm_delete_account'))) return;
  try {
    await api('/api/me', { method:'DELETE' });
    accounts = accounts.filter(a => a.login !== currentUser.login); saveAccList();
    await idb.clear('chats'); await idb.clear('messages'); await idb.clear('outbox'); await idb.clear('drafts');
    setTimeout(logout, 500);
  } catch (e) { toast('', errText(e.code || 'server_error')); }
}

// ============================================================
//  Клавиатура (ПК)
// ============================================================
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'k') { e.preventDefault(); $('searchBtn').click(); }
  if (e.key === 'Escape') {
    if ($('screenChat').classList.contains('active')) { $('backBtn').click(); return; }
    closeAllOverlays(); hideCtx(); hideMsgActions();
  }
});

// ============================================================
//  Свайп от края
// ============================================================
(function setupEdgeSwipe() {
  let startX = 0, startY = 0, tracking = false;
  document.addEventListener('touchstart', e => {
    const x = e.touches[0].clientX;
    if (x < 30 && $('screenChat').classList.contains('active')) { startX = x; startY = e.touches[0].clientY; tracking = true; }
  }, { passive:true });
  document.addEventListener('touchend', e => {
    if (!tracking) return;
    const dx = (e.changedTouches[0]?.clientX || 0) - startX;
    const dy = Math.abs((e.changedTouches[0]?.clientY || 0) - startY);
    if (dx > 70 && dy < 60) $('backBtn').click();
    tracking = false;
  });
})();

// ============================================================
//  Клавиатура (visualViewport)
// ============================================================
(function setupViewport() {
  if (!window.visualViewport) return;
  const vv = window.visualViewport;
  let raf = null;
  function update() {
    if (raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const kbHeight = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      if (kbHeight > 80) {
        app.style.height = vv.height + 'px';
        app.style.maxHeight = vv.height + 'px';
        if (currentChatId) setTimeout(() => { const a = $('messagesArea'); if (a) a.scrollTop = a.scrollHeight; }, 30);
      } else { app.style.height = ''; app.style.maxHeight = ''; }
    });
  }
  vv.addEventListener('resize', update);
  vv.addEventListener('scroll', update);
  window.addEventListener('orientationchange', () => setTimeout(update, 200));
  $('msgInput').addEventListener('focus', () => setTimeout(update, 250));
  $('msgInput').addEventListener('blur', () => setTimeout(update, 250));
})();

// ============================================================
//  Старт
// ============================================================
(async function init() {
  try { await openIDB(); } catch (e) {}
  applyUI();
  applyTranslations();
  buildEmojiGrid();
  updateOnlineStatus();
  const cachedUser = await idb.get('kv', 'user');
  if (!currentUser && cachedUser?.v) currentUser = cachedUser.v;
  if (!token) { showScreen('login'); return; }
  if (currentUser) { showScreen('main'); switchTab('Chats'); }
  else showScreen('loading');
  const cachedChats = await idb.all('chats');
  if (cachedChats.length) { chats = cachedChats; renderChats(); }
  if (!isOnline) return;
  try {
    const me = await apiRetry('/api/me');
    currentUser = me; localStorage.setItem('krista_user', JSON.stringify(me));
    await idb.put('kv', { k:'user', v: me });
    applyUI(); showScreen('main'); switchTab('Chats');
    connectWS();
    await loadChats();
    await flushOutbox();
  } catch (e) {
    if (e.status === 401 || e.status === 404) logout();
    else if (currentUser) { showScreen('main'); switchTab('Chats'); connectWS(); loadChats().catch(() => {}); }
    else showScreen('login');
  }
})();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
